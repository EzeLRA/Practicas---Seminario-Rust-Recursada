<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 72px;
}
.code-line {
  margin: 0;
  height: 1em;
  counter-increment: line;

  position: absolute;
  padding: 0 0.3em 0.3em 0.3em;
  display: inherit;
  width: 100%;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

.code-text-container {
  position: relative;
  height: 1em;
  padding: 0.3em 0;
}

.cover-indicator {
  display: flex;
  width: 100%;
  position: absolute;
  justify-content: end;
  height: 1em;
  align-items: center;
  padding: 0 0.3em 0.3em 0.3em;
}

.cover-indicator.check-cover::after {
  content: "\2713";
  font-weight: bold;
  background-color: var(--green);
  height: 1em;
}

.cover-indicator.no-cover::after {
  content: "\2716";
  font-weight: bold;
  background-color: var(--red);
  height: 1em;
}

.stat-line-hit {
  max-width: 48px;
  overflow: hidden;
  font-weight: bold;
  margin-right: 4px;
  background-color: var(--green);
  position: relative;
  top: 0.1em;
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

        var data = {"files":[{"path":["/","home","e_248m","Documents","Programas","Programas Rust","Practicas---Seminario-Rust-Recursada","TP5","src","main.rs"],"content":"mod tp5;\n\nfn main() {\n    \n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","e_248m","Documents","Programas","Programas Rust","Practicas---Seminario-Rust-Recursada","TP5","src","tp5","ej1.rs"],"content":"use std::{fmt::Display, path};\nuse serde::{Serialize, Deserialize};\nuse serde_json;\nuse std::{fs::File, io::{Error, Read, Write}};\nuse std::io;\n\n/*\n\tNueva implementacion - Ejercicio1\n*/\n\n/*\n\tTipos de errores\n*/\n#[derive(Debug,PartialEq)]\nenum error_baja{\n\tInexistente(String),\n\tEstructuraVacia(String)\n}\n\nimpl Display for error_baja{\n\tfn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n\t\tmatch self{\n\t\t\terror_baja::Inexistente(val) =\u003e write!(f, \"No se encontro el auto en la consecionaria {} \",val),\n\t\t\terror_baja::EstructuraVacia(val) =\u003e write!(f, \"La consecionaria {} no dispone de autos \",val)\n\t\t}\n\t}\n}\n\n#[derive(Debug)]\nstruct error_capacidad(String);\nimpl Display for error_capacidad{\n\tfn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n\t\twrite!(f, \"La Capacidad de autos para la consecionaria {} fue superada\" , self.0)\n\t}\n}\n\n#[derive(Debug)]\nenum Errores{\n\tErrorBaja(error_baja),\n\tErrorExistencia,\n\tErrorCapacidad(error_capacidad),\n\tErrorIO(io::Error),\n\tErrorSerde(serde_json::Error)\n}\nimpl Display for Errores{\n\tfn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n\t\tmatch self {\n\t\t\tErrores::ErrorBaja(err) =\u003e write!(f,\"{}\",err),\n\t\t\tErrores::ErrorExistencia =\u003e write!(f, \"Ya existe un auto con tales caracteristicas\"),\n\t\t\tErrores::ErrorCapacidad(err) =\u003e write!(f,\"{}\",err),\n\t\t    Errores::ErrorIO(err) =\u003e write!(f, \"Error de E/S al guardar: {}\", err),\n            Errores::ErrorSerde(err) =\u003e write!(f, \"Error de serialización: {}\", err)\n\t\t}\n\t}\n}\n//Implementacion para el uso del operador (?)\nimpl std::error::Error for Errores {}\n\n//Implementacion automatica errores subyacentes\nimpl From\u003cio::Error\u003e for Errores {\n    fn from(err: io::Error) -\u003e Self {\n        Errores::ErrorIO(err)\n    }\n}\n\nimpl From\u003cserde_json::Error\u003e for Errores {\n    fn from(err: serde_json::Error) -\u003e Self {\n        Errores::ErrorSerde(err)\n    }\n}\n\n/*\n\tExtraccion del ejercicio 7 - TP3 \n\t\"Correcciones hechas a partir de feedbacks a partir del entregable de la primer fecha , solo aplicadas\n\ta la implementacion original\"\n\tConsideracion: Se aplican las nuevas funciones sobre el struct base (Concesionaria)\n*/\n\n//Enum\n#[derive( Serialize, Deserialize,Debug,Clone)]\nenum Colores{\t\n\t//Primarios\n\tRojo,\n\tAzul,\n\tAmarillo,\n\t//Secundarios\n\tVerde,\n\tBlanco,\n\tNegro\n}\n//Funcionalidad del enum\nimpl Colores{\n\t//Determina si es primario o secundario\n\tpub fn es_primario(\u0026self)-\u003ebool{\n\t\tmatches!(self, Colores::Rojo | Colores::Azul | Colores::Amarillo)\n\t}\n\tpub fn es_igual_a(\u0026self, c: \u0026Colores) -\u003e bool {\n        match (self, c) {\n            (Colores::Rojo, Colores::Rojo) =\u003e true,\n            (Colores::Azul, Colores::Azul) =\u003e true,\n            (Colores::Verde, Colores::Verde) =\u003e true,\n\t\t\t(Colores::Amarillo, Colores::Amarillo) =\u003e true,\n\t\t\t(Colores::Blanco, Colores::Blanco) =\u003e true,\n\t\t\t(Colores::Negro, Colores::Negro) =\u003e true,\n            _ =\u003e false\n        }\n    }\n}\n\n//Atributos\n#[derive(Debug,Clone,Serialize,Deserialize)]\nstruct Auto{\n    marca : String,\n    modelo : String,\n    anio : u32,\n    precio_bruto : f32,\n    color : Colores\n}\n\n#[derive(Serialize, Deserialize, Debug)]\nstruct ConcesionarioAuto{\n\tnombre : String,\n\tdireccion : String,\n\tcapacidad : u32,\n\tautos : Vec\u003cAuto\u003e,\n\tpath : String\n}\n\n//Metodos\nimpl Auto{\n\t\n\tpub fn new(nom:\u0026str,model:\u0026str,anio_in:u32,precio:f32,color_in:Colores)-\u003eAuto{\n\t\treturn Auto{\n\t\t\tmarca : nom.to_string(),\n\t\t\tmodelo : model.to_string(),\n\t\t\tanio : anio_in,\n\t\t\tprecio_bruto : precio,\n\t\t\tcolor : color_in\n\t\t}\n\t}\n\n\tpub fn calcular_precio(\u0026self)-\u003ef32{\n\t\tlet mut recargo : f32 = 0.0;\n\t\tlet mut descuento : f32 = 0.0;\n\n\t\tif self.color.es_primario() {\n\t\t\trecargo += (self.precio_bruto * 25.0)/100.0; \n\t\t}else{\n\t\t\tdescuento += (self.precio_bruto * 10.0)/100.0;\n\t\t}\n\n\t\tif self.marca == \"BMW\" {\n\t\t\trecargo += (self.precio_bruto * 15.0)/100.0\n\t\t}\n\n\t\tif self.anio \u003c 2000 {\n\t\t\tdescuento += (self.precio_bruto * 5.0)/100.0;\n\t\t}\n\n\t\treturn self.precio_bruto + recargo - descuento;\n\t}\n\n\t//Metodos secundarios\n\tpub fn get_marca(\u0026self)-\u003e\u0026String{\n\t\treturn \u0026self.marca\n\t}\n\tpub fn get_modelo(\u0026self)-\u003e\u0026String{\n\t\treturn \u0026self.modelo\n\t}\n\tpub fn get_anio(\u0026self)-\u003eu32{\n\t\treturn self.anio\n\t}\n\tpub fn get_precio_bruto(\u0026self)-\u003ef32{\n\t\treturn self.precio_bruto\n\t}\n\tpub fn get_color(\u0026self)-\u003e\u0026Colores{\n\t\treturn \u0026self.color\n\t}\n\tpub fn es_igual_a(\u0026self,a:\u0026Auto)-\u003ebool{\n\t\treturn (\u0026self.marca == a.get_marca())\u0026\u0026(\u0026self.modelo == a.get_modelo())\u0026\u0026(self.anio == a.get_anio())\u0026\u0026(self.precio_bruto == a.get_precio_bruto())\u0026\u0026(self.color.es_igual_a(\u0026a.get_color()));\n\t}\n\n}\n\nimpl ConcesionarioAuto{\n\t//Metodos secundarios\n\tpub fn get_nombre(\u0026self)-\u003e\u0026String{\n\t\treturn \u0026self.nombre\n\t}\n\tpub fn get_direccion(\u0026self)-\u003e\u0026String{\n\t\treturn \u0026self.direccion\n\t}\n\tpub fn get_capacidad(\u0026self)-\u003eu32{\n\t\treturn self.capacidad\n\t}\n\tpub fn es_igual_a(\u0026self,c:\u0026ConcesionarioAuto)-\u003ebool{\n\t\treturn (\u0026self.nombre == c.get_nombre())\u0026\u0026(\u0026self.direccion == c.get_direccion())\u0026\u0026(self.capacidad == c.get_capacidad());\n\t}\n\t//Metodos primarios\n\tpub fn new(nom:\u0026str,dir:\u0026str,cant:u32,path_in:\u0026str)-\u003eConcesionarioAuto{\n\t\tlet autos_lista : Vec\u003cAuto\u003e = match ConcesionarioAuto::recuperar_informacion(\u0026path_in){\n\t\t\tOk(dato) =\u003e {\n                dato\n            }\n            Err(_) =\u003e {\n                Vec::new()\n            }\n\t\t};\n\t\treturn ConcesionarioAuto{\n\t\t\tnombre : nom.to_string(),\n\t\t\tdireccion : dir.to_string(),\n\t\t\tcapacidad : cant,\n\t\t\tautos: autos_lista,\n\t\t\tpath: path_in.to_string()\n\t\t}\n\t}\n\t/*\n\t\tNuevos metodos del tp5\n\t*/\n\tfn recuperar_informacion(path:\u0026str)-\u003e Result\u003cVec\u003cAuto\u003e,Errores\u003e{\n\t\tlet file = File::open(path).map_err(Errores::ErrorIO)?;\n\t\tlet autos: Vec\u003cAuto\u003e = serde_json::from_reader(file).map_err(Errores::ErrorSerde)?;\n\t\tOk(autos)\n\t}\n\tfn guardar_informacion(\u0026self) -\u003e Result\u003c(), Errores\u003e {\n\t    let mut file = File::create(\u0026self.path)?;\n\t    let serialized = serde_json::to_string(\u0026self.autos)?;\n        file.write_all(serialized.as_bytes())?;\n\t\treturn Ok(())\n    }\n\t//Agrega el auto recibido y no pueden existir repetidos dentro de la consecionaria\n\tpub fn agregar_auto(\u0026mut self,auto:Auto)-\u003eResult\u003c(),Errores\u003e{\n\t\tif (self.autos.len() as u32) \u003c self.capacidad {\n\t\t\tfor a in \u0026self.autos{\n\t\t\t\tif a.es_igual_a(\u0026auto){\n\t\t\t\t\treturn Err(Errores::ErrorExistencia)\n\t\t\t\t}\n\t\t\t}\n\t\t\tself.autos.push(auto);\n\t\t\tself.guardar_informacion()?;\n\t\t\treturn Ok(())\n\t\t}\n\t\treturn Err(Errores::ErrorCapacidad(error_capacidad(self.get_nombre().clone())));\n\t}\n\t//Elimina un auto con las caracteristicas exactas\n\tpub fn eliminar_auto(\u0026mut self,a1:\u0026Auto)-\u003eResult\u003c(), Errores\u003e{\n\t\tif !self.autos.is_empty() {\n\t\t\tlet mut pos = None;\n\t\t\tfor i in 0..self.autos.len(){\n\t\t\t\tif self.autos[i].es_igual_a(\u0026a1) {\n\t\t\t\t\tpos = Some(i);\n\t\t\t\t\tbreak;\n\t\t\t\t}\n\t\t\t}\n\t\t\tif let Some(pos_in) = pos{\n\t\t\t\tself.autos.remove(pos_in);\n\t\t\t\tself.guardar_informacion()?;\n\t\t\t\treturn Ok(())\n\t\t\t}\n\t\t\treturn Err(Errores::ErrorBaja(error_baja::Inexistente(self.get_nombre().clone())))\n\t\t}\n\t\treturn Err(Errores::ErrorBaja(error_baja::EstructuraVacia(self.get_nombre().clone())))\n\t}\n\t\n\t//Busca un auto con las caracteristicas exactas\n\tpub fn buscar_auto(\u0026self,a1:\u0026Auto)-\u003eOption\u003c\u0026Auto\u003e{\n\t\tlet mut res = None;\n\t\tif !self.autos.is_empty() {\n\t\t\tfor auto in \u0026self.autos{\n\t\t\t\tif auto.es_igual_a(\u0026a1) {\n\t\t\t\t\tres = Some(auto);\n\t\t\t\t\tbreak;\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t\treturn res;\n\t}\n}\n\n#[cfg(test)]\nmod testing_ejercicio1{\n\tuse crate::tp5::ej1::*;\n\n\t/*\n\t\tAuto\n\t*/\n\n\t#[test]\n\tfn creacion_auto(){\n\t\tlet a = Auto::new(\u0026\"asdf\",\u0026\"aytuiy\",2023,100432.0,Colores::Rojo);\n\t\tassert_eq!(a.es_igual_a(\u0026Auto::new(\u0026\"asdf\",\u0026\"aytuiy\",2023,100432.0,Colores::Rojo)),true);\n\t}\n\n\t#[test]\n\tfn calculo_precio_auto(){\n\t\t//Identificar colores primarios\n\t\tlet a1 = Auto::new(\u0026\"asd\",\u0026\"aytuiy\",2023,100000.0,Colores::Rojo);\n\t\tassert_eq!(a1.calcular_precio(), 125000.0);\n\n\t\tlet a1 = Auto::new(\u0026\"asd\",\u0026\"aytuiy\",2023,200000.0,Colores::Azul);\n\t\tassert_eq!(a1.calcular_precio(), 250000.0);\n\n\t\tlet a1 = Auto::new(\u0026\"asd\",\u0026\"aytuiy\",2023,300000.0,Colores::Amarillo);\n\t\tassert_eq!(a1.calcular_precio(), 375000.0);\n\t\t\n\t\t\n\t\t//Identificar colores secundarios\n\t\tlet a2 = Auto::new(\u0026\"asd\",\u0026\"aytuiy\",2023,100000.0,Colores::Verde);\n\t\tassert_eq!(a2.calcular_precio(), 90000.0);\n\n\t\tlet a2 = Auto::new(\u0026\"asd\",\u0026\"aytuiy\",2023,50000.0,Colores::Blanco);\n\t\tassert_eq!(a2.calcular_precio(), 45000.0);\n\n\t\tlet a2 = Auto::new(\u0026\"asd\",\u0026\"aytuiy\",2023,15000.0,Colores::Negro);\n\t\tassert_eq!(a2.calcular_precio(), 13500.0);\n\t\t\n\t\t\n\t\t//Identificar marca y conjunto de colores\n\t\tlet a_bmw = Auto::new(\u0026\"BMW\",\u0026\"aytuiy\",2023,100000.0,Colores::Verde);\n\t\tassert_eq!(a_bmw.calcular_precio(), 105000.0);\n\n\t\tlet a_bmw = Auto::new(\u0026\"BMW\",\u0026\"aytuiy\",2023,200000.0,Colores::Amarillo);\n\t\tassert_eq!(a_bmw.calcular_precio(), 280000.0);\n\n\n\t\t//Identificar antigüedad y conjunto de colores\n\t\tlet a_antiguo = Auto::new(\u0026\"asd\",\u0026\"aytuiy\",2000,100000.0,Colores::Rojo);\n\t\tassert_eq!(a_antiguo.calcular_precio(), 125000.0);\n\n\t\tlet a_antiguo = Auto::new(\u0026\"asd\",\u0026\"aytuiy\",1999,100000.0,Colores::Amarillo);\n\t\tassert_eq!(a_antiguo.calcular_precio(), 120000.0);\n\n\t\t//Reconocer condiciones mixtas\n\t\tlet a_mixto = Auto::new(\u0026\"BMW\",\u0026\"aytuiy\",1995,100000.0,Colores::Amarillo);\n\t\tassert_eq!(a_mixto.calcular_precio(), 135000.0);\n\t}\n\n\t/*\n\t\tConcensionaria\n\t*/\n\n\tfn crear_conjunto_autos()-\u003eVec\u003cAuto\u003e{\n\t\tlet mut res = Vec::new();\n\t\tlet auto1 = Auto::new(\u0026\"BMW\",\u0026\"a234\",1995,100000.0,Colores::Amarillo);\n\t\tlet auto2 = Auto::new(\u0026\"Piolita\",\u0026\"b321\",1999,100000.0,Colores::Verde);\n\t\tlet auto3 = Auto::new(\u0026\"Tesla\",\u0026\"c521\",2020,1000000.0,Colores::Negro);\n\t\tlet auto4 = Auto::new(\u0026\"Tojota\",\u0026\"f931\",2019,500000.0,Colores::Rojo);\n\t\tres.push(auto1);\n\t\tres.push(auto2);\n\t\tres.push(auto3);\n\t\tres.push(auto4);\n\t\treturn res\n\t}\n\n\t#[test]\n\tfn creacion_consecionaria(){\n\t\tlet conse1 = ConcesionarioAuto::new(\u0026\"Conse1\",\u0026\"Av1\",4,\"./lista_autos.json\");\n\t\tassert_eq!(conse1.es_igual_a(\u0026ConcesionarioAuto::new(\u0026\"Conse1\",\u0026\"Av1\",4,\"./lista_autos.json\")),true);\n\t}\n\n\t#[test]\n\tfn operatoria_consecionaria(){\n\t\tlet mut conse1 = ConcesionarioAuto::new(\u0026\"Conse1\",\u0026\"Av1\",4,\"./lista_autos.json\");\n\t\t//Agregar autos\n\t\tlet autos = crear_conjunto_autos();\n\t\tfor a in autos{\n\t\t\tassert!(conse1.agregar_auto(a).is_ok(),\"Aqui no debio fallar\");\n\t\t}\n\n\t\t//Intentar superar limite de espacio\n\t\tlet auto_nuevo = Auto::new(\u0026\"Bicho\",\u0026\"j221\",2020,1000000.0,Colores::Negro);\n\t\tassert!(conse1.agregar_auto(auto_nuevo.clone()).is_err_and(|e|{\n\t\t\t//Validar mensaje no nulo\n\t\t\tassert!(!e.to_string().is_empty());\n\t\t\tmatches!(e,Errores::ErrorCapacidad(_))\n\t\t}),\"Aquí debió fallar por superar la capacidad\");\n\t\t\n\t\t//Intentar borrar un auto no agregado\n\t\tassert!(conse1.eliminar_auto(\u0026auto_nuevo).is_err_and(|e|{\n\t\t\t//Validar mensaje no nulo\n\t\t\tassert!(!e.to_string().is_empty());\n\t\t\tmatches!(e, Errores::ErrorBaja(_))\n\t\t}),\"Aquí debió fallar el eliminar un auto inexistente\");\n\n\t\t//Continuar las operaciones con otra consecionaria \n\t\t//(Demostracion de persistencia - traslado de datos a otra instancia en caso de \"cambio\")\n\t\tlet mut conse2 = ConcesionarioAuto::new(\u0026\"Conse2\",\u0026\"Av2\",4,\"./lista_autos.json\");\n\n\t\t//Eliminar todos los autos\n\t\tlet autos = crear_conjunto_autos();\n\t\tfor a in autos{\n\t\t\tassert!(conse2.eliminar_auto(\u0026a).is_ok(),\"Aqui no debio fallar\");\n\t\t}\n\t\t//Intentar borrar un auto en una lista vacia\n\t\tassert!(conse2.eliminar_auto(\u0026auto_nuevo).is_err_and(|e| matches!(e, Errores::ErrorBaja(_))),\"Aquí debió fallar el eliminar un auto en una estructura vacia\");\n\n\t\t//Agregar y buscar un nuevo auto\n\t\tlet auto_nuevo = Auto::new(\u0026\"Bichito\",\u0026\"j221\",2020,1000000.0,Colores::Negro);\n\t\tassert!(conse2.agregar_auto(auto_nuevo.clone()).is_ok(),\"Aqui no debio fallar\");\n\n\t\tassert!(conse2.buscar_auto(\u0026auto_nuevo).is_some_and(|a|a.es_igual_a(\u0026auto_nuevo)) ,\"Aqui no tendria que haber fallado\");\n\n\t\tassert!(conse2.eliminar_auto(\u0026auto_nuevo).is_ok(),\"Aqui no debio fallar\");\n\t\tassert_eq!(conse2.buscar_auto(\u0026auto_nuevo).is_none(),true);\n\t}\n\n\t/*\n\t\tCasos especiales para la cobertura de coverage\n\t*/\n\t#[test]\n\tfn caso_especial_error_io() {\n\t\t// Se buscara forzar un ErrorIO usando una ruta cuyo directorio base NO EXISTE\n\t\tlet path_imposible = \"./carpeta_inexistente_123/autos.json\";\n\n\t\tlet mut conse = ConcesionarioAuto::new(\u0026\"ConseBackRoom\", \u0026\"Av 67\", 5, path_imposible);\n\t\tlet auto = Auto::new(\u0026\"Ford\", \u0026\"Ka\", 2015, 60000.0, Colores::Verde);\n\n\t\t// Al intentar agregar el auto, llamará internamente a File::create() en la ruta rota, provocando un ErrorIO\n\t\tassert!(conse.agregar_auto(auto).is_err_and(|e|{\n\t\t\tassert!(!e.to_string().is_empty());\n\t\t\tmatches!(e, Errores::ErrorIO(_))\n\t\t}),\"Aquí debió fallar\");\n\t}\n\n\t#[test]\n\tfn caso_especial_error_serde() {\n\t\tlet path_err = \"./corrupto.json\";\n\t\t\n\t\t// Se fuerza la escritura en el contenido temporal que NO cumple con el formato estructurado de un .JSON válido\n\t\tassert!(std::fs::write(path_err, \"{ \u0026\u00265435#$#$\u002642365_XXXX1234 : [::: \").is_ok(),\"No debio fallar aqui\");\n\n\t\t// Se invoca directamente el método para leer el archivo del path que buscara\n\n\t\tassert!(ConcesionarioAuto::recuperar_informacion(path_err).is_err_and(|e|{\n\t\t\tassert!(!e.to_string().is_empty());\n\t\t\tmatches!(e, Errores::ErrorSerde(_))\n\t\t}),\"Aquí debió fallar\");\n\n\t\tassert!(std::fs::remove_file(path_err).is_ok(),\"Error fuera de lo previsto\");\n\t\t\n\t}\n\n}\n","traces":[{"line":21,"address":[3231088],"length":1,"stats":{"Line":1}},{"line":22,"address":[3231120],"length":1,"stats":{"Line":1}},{"line":23,"address":[3231258],"length":1,"stats":{"Line":1}},{"line":24,"address":[3231133],"length":1,"stats":{"Line":0}},{"line":32,"address":[3232048],"length":1,"stats":{"Line":1}},{"line": {"Line":1}},{"line":269,"address":[3223773,3223742],"length":1,"stats":{"Line":2}},{"line":270,"address":[3223830],"length":1,"stats":{"Line":1}},{"line":271,"address":[3223850],"length":1,"stats":{"Line":1}},{"line":276,"address":[3223763],"length":1,"stats":{"Line":1}}],"covered":96,"coverable":101},{"path":["/","home","e_248m","Documents","Programas","Programas Rust","Practicas---Seminario-Rust-Recursada","TP5","src","tp5","ej2.rs"],"content":"use std::fmt::Display;\nuse serde::{Serialize, Deserialize};\nuse serde_json;\nuse std::{fs::File, io::{Error, Read, Write}};\nuse std::io;\n\n/*\n    Implementacion TP5 - Ej2\n*/\n\n/*\n\tTipos de errores\n*/\n#[derive(Debug)]\nenum error_operatoria{\n    SinDesplazamiento(String),\n\tInexistente(String),\n\tEstructuraVacia(String)\n}\n\nimpl Display for error_operatoria{\n\tfn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n\t\tmatch self{\n            error_operatoria::SinDesplazamiento(val) =\u003e write!(f, \"La posicion recibida no es valida para la operacion en la estructura {} \",val),\n\t\t\terror_operatoria::Inexistente(val) =\u003e write!(f, \"No se encontro el elemento en la estructura {} \",val),\n\t\t\terror_operatoria::EstructuraVacia(val) =\u003e write!(f, \"La estrucutra {} no dispone de elementos \",val)\n\t\t}\n\t}\n}\n\n#[derive(Debug)]\nenum Errores{\n\tErrorOperatoria(error_operatoria),\n\tErrorIO(io::Error),\n\tErrorSerde(serde_json::Error)\n}\n\nimpl Display for Errores{\n\tfn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n\t\tmatch self {\n\t\t\tErrores::ErrorOperatoria(err) =\u003e write!(f,\"{}\",err),\n\t\t    Errores::ErrorIO(err) =\u003e write!(f, \"Error de E/S al guardar: {}\", err),\n            Errores::ErrorSerde(err) =\u003e write!(f, \"Error de serialización: {}\", err)\n\t\t}\n\t}\n}\n\n//Implementacion para el uso del operador (?)\nimpl std::error::Error for Errores {}\n\n//Implementacion automatica errores subyacentes\nimpl From\u003cio::Error\u003e for Errores {\n    fn from(err: io::Error) -\u003e Self {\n        Errores::ErrorIO(err)\n    }\n}\n\nimpl From\u003cserde_json::Error\u003e for Errores {\n    fn from(err: serde_json::Error) -\u003e Self {\n        Errores::ErrorSerde(err)\n    }\n}\n\n/*\n    Extraccion Ejercicio 8 - TP3\n    Estructuras : Cancion , Generos y PlayList\n*/\n\n#[derive(Debug,Clone,Serialize,Deserialize)]\nenum Generos{\n    Rock,\n    Pop,\n    Rap,\n    Jazz,\n    Otros\n}\n\n#[derive(Debug,Clone,Serialize,Deserialize)]\nstruct Cancion{\n    titulo : String,\n    artista : String,\n    genero : Generos\n}\n\n#[derive(Debug)]\nstruct PlayList{\n    nombre: String,\n    canciones : Vec\u003cCancion\u003e,\n    path: String\n}\n\n/*\n    Metodos asociados\n*/\n\n//Metodos para Cancion\nimpl Generos{\n    pub fn es_igual_a(\u0026self,g:\u0026Generos)-\u003ebool{\n        match (self, g) {\n            (Generos::Rock, Generos::Rock) =\u003e true,\n            (Generos::Pop, Generos::Pop) =\u003e true,\n            (Generos::Rap, Generos::Rap) =\u003e true,\n            (Generos::Jazz, Generos::Jazz) =\u003e true,\n            (Generos::Otros, Generos::Otros) =\u003e true,\n            _ =\u003e false\n        }\n    }\n}\nimpl Cancion{\n    //Metodos secundarios\n    pub fn get_titulo(\u0026self)-\u003e\u0026String{\n        return \u0026self.titulo;\n    }\n    pub fn get_artista(\u0026self)-\u003e\u0026String{\n        return \u0026self.artista;\n    }\n    pub fn get_genero(\u0026self)-\u003e\u0026Generos{\n        return \u0026self.genero\n    }\n    pub fn es_igual_a(\u0026self,c:\u0026Cancion)-\u003ebool{\n        return (\u0026self.titulo == c.get_titulo())\u0026\u0026(\u0026self.artista == c.get_artista())\u0026\u0026\n        (self.genero.es_igual_a(\u0026c.get_genero()));\n    }\n    //Metodos primarios\n    pub fn new(nom1:\u0026str,nom2:\u0026str,gen_in:Generos)-\u003eCancion{\n        return Cancion{\n            titulo : nom1.to_string(),\n            artista : nom2.to_string(),\n            genero : gen_in\n        }\n    }    \n}\n\nimpl PlayList{\n    //Metodos secundarios\n    pub fn get_nombre(\u0026self)-\u003e\u0026String{\n        return \u0026self.nombre; \n    }\n    /*\n\t\tNuevos metodos del tp5\n\t*/\n\tfn recuperar_informacion(path:\u0026str)-\u003e Result\u003cVec\u003cCancion\u003e,Errores\u003e{\n\t\tlet file = File::open(path).map_err(Errores::ErrorIO)?;\n\t\tlet canciones: Vec\u003cCancion\u003e = serde_json::from_reader(file).map_err(Errores::ErrorSerde)?;\n\t\tOk(canciones)\n\t}\n\tfn guardar_informacion(\u0026self) -\u003e Result\u003c(), Errores\u003e {\n\t    let mut file = File::create(\u0026self.path)?;\n\t    let serialized = serde_json::to_string(\u0026self.canciones)?;\n        file.write_all(serialized.as_bytes())?;\n        return Ok(())\n    }\n    //Metodos primarios\n    pub fn new(nom:\u0026str,path_in:\u0026str)-\u003ePlayList{\n        let list_canciones : Vec\u003cCancion\u003e = match PlayList::recuperar_informacion(\u0026path_in){\n\t\t\tOk(dato) =\u003e {\n                dato\n            }\n            Err(_) =\u003e {\n                Vec::new()\n            }\n\t\t};\n        return PlayList { nombre: nom.to_string(), canciones: list_canciones , path: path_in.to_string() }\n    }\n    pub fn agregar_cancion(\u0026mut self,c:Cancion)-\u003eResult\u003c(),Errores\u003e{\n        self.canciones.push(c);\n        self.guardar_informacion()?;\n        return Ok(())\n    }\n    pub fn eliminar_cancion(\u0026mut self,c:\u0026Cancion)-\u003eResult\u003c(),Errores\u003e{\n        if !self.canciones.is_empty() {\n            let mut pos = None;\n            for i in 0..self.canciones.len(){\n                if self.canciones[i].es_igual_a(\u0026c) {\n                    pos = Some(i);\n                    break;\n                }\n            }\n            if let Some(indice_c) = pos {\n                self.canciones.remove(indice_c);\n                self.guardar_informacion()?;\n                return Ok(())\n            }\n            return Err(Errores::ErrorOperatoria(error_operatoria::Inexistente(self.get_nombre().clone())))\n        }\n        return Err(Errores::ErrorOperatoria(error_operatoria::EstructuraVacia(self.get_nombre().clone())))\n    }\n    //la posicion oscila entre el rango (0..tam-1) , como lo hacen los metodos genericos de vec .get()\n    pub fn mover_cancion(\u0026mut self,c:\u0026Cancion ,pos:usize) -\u003e Result\u003c(), Errores\u003e {\n        if !self.canciones.is_empty() {\n            if pos \u003c self.canciones.len() {\n                \n                if let Some(indice) = self.canciones.iter().position(|cancion| cancion.es_igual_a(c)) {\n                    if indice != pos {\n                        let cancion = self.canciones.remove(indice);\n                        self.canciones.insert(pos, cancion);\n                    }\n                    \n                    self.guardar_informacion()?;\n                    return Ok(());\n                }\n                return Err(Errores::ErrorOperatoria(error_operatoria::Inexistente(self.get_nombre().clone())));\n            }\n            return Err(Errores::ErrorOperatoria(error_operatoria::SinDesplazamiento(self.get_nombre().clone())));\n        }\n        Err(Errores::ErrorOperatoria(error_operatoria::EstructuraVacia(self.get_nombre().clone())))\n    }\n    \n    pub fn buscar_cancion(\u0026self,nom:\u0026String)-\u003eOption\u003c\u0026Cancion\u003e{\n\t\tlet mut res : Option\u003c\u0026Cancion\u003e = None;\n\t\tif !self.canciones.is_empty() {\n\t\t\tfor cancion in \u0026self.canciones{\n\t\t\t\tif cancion.get_titulo() == nom {\n\t\t\t\t\tres = Some(cancion);\n                    break;\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t\treturn res;\n\t}\n    pub fn canciones_genero(\u0026self,gen_in:\u0026Generos)-\u003eResult\u003cVec\u003c\u0026Cancion\u003e,Errores\u003e{\n        \n        if !self.canciones.is_empty() {\n            let mut res = Vec::new();\n            for cancion in \u0026self.canciones{\n                if cancion.genero.es_igual_a(gen_in) {\n                    res.push(cancion);\n                    \n                }\n            }\n            return Ok(res)\n        }\n        return Err(Errores::ErrorOperatoria(error_operatoria::EstructuraVacia(self.get_nombre().clone())));\n    }\n    pub fn canciones_artista(\u0026self,nom:\u0026String)-\u003eResult\u003c(Vec\u003c\u0026Cancion\u003e),Errores\u003e{\n        \n        if !self.canciones.is_empty() {\n            let mut res = Vec::new();\n            for cancion in \u0026self.canciones{\n                if cancion.get_artista() == nom {\n                    res.push(cancion);\n                    \n                }\n            }\n            return Ok(res)\n        }\n        return Err(Errores::ErrorOperatoria(error_operatoria::EstructuraVacia(self.get_nombre().clone())));\n    }\n    pub fn modificar_titulo(\u0026mut self,nom_nuevo:\u0026String){\n        self.nombre = nom_nuevo.to_string();\n    }\n    pub fn eliminar_canciones(\u0026mut self)-\u003eResult\u003c(),Errores\u003e{\n        self.canciones.clear();\n        self.guardar_informacion()?;\n        return Ok(())\n    }\n}\n\n\n#[cfg(test)]\nmod testing_ejercicio8{\n    use super::*;\n\n    #[test]\n    fn manipulacion_playlist(){\n        let mut nom_pri = \"reproductor1\".to_string();\n        let mut p = PlayList::new(\u0026nom_pri,\"\");\n        assert_eq!(p.get_nombre(),\u0026nom_pri.to_string());\n        nom_pri = \"repro1\".to_string();\n        p.modificar_titulo(\u0026nom_pri);\n        assert_eq!(p.get_nombre(),\u0026nom_pri.to_string());\n    }\n    #[test]\n    fn operatoria_canciones(){\n        let mut p = PlayList::new(\u0026\"asd\".to_string(),\"./lista_canciones.json\");\n        let c = Cancion::new(\u0026\"pepe\", \u0026\"pepito\", Generos::Rap);\n        assert!(p.agregar_cancion(c.clone()).is_ok());\n        assert!(p.agregar_cancion(c.clone()).is_ok());\n        assert!(p.buscar_cancion(\u0026\"pepe\".to_string()).is_some_and(|c1| c1.es_igual_a(\u0026c)),\"No existe esa cancion\");\n\n        //Desplazamientos\n        let c2 = Cancion::new(\u0026\"pepo\", \u0026 \"pepe\", Generos::Rap);\n        assert!(p.agregar_cancion(c2.clone()).is_ok());\n        assert!(p.mover_cancion(\u0026c2,0).is_ok());\n        assert!(p.canciones.get(0).is_some_and(|c| c.es_igual_a(\u0026c2)),\"No existe esa cancion\");\n        let c3 = Cancion::new(\u0026\"pimpon\", \u0026\"tito\", Generos::Rap);\n        assert!(p.agregar_cancion(c3.clone()).is_ok());\n        assert!(p.mover_cancion(\u0026c3,2).is_ok());\n        assert!(p.canciones.get(2).is_some_and(|c| c.es_igual_a(\u0026c3)),\"No existe esa cancion\");\n        assert!(p.mover_cancion(\u0026c2,3).is_ok());\n        assert!(p.canciones.get(p.canciones.len()-1).is_some_and(|c| c.es_igual_a(\u0026c2)),\"No existe esa cancion\");\n        assert!(p.mover_cancion(\u0026c2,4).is_err_and(|e|{\n            assert!(!e.to_string().is_empty());\n            matches!(e, Errores::ErrorOperatoria(error_operatoria::SinDesplazamiento(_)))\n        }),\"Aqui debio fallar\");\n\n        //Borrar algunas canciones\n        assert!(p.eliminar_cancion(\u0026c3).is_ok());\n        assert!(p.eliminar_cancion(\u0026c3).is_err_and(|e|{\n            assert!(!e.to_string().is_empty());\n            matches!(e, Errores::ErrorOperatoria(error_operatoria::Inexistente(_)))\n        }),\"Aqui debio fallar\");\n\n        //Limpieza completa\n        assert!(p.eliminar_canciones().is_ok());\n        assert!(p.mover_cancion(\u0026c2,0).is_err_and(|e|{\n            assert!(!e.to_string().is_empty());\n            matches!(e, Errores::ErrorOperatoria(error_operatoria::EstructuraVacia(_)))\n        }),\"Aqui debio fallar\");\n\n        assert!(p.eliminar_cancion(\u0026c2).is_err_and(|e|{\n            assert!(!e.to_string().is_empty());\n            matches!(e, Errores::ErrorOperatoria(error_operatoria::EstructuraVacia(_)))\n        }),\"Aqui debio fallar\");\n    }\n    #[test]\n    fn listado_canciones(){\n        let mut p = PlayList::new(\u0026\"asd\",\"./lista_canciones2.json\");\n        let c1 = Cancion::new(\u0026\"pepe\", \u0026\"pepito\", Generos::Rap);\n        let c4 = Cancion::new(\u0026\"pepesito\", \u0026\"pepito\", Generos::Jazz);\n        let c2 = Cancion::new(\u0026\"donPepe\", \u0026\"donPepito\", Generos::Rap);\n        let c3 = Cancion::new(\u0026\"qwe\", \u0026\"Qwe\", Generos::Rock);\n        assert!(p.agregar_cancion(c1.clone()).is_ok());\n        assert!(p.agregar_cancion(c2).is_ok());\n        assert!(p.agregar_cancion(c1).is_ok());\n        assert!(p.agregar_cancion(c3.clone()).is_ok());\n        assert!(p.agregar_cancion(c3).is_ok());\n        assert!(p.agregar_cancion(c4).is_ok());\n\n        //Listados\n        assert!(p.canciones_genero(\u0026Generos::Rap).is_ok_and(|l|{\n            assert_eq!(l.len(),3);\n            l.iter().all(|c| c.genero.es_igual_a(\u0026Generos::Rap))\n        }));\n        \n        assert!(p.canciones_artista(\u0026\"pepito\".to_string()).is_ok_and(|l|{\n            assert_eq!(l.len(),3);\n            l.iter().all(|c| c.get_artista() == \u0026\"pepito\".to_string())\n        }));\n\n        assert!(p.eliminar_canciones().is_ok());\n\n        assert!(p.canciones_genero(\u0026Generos::Rock).is_err_and(|e| matches!(e,Errores::ErrorOperatoria(error_operatoria::EstructuraVacia(_)))));\n        assert!(p.canciones_artista(\u0026\"Joaco\".to_string()).is_err_and(|e| matches!(e,Errores::ErrorOperatoria(error_operatoria::EstructuraVacia(_)))));\n    }\n\n    /*\n\t\tCasos especiales para la cobertura de coverage\n\t*/\n\t#[test]\n\tfn caso_especial_error_io() {\n\t\t// Se buscara forzar un ErrorIO usando una ruta cuyo directorio base no existe\n\t\tlet path_imposible = \"./carpeta_inexistente_123/x.json\";\n\n\t\tlet mut p = PlayList::new(\u0026\"asd\",path_imposible);\n        let c1 = Cancion::new(\u0026\"pepe\", \u0026\"pepito\", Generos::Rap);\n        \n\t\t// Al intentar agregar el elemento, llamará internamente a File::create() en la ruta rota, provocando un ErrorIO\n\t\tassert!(p.agregar_cancion(c1).is_err_and(|e|{\n\t\t\tassert!(!e.to_string().is_empty());\n\t\t\tmatches!(e, Errores::ErrorIO(_))\n\t\t}),\"Aquí debió fallar\");\n\t}\n\n\t#[test]\n\tfn caso_especial_error_serde() {\n\t\tlet path_err = \"./corrupto.json\";\n\t\t\n\t\t// Se fuerza la escritura en el contenido temporal que NO cumple con el formato estructurado de un .JSON válido\n\t\tassert!(std::fs::write(path_err, \"{ \u0026\u00265435#$#$\u002642365_XXXX1234 : [::: \").is_ok(),\"No debio fallar aqui\");\n\n\t\t// Se invoca directamente el método para leer el archivo del path que buscara\n\n\t\tassert!(PlayList::recuperar_informacion(path_err).is_err_and(|e|{\n\t\t\tassert!(!e.to_string().is_empty());\n\t\t\tmatches!(e, Errores::ErrorSerde(_))\n\t\t}),\"Aquí debió fallar\");\n\n\t\tassert!(std::fs::remove_file(path_err).is_ok(),\"Error fuera de lo previsto\");\n\t\t\n\t}\n}","traces":[{"line":22,"address":[2677136],"length":1,"stats":{"Line":1}},{"line":23,"address":[2677169],"length":1,"stats":{"Line":1}},{"line":24,"address":[2677209],"length":1,"stats":{"Line":1}},{"line":25,"address":[2677320],"length":1,"stats":{"Line":1}},{"line":26,"address":[2677464],"length":1,"stats":{"Line":1}},{"line":39,"address":[2676320],"length":1,"stats":{"Line":1}},{"line":40,"address":[2676353],"length":1,"stats":{"Line":1}},{"line":41,"address":[2676410],"length":1,"stats":{"Line":1}},{"line":42,"address":[2676517],"length":1,"stats":{"Line":1}},{"line":43,"address":[2676661],"length":1,"stats":{"Line":1}},{"line":53,"address":[2677616],"length":1,"stats":{"Line":1}},{"line":54,"address":[2677624],"length":1,"stats":{"Line":1}},{"line":59,"address":[2677648],"length":1,"stats":{"Line":0}},{"line":60,"address":[2677656],"length":1,"stats":{"Line":0}},{"line":98,"address":[2669228,2669184],"length":1 lize};\nuse serde_json;\nuse std::{fs::File, io::{Error, Read, Write}};\nuse std::io;\n\n/*\n    Tipos de errores\n*/\n#[derive(Debug)]\nenum error_operatoria{\n    Inexistente(String),\n    EstructuraVacia(String)\n}\n\nimpl Display for error_operatoria{\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        match self{\n            error_operatoria::Inexistente(val) =\u003e write!(f, \"No se encontro el elemento en la estructura {} \",val),\n            error_operatoria::EstructuraVacia(val) =\u003e write!(f, \"La estrucutra {} no dispone de elementos \",val)\n        }\n    }\n}\n\n#[derive(Debug)]\nenum Errores{\n    ErrorOperatoria(error_operatoria),\n    ErrorIO(io::Error),\n    ErrorSerde(serde_json::Error)\n}\n\nimpl Display for Errores{\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        match self {\n            Errores::ErrorOperatoria(err) =\u003e write!(f,\"{}\",err),\n            Errores::ErrorIO(err) =\u003e write!(f, \"Error de E/S al guardar: {}\", err),\n            Errores::ErrorSerde(err) =\u003e write!(f, \"Error de serialización: {}\", err)\n        }\n    }\n}\n\n//Implementacion para el uso del operador (?)\nimpl std::error::Error for Errores {}\n\n//Implementacion automatica errores subyacentes\nimpl From\u003cio::Error\u003e for Errores {\n    fn from(err: io::Error) -\u003e Self {\n        Errores::ErrorIO(err)\n    }\n}\n\nimpl From\u003cserde_json::Error\u003e for Errores {\n    fn from(err: serde_json::Error) -\u003e Self {\n        Errores::ErrorSerde(err)\n    }\n}\n\n/*\n    Extraccion Ejercicio9 TP3\n*/\n/* \n    Estructura Fecha - Ejercicio3 - TP3\n*/\n\nuse std::collections::VecDeque;\n\n//Atributos\n#[derive(Debug,Clone,Serialize,Deserialize)]\nstruct Fecha{\n    pub dia : u8,\n    pub mes : u8,\n    pub anio : u16\n}\n\n/*\n    Metodos\n*/\n\nimpl Fecha{\n\n    //Metodos Secundarios\n    pub fn get_dia(\u0026self)-\u003eu8{\n        return self.dia;\n    }\n    pub fn get_mes(\u0026self)-\u003eu8{\n        return self.mes;\n    }\n    pub fn get_anio(\u0026self)-\u003eu16{\n        return self.anio;\n    }\n    pub fn es_igual_a(\u0026self,f:\u0026Fecha)-\u003ebool{\n        return if(self.get_dia() == f.get_dia())\u0026\u0026(self.get_mes() == f.get_mes())\u0026\u0026(self.get_anio() == f.get_anio()){true}else{false}\n    }\n    /*\n        Metodos Primarios    \n     */\n    pub fn new(d:u8,m:u8,a:u16)-\u003eFecha{\n        return Fecha { dia: d , mes: m , anio: a }\n    }\n    pub fn es_fecha_valida(\u0026self)-\u003ebool{\n        \n        if (self.mes \u003e 0) \u0026\u0026 (self.mes \u003c= 12) \u0026\u0026 (self.anio \u003e 0) \u0026\u0026 (self.dia \u003e 0) {\n        \n            match self.mes{\n                2 =\u003e if self.es_bisiesto() { return self.dia \u003c= 29 }else{ return self.dia \u003c= 28},\n                9|4|6|11 =\u003e return self.dia \u003c= 30,\n                _ =\u003e return self.dia \u003c= 31\n            }\n            \n        }\n\n        return false;\n    }\n\n    pub fn es_bisiesto(\u0026self)-\u003ebool{\n        return (self.anio % 4)==0;\n    }\n\n    //Auxiliar para determinar el ultimo dia de un mes\n    fn ultimo_dia(\u0026self)-\u003eu8{\n        match self.mes{\n            2 =\u003e if self.es_bisiesto() {29}else{28},\n            9|4|6|11 =\u003e 30,\n            _ =\u003e 31\n        }\n    \n    }\n\n    //Auxiliar para avanzar de mes y anio\n    fn avanzar_mes(\u0026mut self) {\n        if self.mes == 12 {\n            self.mes = 1;\n            self.anio += 1;\n        } else {\n            self.mes += 1;\n        }\n        self.dia = 1;\n    }\n\n    //Se considera que la fecha es valida\n    pub fn sumar_dias(\u0026mut self,mut dias_sumar:u32){\n        //Bucle principal para el calculo\n        while dias_sumar \u003e 0 {\n            //Obtiene el ultimo dia del mes (Cantidad total de dias que le corresponde)\n            let dias_mes = self.ultimo_dia();\n            //Calcula el resto de dias que debera actualizar en \"dias_sumar\" para avanzar en mes y anio hasta llegar al mes con la cantidad minima a sumar de dias correspondiente\n            let dias_restantes = dias_mes - self.dia + 1;\n            \n            //Avanza en los meses y anios(si fuera necesario) hasta llegar al mes y sumar la cantidad minima de dias\n            if dias_sumar \u003e= dias_restantes as u32 {\n                dias_sumar -= dias_restantes as u32;\n                self.avanzar_mes();\n            } else {\n                //Suma la cantidad correspondiente al mes\n                self.dia += dias_sumar as u8;\n                //Fin de ejecucion\n                dias_sumar = 0;\n            }\n        }\n\n    }\n\n    //Auxiliar para retroceder de mes y anio\n    fn retroceder_mes(\u0026mut self){\n        if self.mes == 1{\n            self.mes = 12;\n            self.anio -= 1;\n        } else {\n            self.mes -= 1;\n        }\n        self.dia = self.ultimo_dia();\n    }\n\n    //Se considera que la fecha es valida\n    //Y que no se llegara a una fecha negativa(anio negativo)\n    pub fn restar_dias(\u0026mut self, mut dias_restar:u32){\n        //Bucle principal para el calculo\n        while dias_restar \u003e 0 {\n            \n            //Retrocede en los meses y anios(si fuera necesario) hasta llegar al mes y restar la cantidad minima de dias\n            if dias_restar \u003e= self.dia as u32 {\n                dias_restar -= self.dia as u32;\n                self.retroceder_mes();\n            } else {\n                //Resta la cantidad correspondiente al mes\n                self.dia -= dias_restar as u8;\n                //Fin de ejecucion\n                dias_restar = 0;\n            }\n        }\n    }\n\n    pub fn es_mayor(\u0026self , f:\u0026Fecha)-\u003ebool{\n        return if self.anio \u003e f.anio {true}else \n        if (self.anio == f.anio) \u0026\u0026 (self.mes \u003e f.mes) {true}else \n        if (self.mes == f.mes) \u0026\u0026 (self.dia \u003e f.dia) {true}else{false};\n    }\n\n}\n\n\n#[cfg(test)]\nmod testing_ejercicio9_fecha{\n    use super::Fecha;\n\n    #[test]\n    fn creacion_fecha(){\n        let f = Fecha::new(1, 1, 2025);\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(1, 1, 2025)),true);\n    }\n\n    #[test]\n    fn validacion_de_fecha(){\n        let mut f = Fecha::new(1, 1, 2025);\n        assert_eq!(f.es_fecha_valida(),true);\n        f = Fecha::new(31, 2, 2004);\n        assert_eq!(f.es_fecha_valida(),false);\n    }\n\n    #[test]\n    fn validar_bisiesto(){\n        let mut f = Fecha::new(1, 1, 2028);\n        assert_eq!(f.es_bisiesto(),true);\n        f = Fecha::new(1, 1, 2025);\n        assert_eq!(f.es_bisiesto(),false);\n    }\n\n    #[test]\n    fn adicion_fecha(){\n        let mut f = Fecha::new(1, 1, 2028);\n        f.sumar_dias(30);\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(31, 1, 2028)),true);\n        f.sumar_dias(1);\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(1, 2, 2028)),true);\n        f.sumar_dias(29);\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(1,3,2028)),true);\n    }\n\n    #[test]\n    fn sustraccion_fecha(){\n        let mut f = Fecha::new(10, 4, 2028);\n        f.restar_dias(9);\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(1, 4, 2028)),true);\n        f.restar_dias(31);\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(1,3,2028)),true);\n        f.restar_dias(1);\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(29, 2, 2028)),true);\n    }\n\n    #[test]\n    fn comparacion_fechas(){\n        let f1 = Fecha::new(25, 5, 2000);\n        let f2 = Fecha::new(25, 2, 2004);\n        assert_eq!(f1.es_mayor(\u0026f2),false);\n        assert_eq!(f2.es_mayor(\u0026f1),true);\n    }\n\n}\n/*\n    Estructuras\n*/\n\n#[derive(Debug, Clone,Serialize,Deserialize)]\nenum Animales{\n    Perro,\n    Gato,\n    Caballo,\n    Otro,\n}\n#[derive(Debug, Clone,Serialize,Deserialize)]\nstruct Duenio {\n    nombre: String,\n    direccion: String,\n    telefono: u32\n}\n#[derive(Debug, Clone,Serialize,Deserialize)]\nstruct Mascota {\n    nombre: String,\n    edad: u32,\n    tipo: Animales,\n    duenio: Duenio\n}\n#[derive(Debug, Clone,Serialize,Deserialize)]\nstruct Atencion {\n    mascota: Mascota,\n    diagnostico: String,\n    tratamiento: String,\n    proxima_visita: Option\u003cFecha\u003e\n}\n#[derive(Debug, Clone)]\nstruct Veterinaria {\n    nombre: String,\n    direccion: String,\n    id: u32,\n    cola_atencion: VecDeque\u003cMascota\u003e,\n    atenciones_realizadas: Vec\u003cAtencion\u003e,\n    path:String\n}\n\n/*\n    Metodos asociados\n*/\nimpl Animales{\n    pub fn es_igual_a(\u0026self,a:\u0026Animales)-\u003ebool{\n        match (self, a) {\n            (Animales::Perro, Animales::Perro) =\u003e true,\n            (Animales::Gato, Animales::Gato) =\u003e true,\n            (Animales::Caballo, Animales::Caballo) =\u003e true,\n            (Animales::Otro, Animales::Otro) =\u003e true,\n            _ =\u003e false\n        }\n    }\n}\nimpl Duenio {\n    //Metodos Secundarios\n    pub fn get_nombre(\u0026self)-\u003e\u0026String{\n        return \u0026self.nombre;\n    }\n    pub fn get_direccion(\u0026self)-\u003e\u0026String{\n        return \u0026self.direccion;\n    }\n    pub fn get_num_telefono(\u0026self)-\u003eu32{\n        return self.telefono\n    }\n    pub fn es_igual_a(\u0026self,d:\u0026Duenio)-\u003ebool{\n        return (\u0026self.nombre == d.get_nombre())\u0026\u0026(\u0026self.direccion == d.get_direccion())\u0026\u0026(self.telefono == d.get_num_telefono());\n    }\n    pub fn datos_iguales_a(\u0026self,nom:\u0026String,tel:u32)-\u003ebool{\n        return (\u0026self.nombre==nom)\u0026\u0026(self.telefono==tel)\n    }\n    //Metodos Primarios\n    pub fn new(nombre_in: \u0026str,direccion_in: \u0026str,telefono_in: u32) -\u003e Duenio {\n        return Duenio{\n            nombre : nombre_in.to_string(),\n            direccion : direccion_in.to_string(),\n            telefono : telefono_in\n        }\n    }\n    \n}\n\nimpl Mascota {\n    //Metodos secundarios\n    pub fn get_nombre(\u0026self)-\u003e\u0026String{\n        return \u0026self.nombre;\n    }\n    pub fn get_edad(\u0026self)-\u003eu32{\n        return self.edad\n    }\n    pub fn get_tipo(\u0026self)-\u003e\u0026Animales{\n        return \u0026self.tipo\n    }\n    pub fn get_duenio(\u0026self)-\u003e\u0026Duenio{\n        return \u0026self.duenio\n    }\n    pub fn es_igual_a(\u0026self,m:\u0026Mascota)-\u003ebool{\n        return (\u0026self.nombre == m.get_nombre())\u0026\u0026(self.edad == m.get_edad())\u0026\u0026(self.tipo.es_igual_a(\u0026m.get_tipo()))\u0026\u0026(self.duenio.es_igual_a(\u0026m.get_duenio()));\n    }\n    pub fn datos_iguales_a(\u0026self,nom:\u0026String,nom_duenio:\u0026String,tel:u32)-\u003ebool{\n        return (\u0026self.nombre==nom)\u0026\u0026(self.duenio.datos_iguales_a(\u0026nom_duenio,tel))\n    }\n    //Metodos primarios\n    pub fn new(nombre_in: \u0026str,edad_in: u32,tipo_in: Animales,duenio_in: Duenio) -\u003e Mascota {\n        return Mascota{\n            nombre : nombre_in.to_string(),\n            edad : edad_in,\n            tipo : tipo_in,\n            duenio : duenio_in\n        }\n    }\n}\n\nimpl Atencion {\n    //Metodos secundarios\n    pub fn get_mascota(\u0026self)-\u003e\u0026Mascota{\n        return \u0026self.mascota\n    }\n    pub fn datos_iguales_a(\u0026self,nom_mascota:\u0026String,nom_duenio:\u0026String,tel:u32)-\u003ebool{\n        return self.mascota.datos_iguales_a(\u0026nom_mascota,\u0026nom_duenio,tel)\n    }\n    pub fn es_igual_a(\u0026self,ate:\u0026Atencion)-\u003ebool{\n        let mut tiene_fecha = false;\n        if let Some(fecha1) = \u0026self.proxima_visita{\n            if let Some(fecha2) = \u0026ate.proxima_visita{\n                tiene_fecha = fecha1.es_igual_a(\u0026fecha2);\n            }\n        }else{\n            if ate.proxima_visita.is_none(){\n                tiene_fecha = true;\n            }\n        }\n        return self.mascota.es_igual_a(\u0026ate.get_mascota())\u0026\u0026(self.diagnostico==ate.diagnostico)\u0026\u0026(self.tratamiento==ate.tratamiento)\u0026\u0026(tiene_fecha)\n    }\n    pub fn cambiar_diagnostico(\u0026mut self,diag:\u0026str){\n        self.diagnostico = diag.to_string();\n    }\n    pub fn cambiar_fecha(\u0026mut self,f:Option\u003cFecha\u003e){\n        self.proxima_visita = f;\n    }\n    //Metodos primarios\n    pub fn new(mascota_in: Mascota,diagnostico_in: \u0026str,tratamiento_in: \u0026str,proxima_visita_in: Option\u003cFecha\u003e) -\u003e Atencion {\n        Atencion{\n            mascota : mascota_in,\n            diagnostico : diagnostico_in.to_string(),\n            tratamiento : tratamiento_in.to_string(),\n            proxima_visita : proxima_visita_in\n        }\n    }\n}\n\nimpl Veterinaria{\n    //Metodos secundarios\n    pub fn get_nombre(\u0026self)-\u003e\u0026String{\n        return \u0026self.nombre\n    }\n    pub fn get_direccion(\u0026self)-\u003e\u0026String{\n        return \u0026self.direccion\n    }\n    pub fn get_id(\u0026self)-\u003eu32{\n        return self.id\n    }\n    pub fn es_igual_a(\u0026self,v:\u0026Veterinaria)-\u003ebool{\n        return (\u0026self.nombre == v.get_nombre())\u0026\u0026(\u0026self.direccion == v.get_direccion())\u0026\u0026(self.id == v.get_id());\n    }\n    /*\n\t\tNuevos metodos del tp5\n\t*/\n\tfn recuperar_informacion(path:\u0026str)-\u003e Result\u003cVec\u003cAtencion\u003e,Errores\u003e{\n\t\tlet file = File::open(path).map_err(Errores::ErrorIO)?;\n\t\tlet atenciones: Vec\u003cAtencion\u003e = serde_json::from_reader(file).map_err(Errores::ErrorSerde)?;\n\t\tOk(atenciones)\n\t}\n\tfn guardar_informacion(\u0026self) -\u003e Result\u003c(), Errores\u003e {\n\t    let mut file = File::create(\u0026self.path)?;\n\t    let serialized = serde_json::to_string(\u0026self.atenciones_realizadas)?;\n        file.write_all(serialized.as_bytes())?;\n        return Ok(())\n    }\n    //Metodos primarios\n    pub fn new(nom_in:\u0026str,dir_in:\u0026str,id_in:u32,path_in:\u0026str)-\u003eVeterinaria{\n        let atenciones : Vec\u003cAtencion\u003e = match Veterinaria::recuperar_informacion(path_in){\n            Ok(dato) =\u003e {\n                dato\n            }\n            Err(_) =\u003e {\n                Vec::new()\n            }\n        };\n        return Veterinaria{\n            nombre : nom_in.to_string(),\n            direccion : dir_in.to_string(),\n            id : id_in,\n            cola_atencion : VecDeque::new(),\n            atenciones_realizadas : atenciones,\n            path: path_in.to_string()\n        }\n    }\n    pub fn agregar_mascota(\u0026mut self,m:Mascota){\n        self.cola_atencion.push_back(m);\n    }   \n    pub fn priorizar_mascota(\u0026mut self,m:Mascota){\n        self.cola_atencion.push_front(m);\n    }\n    pub fn atender_mascota(\u0026mut self)-\u003eOption\u003cMascota\u003e{\n        if self.cola_atencion.is_empty() {\n            return None;\n        }else{\n            return self.cola_atencion.pop_front();\n        }\n    }\n    pub fn eliminar_mascota(\u0026mut self, m:\u0026Mascota){\n        if !self.cola_atencion.is_empty(){\n            for i in 0..self.cola_atencion.len(){\n                if self.cola_atencion[i].es_igual_a(\u0026m) {\n                    self.cola_atencion.remove(i);\n                    break;\n                }\n            }\n        }\n    }\n    pub fn registrar_atencion(\u0026mut self,a:Atencion)-\u003eResult\u003c(), Errores\u003e{\n        self.atenciones_realizadas.push(a);\n        self.guardar_informacion()?;\n        return Ok(())\n    }\n    pub fn buscar_atencion(\u0026self,nom_mascota:\u0026String,nom_duenio:\u0026String,tel:u32)-\u003eOption\u003c\u0026Atencion\u003e{\n        let mut res : Option\u003c\u0026Atencion\u003e = None;\n        if !self.atenciones_realizadas.is_empty(){\n            for i in (0..self.atenciones_realizadas.len()).rev(){\n                if self.atenciones_realizadas[i].datos_iguales_a(\u0026nom_mascota,\u0026nom_duenio, tel){\n                    res = Some(\u0026self.atenciones_realizadas[i]);\n                    break;\n                }\n            }\n        }\n        return res;\n    }\n    pub fn modificar_diagnostico(\u0026mut self,ate:\u0026Atencion,diag:\u0026String)-\u003eResult\u003c(),Errores\u003e{\n        if !self.atenciones_realizadas.is_empty(){\n            for i in 0..self.atenciones_realizadas.len(){\n                if self.atenciones_realizadas[i].es_igual_a(\u0026ate){\n                    self.atenciones_realizadas[i].cambiar_diagnostico(\u0026diag.clone());\n                    self.guardar_informacion()?;\n                    return Ok(())\n                }\n            }\n            return Err(Errores::ErrorOperatoria(error_operatoria::Inexistente(self.get_nombre().clone())))\n        }\n        return Err(Errores::ErrorOperatoria(error_operatoria::EstructuraVacia(self.get_nombre().clone())))\n    }\n    pub fn modificar_fecha(\u0026mut self,ate:\u0026Atencion,fecha: Option\u003cFecha\u003e)-\u003eResult\u003c(),Errores\u003e {\n        if !self.atenciones_realizadas.is_empty(){\n            for i in 0..self.atenciones_realizadas.len(){\n                if self.atenciones_realizadas[i].es_igual_a(\u0026ate) {\n                    self.atenciones_realizadas[i].cambiar_fecha(fecha);\n                    self.guardar_informacion()?;\n                    return Ok(())\n                }\n            }\n            return Err(Errores::ErrorOperatoria(error_operatoria::Inexistente(self.get_nombre().clone())))\n        }\n        return Err(Errores::ErrorOperatoria(error_operatoria::EstructuraVacia(self.get_nombre().clone())))\n    }\n    pub fn eliminar_atencion(\u0026mut self,ate:\u0026Atencion)-\u003eResult\u003c(),Errores\u003e{\n        if !self.atenciones_realizadas.is_empty(){\n            for i in 0..self.atenciones_realizadas.len(){\n                if self.atenciones_realizadas[i].es_igual_a(\u0026ate){\n                    self.atenciones_realizadas.remove(i);\n                    self.guardar_informacion()?;\n                    return Ok(())\n                }\n            }\n            return Err(Errores::ErrorOperatoria(error_operatoria::Inexistente(self.get_nombre().clone())))\n        }\n        return Err(Errores::ErrorOperatoria(error_operatoria::EstructuraVacia(self.get_nombre().clone())))\n    }\n}\n#[cfg(test)]\nmod testing_ejercicio9{\n    use super::*;\n\n    #[test]\n    fn creacion_veterinaria(){\n        let v = Veterinaria::new(\u0026\"mordidas\",\u0026\"av1\",1,\"./lista_atenciones.json\");\n        let v2 = Veterinaria::new(\u0026\"mordidas\",\u0026\"av1\",1,\"./lista_atenciones.json\");\n        assert_eq!(v.es_igual_a(\u0026v2),true);\n    }\n\n    #[test]\n    fn operatoria_mascotas(){\n        let mut v = Veterinaria::new(\u0026\"mordidas\",\u0026\"av1\",1,\"./lista_atenciones\");\n        let d1 = Duenio::new(\u0026\"Marcos\",\u0026\"av2\",1234);\n        let animal1 = Mascota::new(\u0026\"Luchito\", 2, Animales::Perro, d1.clone());\n        v.agregar_mascota(animal1);\n\n        let animal2 = Mascota::new(\u0026\"Piecitos\", 1, Animales::Gato, d1.clone());\n        v.priorizar_mascota(animal2);\n\n        //Atendiende un gato\n        assert!(v.atender_mascota().is_some_and(|ani|{\n            ani.es_igual_a(\u0026Mascota::new(\u0026\"Piecitos\", 1, Animales::Gato, d1.clone()))\n        }),\"No se encontro al animal\");\n\n        //Atendiende un perro\n        assert!(v.atender_mascota().is_some_and(|ani|{\n            ani.es_igual_a(\u0026Mascota::new(\u0026\"Luchito\", 2, Animales::Perro, d1.clone()))\n        }),\"No se encontro al animal\");\n\n        //Borra una mascota\n        let animal3 = Mascota::new(\u0026\"Luchis\", 2, Animales::Perro, d1);\n        v.agregar_mascota(animal3.clone());\n        v.eliminar_mascota(\u0026animal3);\n        assert_eq!(v.atender_mascota().is_none(),true);\n    }\n\n    #[test]\n    fn operar_atenciones(){\n        let mut v = Veterinaria::new(\u0026\"mordidas\",\u0026\"av1\",1,\"./lista_atenciones.json\");\n        let d1 = Duenio::new(\u0026\"Marcos\",\u0026\"av2\",1234);\n        let animal1 = Mascota::new(\u0026\"Luchito\", 2, Animales::Perro, d1.clone());\n        let animal2 = Mascota::new(\u0026\"Luchon\", 2, Animales::Perro, d1.clone());\n        v.agregar_mascota(animal1.clone());\n        v.agregar_mascota(animal2);\n\n        //Verificacion de estructura vacia en atenciones\n        let ate_aux = Atencion::new(animal1,\u0026\"Pulgas\",\u0026\"Pipeta\",None);\n        assert!(v.modificar_diagnostico(\u0026ate_aux, \u0026\"algo\".to_string()).is_err_and(|e|{\n            assert!(!e.to_string().is_empty());\n            matches!(e,Errores::ErrorOperatoria(error_operatoria::EstructuraVacia(_)))\n        }));\n        assert!(v.modificar_fecha(\u0026ate_aux, None) .is_err_and(|e|{\n            assert!(!e.to_string().is_empty());\n            matches!(e,Errores::ErrorOperatoria(error_operatoria::EstructuraVacia(_)))\n        }));\n        assert!(v.eliminar_atencion(\u0026ate_aux).is_err_and(|e|{\n            assert!(!e.to_string().is_empty());\n            matches!(e,Errores::ErrorOperatoria(error_operatoria::EstructuraVacia(_)))\n        }));\n\n        //Primera recepcion\n        assert!(v.atender_mascota().is_some_and(|ani|{\n            let ate1 = Atencion::new(ani,\u0026\"Pulgas\",\u0026\"Pipeta\",None);\n            v.registrar_atencion(ate1).is_ok()\n        }),\"No se atendio ningun animal\");\n\n        //Segunda recepcion\n        assert!(v.atender_mascota().is_some_and(|ani|{\n            let ate2 = Atencion::new(ani,\u0026\"Garrapatas\",\u0026\"Pipeta\",None);\n            v.registrar_atencion(ate2).is_ok()\n        }),\"No se atendio ningun animal\");\n        \n        //Búsqueda y eliminación de la última atención\n        let atencion = v.buscar_atencion(\u0026\"Luchon\".to_string(), \u0026\"Marcos\".to_string(), 1234).cloned();\n        assert!(atencion.is_some_and(|a| {\n            assert!(a.mascota.nombre == \"Luchon\");\n            assert!(v.eliminar_atencion(\u0026a).is_ok());\n\n            assert!(v.modificar_diagnostico(\u0026a, \u0026\"algo\".to_string()).is_err_and(|e|{\n                assert!(!e.to_string().is_empty());\n                matches!(e,Errores::ErrorOperatoria(error_operatoria::Inexistente(_)))\n            }));\n            assert!(v.modificar_fecha(\u0026a, None) .is_err_and(|e|{\n                assert!(!e.to_string().is_empty());\n                matches!(e,Errores::ErrorOperatoria(error_operatoria::Inexistente(_)))\n            }));\n            assert!(v.eliminar_atencion(\u0026a).is_err_and(|e|{\n                assert!(!e.to_string().is_empty());\n                matches!(e,Errores::ErrorOperatoria(error_operatoria::Inexistente(_)))\n            }));\n            \n            true\n        }), \"No se encontro tal recepcion\");\n\n        //Búsqueda de la primer atención y modificación de diagnóstico\n        let atencion = v.buscar_atencion(\u0026\"Luchito\".to_string(), \u0026\"Marcos\".to_string(), 1234).cloned();\n        assert!(atencion.is_some_and(|a| {\n            assert!(a.mascota.get_nombre() == \"Luchito\");\n            v.modificar_diagnostico(\u0026a, \u0026\"Vomitos\".to_string()).is_ok()\n        }), \"No se encontro tal recepcion\");\n\n        //Búsqueda de atención y modificación de fecha\n        let atencion = v.buscar_atencion(\u0026\"Luchito\".to_string(), \u0026\"Marcos\".to_string(), 1234).cloned();\n        assert!(atencion.is_some_and(|a| {\n            assert!(a.mascota.get_nombre() == \"Luchito\");\n            v.modificar_fecha(\u0026a, Some(Fecha::new(5, 5, 2025))).is_ok()\n        }), \"No se encontro tal recepcion\");\n\n        //Busqueda de atencion modificada \n        assert!(v.buscar_atencion(\u0026\"Luchito\".to_string(),\u0026\"Marcos\".to_string(),1234).is_some_and(|a|{\n            let m = Mascota::new(\u0026\"Luchito\", 2, Animales::Perro, d1.clone());\n            let ate1 = Atencion::new(m,\u0026\"Vomitos\",\u0026\"Pipeta\",Some(Fecha::new(5,5,2025)) );\n            a.es_igual_a(\u0026ate1)\n        }),\"No se encontro tal recepcion\");\n\n        //Búsqueda y eliminación de la última atención modificada\n        let atencion = v.buscar_atencion(\u0026\"Luchito\".to_string(), \u0026\"Marcos\".to_string(), 1234).cloned();\n        assert!(atencion.is_some_and(|a| {\n            assert!(a.mascota.nombre == \"Luchito\");\n            v.eliminar_atencion(\u0026a).is_ok()\n        }), \"No se encontro tal recepcion\");\n\n        \n    }\n\n    /*\n\t\tCasos especiales para la cobertura de coverage\n\t*/\n\t#[test]\n\tfn caso_especial_error_io() {\n\t\t// Se buscara forzar un ErrorIO usando una ruta cuyo directorio base NO EXISTE\n\t\tlet path_err = \"./carpeta_inexistente_123/x.json\";\n\n\t\tlet mut v = Veterinaria::new(\u0026\"mordiscos\",\u0026\"av1\",1,path_err);\n        let d1 = Duenio::new(\u0026\"Marcos\",\u0026\"av2\",1234);\n        let animal1 = Mascota::new(\u0026\"Luchito\", 2, Animales::Perro, d1);\n        v.agregar_mascota(animal1);\n\n        // Al intentar registrar la atencion, llamará internamente a File::create() en la ruta rota, provocando un ErrorIO\n        assert!(v.atender_mascota().is_some_and(|ani|{\n            let ate1 = Atencion::new(ani,\u0026\"Pulgas\",\u0026\"Pipeta\",None);\n            v.registrar_atencion(ate1).is_err_and(|e|{\n                assert!(!e.to_string().is_empty());\n\t\t\t    matches!(e, Errores::ErrorIO(_))\n            })\n        }),\"Ocurrio un error imprevisto\");\n\t\t\n\t}\n\n\t#[test]\n\tfn caso_especial_error_serde() {\n\t\tlet path_err = \"./corrupto.json\";\n\t\t\n\t\t// Se fuerza la escritura en el contenido temporal que NO cumple con el formato estructurado de un .JS
