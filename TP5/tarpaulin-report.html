    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 72px;
}
.code-line {
  margin: 0;
  height: 1em;
  counter-increment: line;

  position: absolute;
  padding: 0 0.3em 0.3em 0.3em;
  display: inherit;
  width: 100%;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

.code-text-container {
  position: relative;
  height: 1em;
  padding: 0.3em 0;
}

.cover-indicator {
  display: flex;
  width: 100%;
  position: absolute;
  justify-content: end;
  height: 1em;
  align-items: center;
  padding: 0 0.3em 0.3em 0.3em;
}

.cover-indicator.check-cover::after {
  content: "\2713";
  font-weight: bold;
  background-color: var(--green);
  height: 1em;
}

.cover-indicator.no-cover::after {
  content: "\2716";
  font-weight: bold;
  background-color: var(--red);
  height: 1em;
}

.stat-line-hit {
  max-width: 48px;
  overflow: hidden;
  font-weight: bold;
  margin-right: 4px;
  background-color: var(--green);
  position: relative;
  top: 0.1em;
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>

    <script>
        var data = {"files":[{"path":["C:","\\","Users","ezeleo","Documents","Programas","Practicas---Seminario-Rust-Recursada","TP5","src","main.rs"],"content":"mod tp5;\r\n\r\nfn main() {\r\n    \r\n}\r\n","traces":[{"line":3,"address":[],"length":0,"stats":{"Line":0}}],"covered":0,"coverable":1},{"path":["C:","\\","Users","ezeleo","Documents","Programas","Practicas---Seminario-Rust-Recursada","TP5","src","tp5","ej1.rs"],"content":"use serde::{Deserialize, Serialize};\r\nuse serde_json;\r\nuse std::io;\r\nuse std::{fmt::Display, path};\r\nuse std::{\r\n    fs::File,\r\n    io::{Error, Read, Write},\r\n};\r\n\r\n/*\r\n    Nueva implementacion  -  Ejercicio1\r\n*/\r\n\r\n/*\r\n    Tipos de errores\r\n*/\r\n#[derive(Debug, PartialEq)]\r\nenum ErroresBaja {\r\n    Inexistente(String),\r\n    EstructuraVacia(String),\r\n}\r\n\r\nimpl Display for ErroresBaja {\r\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\r\n        match self {\r\n            ErroresBaja::Inexistente(val) =\u003e {\r\n                write!(f, \"No se encontro el auto en la consecionaria {} \", val)\r\n            }\r\n            ErroresBaja::EstructuraVacia(val) =\u003e {\r\n                write!(f, \"La consecionaria {} no dispone de autos \", val)\r\n            }\r\n        }\r\n    }\r\n}\r\n\r\n#[derive(Debug)]\r\nstruct ErroresCapacidad(String);\r\nimpl Display for ErroresCapacidad {\r\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\r\n        write!(\r\n            f,\r\n            \"La Capacidad de autos para la consecionaria {} fue superada\",\r\n            self.0\r\n        )\r\n    }\r\n}\r\n\r\n#[derive(Debug)]\r\nenum Errores {\r\n    ErrorBaja(ErroresBaja),\r\n    ErrorExistencia,\r\n    ErrorCapacidad(ErroresCapacidad),\r\n    ErrorIO(io::Error),\r\n    ErrorSerde(serde_json::Error),\r\n}\r\nimpl Display for Errores {\r\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\r\n        match self {\r\n            Errores::ErrorBaja(err) =\u003e write!(f, \"{}\", err),\r\n            Errores::ErrorExistencia =\u003e write!(f, \"Ya existe un auto con tales caracteristicas\"),\r\n            Errores::ErrorCapacidad(err) =\u003e write!(f, \"{}\", err),\r\n            Errores::ErrorIO(err) =\u003e write!(f, \"Error de E/S al guardar: {}\", err),\r\n            Errores::ErrorSerde(err) =\u003e write!(f, \"Error de serialización: {}\", err),\r\n        }\r\n    }\r\n}\r\n//Implementacion para el uso del operador (?)\r\nimpl std::error::Error for Errores {}\r\n\r\n//Implementacion automatica errores subyacentes\r\nimpl From\u003cio::Error\u003e for Errores {\r\n    fn from(err: io::Error) -\u003e Self {\r\n        Errores::ErrorIO(err)\r\n    }\r\n}\r\n\r\nimpl From\u003cserde_json::Error\u003e for Errores {\r\n    fn from(err: serde_json::Error) -\u003e Self {\r\n        Errores::ErrorSerde(err)\r\n    }\r\n}\r\n\r\n/*\r\n    Extraccion del ejercicio 7 - TP3\r\n    \"Correcciones hechas a partir de feedbacks a partir del entregable de la primer fecha , solo aplicadas\r\n    a la implementacion original\"\r\n    Consideracion: Se aplican las nuevas funciones sobre el struct base (Concesionaria)\r\n*/\r\n\r\n//Enum\r\n#[derive(Serialize, Deserialize, Debug, Clone)]\r\nenum Colores {\r\n    //Primarios\r\n    Rojo,\r\n    Azul,\r\n    Amarillo,\r\n    //Secundarios\r\n    Verde,\r\n    Blanco,\r\n    Negro,\r\n}\r\n//Funcionalidad del enum\r\nimpl Colores {\r\n    //Determina si es primario o secundario\r\n    pub fn es_primario(\u0026self) -\u003e bool {\r\n        matches!(self, Colores::Rojo | Colores::Azul | Colores::Amarillo)\r\n    }\r\n    pub fn es_igual_a(\u0026self, c: \u0026Colores) -\u003e bool {\r\n        match (self, c) {\r\n            (Colores::Rojo, Colores::Rojo) =\u003e true,\r\n            (Colores::Azul, Colores::Azul) =\u003e true,\r\n            (Colores::Verde, Colores::Verde) =\u003e true,\r\n            (Colores::Amarillo, Colores::Amarillo) =\u003e true,\r\n            (Colores::Blanco, Colores::Blanco) =\u003e true,\r\n            (Colores::Negro, Colores::Negro) =\u003e true,\r\n            _ =\u003e false,\r\n        }\r\n    }\r\n}\r\n\r\n//Atributos\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\nstruct Auto {\r\n    marca: String,\r\n    modelo: String,\r\n    anio: u32,\r\n    precio_bruto: f32,\r\n    color: Colores,\r\n}\r\n\r\n#[derive(Serialize, Deserialize, Debug)]\r\nstruct ConcesionarioAuto {\r\n    nombre: String,\r\n    direccion: String,\r\n    capacidad: u32,\r\n    autos: Vec\u003cAuto\u003e,\r\n    path: String,\r\n}\r\n\r\n//Metodos\r\nimpl Auto {\r\n    pub fn new(nom: \u0026str, model: \u0026str, anio_in: u32, precio: f32, color_in: Colores) -\u003e Auto {\r\n        return Auto {\r\n            marca: nom.to_string(),\r\n            modelo: model.to_string(),\r\n            anio: anio_in,\r\n            precio_bruto: precio,\r\n            color: color_in,\r\n        };\r\n    }\r\n\r\n    pub fn calcular_precio(\u0026self) -\u003e f32 {\r\n        let mut recargo: f32 = 0.0;\r\n        let mut descuento: f32 = 0.0;\r\n\r\n        if self.color.es_primario() {\r\n            recargo += (self.precio_bruto * 25.0) / 100.0;\r\n        } else {\r\n            descuento += (self.precio_bruto * 10.0) / 100.0;\r\n        }\r\n\r\n        if self.marca == \"BMW\" {\r\n            recargo += (self.precio_bruto * 15.0) / 100.0\r\n        }\r\n\r\n        if self.anio \u003c 2000 {\r\n            descuento += (self.precio_bruto * 5.0) / 100.0;\r\n        }\r\n\r\n        return self.precio_bruto + recargo - descuento;\r\n    }\r\n\r\n    //Metodos secundarios\r\n    pub fn get_marca(\u0026self) -\u003e \u0026String {\r\n        return \u0026self.marca;\r\n    }\r\n    pub fn get_modelo(\u0026self) -\u003e \u0026String {\r\n        return \u0026self.modelo;\r\n    }\r\n    pub fn get_anio(\u0026self) -\u003e u32 {\r\n        return self.anio;\r\n    }\r\n    pub fn get_precio_bruto(\u0026self) -\u003e f32 {\r\n        return self.precio_bruto;\r\n    }\r\n    pub fn get_color(\u0026self) -\u003e \u0026Colores {\r\n        return \u0026self.color;\r\n    }\r\n    pub fn es_igual_a(\u0026self, a: \u0026Auto) -\u003e bool {\r\n        return (\u0026self.marca == a.get_marca())\r\n            \u0026\u0026 (\u0026self.modelo == a.get_modelo())\r\n            \u0026\u0026 (self.anio == a.get_anio())\r\n            \u0026\u0026 (self.precio_bruto == a.get_precio_bruto())\r\n            \u0026\u0026 (self.color.es_igual_a(\u0026a.get_color()));\r\n    }\r\n}\r\n\r\nimpl ConcesionarioAuto {\r\n    //Metodos secundarios\r\n    pub fn get_nombre(\u0026self) -\u003e \u0026String {\r\n        return \u0026self.nombre;\r\n    }\r\n    pub fn get_direccion(\u0026self) -\u003e \u0026String {\r\n        return \u0026self.direccion;\r\n    }\r\n    pub fn get_capacidad(\u0026self) -\u003e u32 {\r\n        return self.capacidad;\r\n    }\r\n    pub fn es_igual_a(\u0026self, c: \u0026ConcesionarioAuto) -\u003e bool {\r\n        return (\u0026self.nombre == c.get_nombre())\r\n            \u0026\u0026 (\u0026self.direccion == c.get_direccion())\r\n            \u0026\u0026 (self.capacidad == c.get_capacidad());\r\n    }\r\n    //Metodos primarios\r\n    pub fn new(nom: \u0026str, dir: \u0026str, cant: u32, path_in: \u0026str) -\u003e ConcesionarioAuto {\r\n        let autos_lista: Vec\u003cAuto\u003e = match ConcesionarioAuto::recuperar_informacion(\u0026path_in) {\r\n            Ok(dato) =\u003e dato,\r\n            Err(_) =\u003e Vec::new(),\r\n        };\r\n        return ConcesionarioAuto {\r\n            nombre: nom.to_string(),\r\n            direccion: dir.to_string(),\r\n            capacidad: cant,\r\n            autos: autos_lista,\r\n            path: path_in.to_string(),\r\n        };\r\n    }\r\n    /*\r\n        Nuevos metodos del tp5\r\n    */\r\n    fn recuperar_informacion(path: \u0026str) -\u003e Result\u003cVec\u003cAuto\u003e, Errores\u003e {\r\n        let file = File::open(path).map_err(Errores::ErrorIO)?;\r\n        let autos: Vec\u003cAuto\u003e = serde_json::from_reader(file).map_err(Errores::ErrorSerde)?;\r\n        Ok(autos)\r\n    }\r\n    fn guardar_informacion(\u0026self) -\u003e Result\u003c(), Errores\u003e {\r\n        let mut file = File::create(\u0026self.path)?;\r\n        let serialized = serde_json::to_string(\u0026self.autos)?;\r\n        file.write_all(serialized.as_bytes())?;\r\n        return Ok(());\r\n    }\r\n    //Agrega el auto recibido y no pueden existir repetidos dentro de la consecionaria\r\n    pub fn agregar_auto(\u0026mut self, auto: Auto) -\u003e Result\u003c(), Errores\u003e {\r\n        if (self.autos.len() as u32) \u003c self.capacidad {\r\n            for a in \u0026self.autos {\r\n                if a.es_igual_a(\u0026auto) {\r\n                    return Err(Errores::ErrorExistencia);\r\n                }\r\n            }\r\n            self.autos.push(auto);\r\n            self.guardar_informacion()?;\r\n            return Ok(());\r\n        }\r\n        return Err(Errores::ErrorCapacidad(ErroresCapacidad(\r\n            self.get_nombre().clone(),\r\n        )));\r\n    }\r\n    //Elimina un auto con las caracteristicas exactas\r\n    pub fn eliminar_auto(\u0026mut self, a1: \u0026Auto) -\u003e Result\u003c(), Errores\u003e {\r\n        if !self.autos.is_empty() {\r\n            let mut pos = None;\r\n            for i in 0..self.autos.len() {\r\n                if self.autos[i].es_igual_a(\u0026a1) {\r\n                    pos = Some(i);\r\n                    break;\r\n                }\r\n            }\r\n            if let Some(pos_in) = pos {\r\n                self.autos.remove(pos_in);\r\n                self.guardar_informacion()?;\r\n                return Ok(());\r\n            }\r\n            return Err(Errores::ErrorBaja(ErroresBaja::Inexistente(\r\n                self.get_nombre().clone(),\r\n            )));\r\n        }\r\n        return Err(Errores::ErrorBaja(ErroresBaja::EstructuraVacia(\r\n            self.get_nombre().clone(),\r\n        )));\r\n    }\r\n\r\n    //Busca un auto con las caracteristicas exactas\r\n    pub fn buscar_auto(\u0026self, a1: \u0026Auto) -\u003e Option\u003c\u0026Auto\u003e {\r\n        let mut res = None;\r\n        if !self.autos.is_empty() {\r\n            for auto in \u0026self.autos {\r\n                if auto.es_igual_a(\u0026a1) {\r\n                    res = Some(auto);\r\n                    break;\r\n                }\r\n            }\r\n        }\r\n        return res;\r\n    }\r\n}\r\n\r\n#[cfg(test)]\r\nmod testing_ejercicio1 {\r\n    use crate::tp5::ej1::*;\r\n\r\n    /*\r\n        Auto\r\n    */\r\n\r\n    #[test]\r\n    fn creacion_auto() {\r\n        let a = Auto::new(\u0026\"asdf\", \u0026\"aytuiy\", 2023, 100432.0, Colores::Rojo);\r\n        assert_eq!(\r\n            a.es_igual_a(\u0026Auto::new(\r\n                \u0026\"asdf\",\r\n                \u0026\"aytuiy\",\r\n                2023,\r\n                100432.0,\r\n                Colores::Rojo\r\n            )),\r\n            true\r\n        );\r\n    }\r\n\r\n    #[test]\r\n    fn calculo_precio_auto() {\r\n        //Identificar colores primarios\r\n        let a1 = Auto::new(\u0026\"asd\", \u0026\"aytuiy\", 2023, 100000.0, Colores::Rojo);\r\n        assert_eq!(a1.calcular_precio(), 125000.0);\r\n\r\n        let a1 = Auto::new(\u0026\"asd\", \u0026\"aytuiy\", 2023, 200000.0, Colores::Azul);\r\n        assert_eq!(a1.calcular_precio(), 250000.0);\r\n\r\n        let a1 = Auto::new(\u0026\"asd\", \u0026\"aytuiy\", 2023, 300000.0, Colores::Amarillo);\r\n        assert_eq!(a1.calcular_precio(), 375000.0);\r\n\r\n        //Identificar colores secundarios\r\n        let a2 = Auto::new(\u0026\"asd\", \u0026\"aytuiy\", 2023, 100000.0, Colores::Verde);\r\n        assert_eq!(a2.calcular_precio(), 90000.0);\r\n\r\n        let a2 = Auto::new(\u0026\"asd\", \u0026\"aytuiy\", 2023, 50000.0, Colores::Blanco);\r\n        assert_eq!(a2.calcular_precio(), 45000.0);\r\n\r\n        let a2 = Auto::new(\u0026\"asd\", \u0026\"aytuiy\", 2023, 15000.0, Colores::Negro);\r\n        assert_eq!(a2.calcular_precio(), 13500.0);\r\n\r\n        //Identificar marca y conjunto de colores\r\n        let a_bmw = Auto::new(\u0026\"BMW\", \u0026\"aytuiy\", 2023, 100000.0, Colores::Verde);\r\n        assert_eq!(a_bmw.calcular_precio(), 105000.0);\r\n\r\n        let a_bmw = Auto::new(\u0026\"BMW\", \u0026\"aytuiy\", 2023, 200000.0, Colores::Amarillo);\r\n        assert_eq!(a_bmw.calcular_precio(), 280000.0);\r\n\r\n        //Identificar antigüedad y conjunto de colores\r\n        let a_antiguo = Auto::new(\u0026\"asd\", \u0026\"aytuiy\", 2000, 100000.0, Colores::Rojo);\r\n        assert_eq!(a_antiguo.calcular_precio(), 125000.0);\r\n\r\n        let a_antiguo = Auto::new(\u0026\"asd\", \u0026\"aytuiy\", 1999, 100000.0, Colores::Amarillo);\r\n        assert_eq!(a_antiguo.calcular_precio(), 120000.0);\r\n\r\n        //Reconocer condiciones mixtas\r\n        let a_mixto = Auto::new(\u0026\"BMW\", \u0026\"aytuiy\", 1995, 100000.0, Colores::Amarillo);\r\n        assert_eq!(a_mixto.calcular_precio(), 135000.0);\r\n    }\r\n\r\n    /*\r\n        Concensionaria\r\n    */\r\n\r\n    fn crear_conjunto_autos() -\u003e Vec\u003cAuto\u003e {\r\n        let mut res = Vec::new();\r\n        let auto1 = Auto::new(\u0026\"BMW\", \u0026\"a234\", 1995, 100000.0, Colores::Amarillo);\r\n        let auto2 = Auto::new(\u0026\"Piolita\", \u0026\"b321\", 1999, 100000.0, Colores::Verde);\r\n        let auto3 = Auto::new(\u0026\"Tesla\", \u0026\"c521\", 2020, 1000000.0, Colores::Negro);\r\n        let auto4 = Auto::new(\u0026\"Tojota\", \u0026\"f931\", 2019, 500000.0, Colores::Rojo);\r\n        res.push(auto1);\r\n        res.push(auto2);\r\n        res.push(auto3);\r\n        res.push(auto4);\r\n        return res;\r\n    }\r\n\r\n    #[test]\r\n    fn creacion_consecionaria() {\r\n        let conse1 = ConcesionarioAuto::new(\u0026\"Conse1\", \u0026\"Av1\", 4, \"./lista_autos.json\");\r\n        assert_eq!(\r\n            conse1.es_igual_a(\u0026ConcesionarioAuto::new(\r\n                \u0026\"Conse1\",\r\n                \u0026\"Av1\",\r\n                4,\r\n                \"./lista_autos.json\"\r\n            )),\r\n            true\r\n        );\r\n    }\r\n\r\n    #[test]\r\n    fn operatoria_consecionaria() {\r\n        let mut conse1 = ConcesionarioAuto::new(\u0026\"Conse1\", \u0026\"Av1\", 4, \"./lista_autos.json\");\r\n        //Agregar autos\r\n        let autos = crear_conjunto_autos();\r\n        for a in autos {\r\n            assert!(conse1.agregar_auto(a).is_ok(), \"Aqui no debio fallar\");\r\n        }\r\n\r\n        //Intentar superar limite de espacio\r\n        let auto_nuevo = Auto::new(\u0026\"Bicho\", \u0026\"j221\", 2020, 1000000.0, Colores::Negro);\r\n        assert!(\r\n            conse1.agregar_auto(auto_nuevo.clone()).is_err_and(|e| {\r\n                //Validar mensaje no nulo\r\n                assert!(!e.to_string().is_empty());\r\n                matches!(e, Errores::ErrorCapacidad(_))\r\n            }),\r\n            \"Aquí debió fallar por superar la capacidad\"\r\n        );\r\n\r\n        //Intentar borrar un auto no agregado\r\n        assert!(\r\n            conse1.eliminar_auto(\u0026auto_nuevo).is_err_and(|e| {\r\n                //Validar mensaje no nulo\r\n                assert!(!e.to_string().is_empty());\r\n                matches!(e, Errores::ErrorBaja(_))\r\n            }),\r\n            \"Aquí debió fallar el eliminar un auto inexistente\"\r\n        );\r\n\r\n        //Continuar las operaciones con otra consecionaria\r\n        //(Demostracion de persistencia - traslado de datos a otra instancia en caso de \"cambio\")\r\n        let mut conse2 = ConcesionarioAuto::new(\u0026\"Conse2\", \u0026\"Av2\", 4, \"./lista_autos.json\");\r\n\r\n        //Eliminar todos los autos\r\n        let autos = crear_conjunto_autos();\r\n        for a in autos {\r\n            assert!(conse2.eliminar_auto(\u0026a).is_ok(), \"Aqui no debio fallar\");\r\n        }\r\n        //Intentar borrar un auto en una lista vacia\r\n        assert!(\r\n            conse2\r\n                .eliminar_auto(\u0026auto_nuevo)\r\n                .is_err_and(|e| matches!(e, Errores::ErrorBaja(_))),\r\n            \"Aquí debió fallar el eliminar un auto en una estructura vacia\"\r\n        );\r\n\r\n        //Agregar y buscar un nuevo auto\r\n        let auto_nuevo = Auto::new(\u0026\"Bichito\", \u0026\"j221\", 2020, 1000000.0, Colores::Negro);\r\n        assert!(\r\n            conse2.agregar_auto(auto_nuevo.clone()).is_ok(),\r\n            \"Aqui no debio fallar\"\r\n        );\r\n\r\n        assert!(\r\n            conse2\r\n                .buscar_auto(\u0026auto_nuevo)\r\n                .is_some_and(|a| a.es_igual_a(\u0026auto_nuevo)),\r\n            \"Aqui no tendria que haber fallado\"\r\n        );\r\n\r\n        assert!(\r\n            conse2.eliminar_auto(\u0026auto_nuevo).is_ok(),\r\n            \"Aqui no debio fallar\"\r\n        );\r\n        assert_eq!(conse2.buscar_auto(\u0026auto_nuevo).is_none(), true);\r\n    }\r\n\r\n    /*\r\n        Casos especiales para la cobertura de coverage\r\n    */\r\n    #[test]\r\n    fn caso_especial_error_io() {\r\n        // Se buscara forzar un ErrorIO usando una ruta cuyo directorio base NO EXISTE\r\n        let path_imposible = \"./carpeta_inexistente_123/autos.json\";\r\n\r\n        let mut conse = ConcesionarioAuto::new(\u0026\"ConseBackRoom\", \u0026\"Av 67\", 5, path_imposible);\r\n        let auto = Auto::new(\u0026\"Ford\", \u0026\"Ka\", 2015, 60000.0, Colores::Verde);\r\n\r\n        // Al intentar agregar el auto, llamará internamente a File::create() en la ruta rota, provocando un ErrorIO\r\n        assert!(\r\n            conse.agregar_auto(auto).is_err_and(|e| {\r\n                assert!(!e.to_string().is_empty());\r\n                matches!(e, Errores::ErrorIO(_))\r\n            }),\r\n            \"Aquí debió fallar\"\r\n        );\r\n    }\r\n\r\n    #[test]\r\n    fn caso_especial_error_serde() {\r\n        let path_err = \"./corrupto.json\";\r\n\r\n        // Se fuerza la escritura en el contenido temporal que NO cumple con el formato estructurado de un .JSON válido\r\n        assert!(\r\n            std::fs::write(path_err, \"{ \u0026\u00265435#$#$\u002642365_XXXX1234 : [::: \").is_ok(),\r\n            \"No debio fallar aqui\"\r\n        );\r\n\r\n        // Se invoca directamente el método para leer el archivo del path que buscara\r\n\r\n        assert!(\r\n            ConcesionarioAuto::recuperar_informacion(path_err).is_err_and(|e| {\r\n                assert!(!e.to_string().is_empty());\r\n                matches!(e, Errores::ErrorSerde(_))\r\n            }),\r\n            \"Aquí debió fallar\"\r\n        );\r\n\r\n        assert!(\r\n            std::fs::remove_file(path_err).is_ok(),\r\n            \"Error fuera de lo previsto\"\r\n        );\r\n    }\r\n}\r\n","traces":[{"line":24,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":25,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":26,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":27,"address":[],"length":0,"stats":{"Line":144115188075855872}},{"line":29,"address":[],"length":0,"stats":{"Line":0}},{"line":30,"address":[],"length":0,"stats":{"Line":0}},{"line":39,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":40,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":41,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":57,"address":[],"length":0,"stats":{"Line":288230376151711744}},{"line":58,"address":[],"length":0,"stats":{"Line":288230376151711744}},{"line":59,"address":[],"length":0,"stats":{"Line":216172782113783808}},{"line":60,"address":[],"length":0,"stats":{"Line":0}},{"line":61,"address":[],"l dress":[],"length":0,"stats":{"Line":72057594037927936}},{"line":289,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":293,"address":[],"length":0,"stats":{"Line":144115188075855872}}],"covered":118,"coverable":127},{"path":["C:","\\","Users","ezeleo","Documents","Programas","Practicas---Seminario-Rust-Recursada","TP5","src","tp5","ej2.rs"],"content":"use serde::{Deserialize, Serialize};\r\nuse serde_json;\r\nuse std::fmt::Display;\r\nuse std::io;\r\nuse std::{\r\n    fs::File,\r\n    io::{Error, Read, Write},\r\n};\r\n\r\n/*\r\n    Implementacion TP5 - Ej2\r\n*/\r\n\r\n/*\r\n    Tipos de errores\r\n*/\r\n#[derive(Debug)]\r\nenum ErroresOperatoria {\r\n    SinDesplazamiento(String),\r\n    Inexistente(String),\r\n    EstructuraVacia(String),\r\n}\r\n\r\nimpl Display for ErroresOperatoria {\r\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\r\n        match self {\r\n            ErroresOperatoria::SinDesplazamiento(val) =\u003e write!(\r\n                f,\r\n                \"La posicion recibida no es valida para la operacion en la estructura {} \",\r\n                val\r\n            ),\r\n            ErroresOperatoria::Inexistente(val) =\u003e {\r\n                write!(f, \"No se encontro el elemento en la estructura {} \", val)\r\n            }\r\n            ErroresOperatoria::EstructuraVacia(val) =\u003e {\r\n                write!(f, \"La estrucutra {} no dispone de elementos \", val)\r\n            }\r\n        }\r\n    }\r\n}\r\n\r\n#[derive(Debug)]\r\nenum Errores {\r\n    ErrorOperatoria(ErroresOperatoria),\r\n    ErrorIO(io::Error),\r\n    ErrorSerde(serde_json::Error),\r\n}\r\n\r\nimpl Display for Errores {\r\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\r\n        match self {\r\n            Errores::ErrorOperatoria(err) =\u003e write!(f, \"{}\", err),\r\n            Errores::ErrorIO(err) =\u003e write!(f, \"Error de E/S al guardar: {}\", err),\r\n            Errores::ErrorSerde(err) =\u003e write!(f, \"Error de serialización: {}\", err),\r\n        }\r\n    }\r\n}\r\n\r\n//Implementacion para el uso del operador (?)\r\nimpl std::error::Error for Errores {}\r\n\r\n//Implementacion automatica errores subyacentes\r\nimpl From\u003cio::Error\u003e for Errores {\r\n    fn from(err: io::Error) -\u003e Self {\r\n        Errores::ErrorIO(err)\r\n    }\r\n}\r\n\r\nimpl From\u003cserde_json::Error\u003e for Errores {\r\n    fn from(err: serde_json::Error) -\u003e Self {\r\n        Errores::ErrorSerde(err)\r\n    }\r\n}\r\n\r\n/*\r\n    Extraccion Ejercicio 8 - TP3\r\n    Estructuras : Cancion , Generos y PlayList\r\n*/\r\n\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\nenum Generos {\r\n    Rock,\r\n    Pop,\r\n    Rap,\r\n    Jazz,\r\n    Otros,\r\n}\r\n\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\nstruct Cancion {\r\n    titulo: String,\r\n    artista: String,\r\n    genero: Generos,\r\n}\r\n\r\n#[derive(Debug)]\r\nstruct PlayList {\r\n    nombre: String,\r\n    canciones: Vec\u003cCancion\u003e,\r\n    path: String,\r\n}\r\n\r\n/*\r\n    Metodos asociados\r\n*/\r\n\r\n//Metodos para Cancion\r\nimpl Generos {\r\n    pub fn es_igual_a(\u0026self, g: \u0026Generos) -\u003e bool {\r\n        match (self, g) {\r\n            (Generos::Rock, Generos::Rock) =\u003e true,\r\n            (Generos::Pop, Generos::Pop) =\u003e true,\r\n            (Generos::Rap, Generos::Rap) =\u003e true,\r\n            (Generos::Jazz, Generos::Jazz) =\u003e true,\r\n            (Generos::Otros, Generos::Otros) =\u003e true,\r\n            _ =\u003e false,\r\n        }\r\n    }\r\n}\r\nimpl Cancion {\r\n    //Metodos secundarios\r\n    pub fn get_titulo(\u0026self) -\u003e \u0026String {\r\n        return \u0026self.titulo;\r\n    }\r\n    pub fn get_artista(\u0026self) -\u003e \u0026String {\r\n        return \u0026self.artista;\r\n    }\r\n    pub fn get_genero(\u0026self) -\u003e \u0026Generos {\r\n        return \u0026self.genero;\r\n    }\r\n    pub fn es_igual_a(\u0026self, c: \u0026Cancion) -\u003e bool {\r\n        return (\u0026self.titulo == c.get_titulo())\r\n            \u0026\u0026 (\u0026self.artista == c.get_artista())\r\n            \u0026\u0026 (self.genero.es_igual_a(\u0026c.get_genero()));\r\n    }\r\n    //Metodos primarios\r\n    pub fn new(nom1: \u0026str, nom2: \u0026str, gen_in: Generos) -\u003e Cancion {\r\n        return Cancion {\r\n            titulo: nom1.to_string(),\r\n            artista: nom2.to_string(),\r\n            genero: gen_in,\r\n        };\r\n    }\r\n}\r\n\r\nimpl PlayList {\r\n    //Metodos secundarios\r\n    pub fn get_nombre(\u0026self) -\u003e \u0026String {\r\n        return \u0026self.nombre;\r\n    }\r\n    /*\r\n        Nuevos metodos del tp5\r\n    */\r\n    fn recuperar_informacion(path: \u0026str) -\u003e Result\u003cVec\u003cCancion\u003e, Errores\u003e {\r\n        let file = File::open(path).map_err(Errores::ErrorIO)?;\r\n        let canciones: Vec\u003cCancion\u003e = serde_json::from_reader(file).map_err(Errores::ErrorSerde)?;\r\n        Ok(canciones)\r\n    }\r\n    fn guardar_informacion(\u0026self) -\u003e Result\u003c(), Errores\u003e {\r\n        let mut file = File::create(\u0026self.path)?;\r\n        let serialized = serde_json::to_string(\u0026self.canciones)?;\r\n        file.write_all(serialized.as_bytes())?;\r\n        return Ok(());\r\n    }\r\n    //Metodos primarios\r\n    pub fn new(nom: \u0026str, path_in: \u0026str) -\u003e PlayList {\r\n        let list_canciones: Vec\u003cCancion\u003e = match PlayList::recuperar_informacion(\u0026path_in) {\r\n            Ok(dato) =\u003e dato,\r\n            Err(_) =\u003e Vec::new(),\r\n        };\r\n        return PlayList {\r\n            nombre: nom.to_string(),\r\n            canciones: list_canciones,\r\n            path: path_in.to_string(),\r\n        };\r\n    }\r\n    pub fn agregar_cancion(\u0026mut self, c: Cancion) -\u003e Result\u003c(), Errores\u003e {\r\n        self.canciones.push(c);\r\n        self.guardar_informacion()?;\r\n        return Ok(());\r\n    }\r\n    pub fn eliminar_cancion(\u0026mut self, c: \u0026Cancion) -\u003e Result\u003c(), Errores\u003e {\r\n        if !self.canciones.is_empty() {\r\n            let mut pos = None;\r\n            for i in 0..self.canciones.len() {\r\n                if self.canciones[i].es_igual_a(\u0026c) {\r\n                    pos = Some(i);\r\n                    break;\r\n                }\r\n            }\r\n            if let Some(indice_c) = pos {\r\n                self.canciones.remove(indice_c);\r\n                self.guardar_informacion()?;\r\n                return Ok(());\r\n            }\r\n            return Err(Errores::ErrorOperatoria(ErroresOperatoria::Inexistente(\r\n                self.get_nombre().clone(),\r\n            )));\r\n        }\r\n        return Err(Errores::ErrorOperatoria(\r\n            ErroresOperatoria::EstructuraVacia(self.get_nombre().clone()),\r\n        ));\r\n    }\r\n    //la posicion oscila entre el rango (0..tam-1) , como lo hacen los metodos genericos de vec .get()\r\n    pub fn mover_cancion(\u0026mut self, c: \u0026Cancion, pos: usize) -\u003e Result\u003c(), Errores\u003e {\r\n        if !self.canciones.is_empty() {\r\n            if pos \u003c self.canciones.len() {\r\n                if let Some(indice) = self\r\n                    .canciones\r\n                    .iter()\r\n                    .position(|cancion| cancion.es_igual_a(c))\r\n                {\r\n                    if indice != pos {\r\n                        let cancion = self.canciones.remove(indice);\r\n                        self.canciones.insert(pos, cancion);\r\n                    }\r\n\r\n                    self.guardar_informacion()?;\r\n                    return Ok(());\r\n                }\r\n                return Err(Errores::ErrorOperatoria(ErroresOperatoria::Inexistente(\r\n                    self.get_nombre().clone(),\r\n                )));\r\n            }\r\n            return Err(Errores::ErrorOperatoria(\r\n                ErroresOperatoria::SinDesplazamiento(self.get_nombre().clone()),\r\n            ));\r\n        }\r\n        Err(Errores::ErrorOperatoria(\r\n            ErroresOperatoria::EstructuraVacia(self.get_nombre().clone()),\r\n        ))\r\n    }\r\n\r\n    pub fn buscar_cancion(\u0026self, nom: \u0026String) -\u003e Option\u003c\u0026Cancion\u003e {\r\n        let mut res: Option\u003c\u0026Cancion\u003e = None;\r\n        if !self.canciones.is_empty() {\r\n            for cancion in \u0026self.canciones {\r\n                if cancion.get_titulo() == nom {\r\n                    res = Some(cancion);\r\n                    break;\r\n                }\r\n            }\r\n        }\r\n        return res;\r\n    }\r\n    pub fn canciones_genero(\u0026self, gen_in: \u0026Generos) -\u003e Result\u003cVec\u003c\u0026Cancion\u003e, Errores\u003e {\r\n        if !self.canciones.is_empty() {\r\n            let mut res = Vec::new();\r\n            for cancion in \u0026self.canciones {\r\n                if cancion.genero.es_igual_a(gen_in) {\r\n                    res.push(cancion);\r\n                }\r\n            }\r\n            return Ok(res);\r\n        }\r\n        return Err(Errores::ErrorOperatoria(\r\n            ErroresOperatoria::EstructuraVacia(self.get_nombre().clone()),\r\n        ));\r\n    }\r\n    pub fn canciones_artista(\u0026self, nom: \u0026String) -\u003e Result\u003c(Vec\u003c\u0026Cancion\u003e), Errores\u003e {\r\n        if !self.canciones.is_empty() {\r\n            let mut res = Vec::new();\r\n            for cancion in \u0026self.canciones {\r\n                if cancion.get_artista() == nom {\r\n                    res.push(cancion);\r\n                }\r\n            }\r\n            return Ok(res);\r\n        }\r\n        return Err(Errores::ErrorOperatoria(\r\n            ErroresOperatoria::EstructuraVacia(self.get_nombre().clone()),\r\n        ));\r\n    }\r\n    pub fn modificar_titulo(\u0026mut self, nom_nuevo: \u0026String) {\r\n        self.nombre = nom_nuevo.to_string();\r\n    }\r\n    pub fn eliminar_canciones(\u0026mut self) -\u003e Result\u003c(), Errores\u003e {\r\n        self.canciones.clear();\r\n        self.guardar_informacion()?;\r\n        return Ok(());\r\n    }\r\n}\r\n\r\n#[cfg(test)]\r\nmod testing_ejercicio8 {\r\n    use super::*;\r\n\r\n    #[test]\r\n    fn manipulacion_playlist() {\r\n        let mut nom_pri = \"reproductor1\".to_string();\r\n        let mut p = PlayList::new(\u0026nom_pri, \"\");\r\n        assert_eq!(p.get_nombre(), \u0026nom_pri.to_string());\r\n        nom_pri = \"repro1\".to_string();\r\n        p.modificar_titulo(\u0026nom_pri);\r\n        assert_eq!(p.get_nombre(), \u0026nom_pri.to_string());\r\n    }\r\n    #[test]\r\n    fn operatoria_canciones() {\r\n        let mut p = PlayList::new(\u0026\"asd\".to_string(), \"./lista_canciones.json\");\r\n        let c = Cancion::new(\u0026\"pepe\", \u0026\"pepito\", Generos::Rap);\r\n        assert!(p.agregar_cancion(c.clone()).is_ok());\r\n        assert!(p.agregar_cancion(c.clone()).is_ok());\r\n        assert!(\r\n            p.buscar_cancion(\u0026\"pepe\".to_string())\r\n                .is_some_and(|c1| c1.es_igual_a(\u0026c)),\r\n            \"No existe esa cancion\"\r\n        );\r\n\r\n        //Desplazamientos\r\n        let c2 = Cancion::new(\u0026\"pepo\", \u0026\"pepe\", Generos::Rap);\r\n        assert!(p.agregar_cancion(c2.clone()).is_ok());\r\n        assert!(p.mover_cancion(\u0026c2, 0).is_ok());\r\n        assert!(\r\n            p.canciones.get(0).is_some_and(|c| c.es_igual_a(\u0026c2)),\r\n            \"No existe esa cancion\"\r\n        );\r\n        let c3 = Cancion::new(\u0026\"pimpon\", \u0026\"tito\", Generos::Rap);\r\n        assert!(p.agregar_cancion(c3.clone()).is_ok());\r\n        assert!(p.mover_cancion(\u0026c3, 2).is_ok());\r\n        assert!(\r\n            p.canciones.get(2).is_some_and(|c| c.es_igual_a(\u0026c3)),\r\n            \"No existe esa cancion\"\r\n        );\r\n        assert!(p.mover_cancion(\u0026c2, 3).is_ok());\r\n        assert!(\r\n            p.canciones\r\n                .get(p.canciones.len() - 1)\r\n                .is_some_and(|c| c.es_igual_a(\u0026c2)),\r\n            \"No existe esa cancion\"\r\n        );\r\n        assert!(\r\n            p.mover_cancion(\u0026c2, 4).is_err_and(|e| {\r\n                assert!(!e.to_string().is_empty());\r\n                matches!(\r\n                    e,\r\n                    Errores::ErrorOperatoria(ErroresOperatoria::SinDesplazamiento(_))\r\n                )\r\n            }),\r\n            \"Aqui debio fallar\"\r\n        );\r\n\r\n        //Borrar algunas canciones\r\n        assert!(p.eliminar_cancion(\u0026c3).is_ok());\r\n        assert!(\r\n            p.eliminar_cancion(\u0026c3).is_err_and(|e| {\r\n                assert!(!e.to_string().is_empty());\r\n                matches!(\r\n                    e,\r\n                    Errores::ErrorOperatoria(ErroresOperatoria::Inexistente(_))\r\n                )\r\n            }),\r\n            \"Aqui debio fallar\"\r\n        );\r\n\r\n        //Limpieza completa\r\n        assert!(p.eliminar_canciones().is_ok());\r\n        assert!(\r\n            p.mover_cancion(\u0026c2, 0).is_err_and(|e| {\r\n                assert!(!e.to_string().is_empty());\r\n                matches!(\r\n                    e,\r\n                    Errores::ErrorOperatoria(ErroresOperatoria::EstructuraVacia(_))\r\n                )\r\n            }),\r\n            \"Aqui debio fallar\"\r\n        );\r\n\r\n        assert!(\r\n            p.eliminar_cancion(\u0026c2).is_err_and(|e| {\r\n                assert!(!e.to_string().is_empty());\r\n                matches!(\r\n                    e,\r\n                    Errores::ErrorOperatoria(ErroresOperatoria::EstructuraVacia(_))\r\n                )\r\n            }),\r\n            \"Aqui debio fallar\"\r\n        );\r\n    }\r\n    #[test]\r\n    fn listado_canciones() {\r\n        let mut p = PlayList::new(\u0026\"asd\", \"./lista_canciones2.json\");\r\n        let c1 = Cancion::new(\u0026\"pepe\", \u0026\"pepito\", Generos::Rap);\r\n        let c4 = Cancion::new(\u0026\"pepesito\", \u0026\"pepito\", Generos::Jazz);\r\n        let c2 = Cancion::new(\u0026\"donPepe\", \u0026\"donPepito\", Generos::Rap);\r\n        let c3 = Cancion::new(\u0026\"qwe\", \u0026\"Qwe\", Generos::Rock);\r\n        assert!(p.agregar_cancion(c1.clone()).is_ok());\r\n        assert!(p.agregar_cancion(c2).is_ok());\r\n        assert!(p.agregar_cancion(c1).is_ok());\r\n        assert!(p.agregar_cancion(c3.clone()).is_ok());\r\n        assert!(p.agregar_cancion(c3).is_ok());\r\n        assert!(p.agregar_cancion(c4).is_ok());\r\n\r\n        //Listados\r\n        assert!(p.canciones_genero(\u0026Generos::Rap).is_ok_and(|l| {\r\n            assert_eq!(l.len(), 3);\r\n            l.iter().all(|c| c.genero.es_igual_a(\u0026Generos::Rap))\r\n        }));\r\n\r\n        assert!(p.canciones_artista(\u0026\"pepito\".to_string()).is_ok_and(|l| {\r\n            assert_eq!(l.len(), 3);\r\n            l.iter().all(|c| c.get_artista() == \u0026\"pepito\".to_string())\r\n        }));\r\n\r\n        assert!(p.eliminar_canciones().is_ok());\r\n\r\n        assert!(p.canciones_genero(\u0026Generos::Rock).is_err_and(|e| matches!(\r\n            e,\r\n            Errores::ErrorOperatoria(ErroresOperatoria::EstructuraVacia(_))\r\n        )));\r\n        assert!(\r\n            p.canciones_artista(\u0026\"Joaco\".to_string())\r\n                .is_err_and(|e| matches!(\r\n                    e,\r\n                    Errores::ErrorOperatoria(ErroresOperatoria::EstructuraVacia(_))\r\n                ))\r\n        );\r\n    }\r\n\r\n    /*\r\n        Casos especiales para la cobertura de coverage\r\n    */\r\n    #[test]\r\n    fn caso_especial_error_io() {\r\n        // Se buscara forzar un ErrorIO usando una ruta cuyo directorio base no existe\r\n        let path_imposible = \"./carpeta_inexistente_123/x.json\";\r\n\r\n        let mut p = PlayList::new(\u0026\"asd\", path_imposible);\r\n        let c1 = Cancion::new(\u0026\"pepe\", \u0026\"pepito\", Generos::Rap);\r\n\r\n        // Al intentar agregar el elemento, llamará internamente a File::create() en la ruta rota, provocando un ErrorIO\r\n        assert!(\r\n            p.agregar_cancion(c1).is_err_and(|e| {\r\n                assert!(!e.to_string().is_empty());\r\n                matches!(e, Errores::ErrorIO(_))\r\n            }),\r\n            \"Aquí debió fallar\"\r\n        );\r\n    }\r\n\r\n    #[test]\r\n    fn caso_especial_error_serde() {\r\n        let path_err = \"./corrupto.json\";\r\n\r\n        // Se fuerza la escritura en el contenido temporal que NO cumple con el formato estructurado de un .JSON válido\r\n        assert!(\r\n            std::fs::write(path_err, \"{ \u0026\u00265435#$#$\u002642365_XXXX1234 : [::: \").is_ok(),\r\n            \"No debio fallar aqui\"\r\n        );\r\n\r\n        // Se invoca directamente el método para leer el archivo del path que buscara\r\n\r\n        assert!(\r\n            PlayList::recuperar_informacion(path_err).is_err_and(|e| {\r\n                assert!(!e.to_string().is_empty());\r\n                matches!(e, Errores::ErrorSerde(_))\r\n            }),\r\n            \"Aquí debió fallar\"\r\n        );\r\n\r\n        assert!(\r\n            std::fs::remove_file(path_err).is_ok(),\r\n            \"Error fuera de lo previsto\"\r\n        );\r\n    }\r\n}\r\n","traces":[{"line":25,"address":[],"length":0,"stats":{"Line":288230376151711744}},{"line":26,"address":[],"length":0,"stats":{"Line":288230376151711744}},{"line":27,"address":[],"length":0,"stats":{"Line":144115188075855872}},{"line":28,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":32,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":33,"address":[],"lengt },{"line":265,"address":[],"length":0,"stats":{"Line":432345564227567616}},{"line":268,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":270,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":271,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":274,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":275,"address":[],"length":0,"stats":{"Line":216172782113783808}},{"line":277,"address":[],"length":0,"stats":{"Line":144115188075855872}},{"line":278,"address":[],"length":0,"stats":{"Line":288230376151711744}},{"line":279,"address":[],"length":0,"stats":{"Line":288230376151711744}},{"line":280,"address":[],"length":0,"stats":{"Line":144115188075855872}}],"covered":119,"coverable":127},{"path":["C:","\\","Users","ezeleo","Documents","Programas","Practicas---Seminario-Rust-Recursada","TP5","src","tp5","ej3.rs"],"content":"/*\r\n    IMPLEMENTACION DE EJERCICIO 3 - TP5\r\n*/\r\nuse serde::{Deserialize, Serialize};\r\nuse serde_json;\r\nuse std::fmt::Display;\r\nuse std::io;\r\nuse std::{\r\n    fs::File,\r\n    io::{Error, Read, Write},\r\n};\r\n\r\n/*\r\n    Tipos de errores\r\n*/\r\n#[derive(Debug)]\r\nenum ErroresOperatoria {\r\n    Inexistente(String),\r\n    EstructuraVacia(String),\r\n}\r\n\r\nimpl Display for ErroresOperatoria {\r\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\r\n        match self {\r\n            ErroresOperatoria::Inexistente(val) =\u003e {\r\n                write!(f, \"No se encontro el elemento en la estructura {} \", val)\r\n            }\r\n            ErroresOperatoria::EstructuraVacia(val) =\u003e {\r\n                write!(f, \"La estrucutra {} no dispone de elementos \", val)\r\n            }\r\n        }\r\n    }\r\n}\r\n\r\n#[derive(Debug)]\r\nenum Errores {\r\n    ErrorOperatoria(ErroresOperatoria),\r\n    ErrorIO(io::Error),\r\n    ErrorSerde(serde_json::Error),\r\n}\r\n\r\nimpl Display for Errores {\r\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\r\n        match self {\r\n            Errores::ErrorOperatoria(err) =\u003e write!(f, \"{}\", err),\r\n            Errores::ErrorIO(err) =\u003e write!(f, \"Error de E/S al guardar: {}\", err),\r\n            Errores::ErrorSerde(err) =\u003e write!(f, \"Error de serialización: {}\", err),\r\n        }\r\n    }\r\n}\r\n\r\n//Implementacion para el uso del operador (?)\r\nimpl std::error::Error for Errores {}\r\n\r\n//Implementacion automatica errores subyacentes\r\nimpl From\u003cio::Error\u003e for Errores {\r\n    fn from(err: io::Error) -\u003e Self {\r\n        Errores::ErrorIO(err)\r\n    }\r\n}\r\n\r\nimpl From\u003cserde_json::Error\u003e for Errores {\r\n    fn from(err: serde_json::Error) -\u003e Self {\r\n        Errores::ErrorSerde(err)\r\n    }\r\n}\r\n\r\n/*\r\n    Extraccion Ejercicio9 TP3\r\n*/\r\n/*\r\n    Estructura Fecha - Ejercicio3 - TP3\r\n*/\r\n\r\nuse std::collections::VecDeque;\r\n\r\n//Atributos\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\npub struct Fecha {\r\n    pub dia: u8,\r\n    pub mes: u8,\r\n    pub anio: u16,\r\n}\r\n\r\n/*\r\n    Metodos\r\n*/\r\n\r\nimpl Fecha {\r\n    //Metodos Secundarios\r\n    pub fn get_dia(\u0026self) -\u003e u8 {\r\n        return self.dia;\r\n    }\r\n    pub fn get_mes(\u0026self) -\u003e u8 {\r\n        return self.mes;\r\n    }\r\n    pub fn get_anio(\u0026self) -\u003e u16 {\r\n        return self.anio;\r\n    }\r\n    pub fn es_igual_a(\u0026self, f: \u0026Fecha) -\u003e bool {\r\n        return if (self.get_dia() == f.get_dia())\r\n            \u0026\u0026 (self.get_mes() == f.get_mes())\r\n            \u0026\u0026 (self.get_anio() == f.get_anio())\r\n        {\r\n            true\r\n        } else {\r\n            false\r\n        };\r\n    }\r\n    /*\r\n       Metodos Primarios\r\n    */\r\n    pub fn new(d: u8, m: u8, a: u16) -\u003e Fecha {\r\n        return Fecha {\r\n            dia: d,\r\n            mes: m,\r\n            anio: a,\r\n        };\r\n    }\r\n    pub fn es_fecha_valida(\u0026self) -\u003e bool {\r\n        if (self.mes \u003e 0) \u0026\u0026 (self.mes \u003c= 12) \u0026\u0026 (self.anio \u003e 0) \u0026\u0026 (self.dia \u003e 0) {\r\n            match self.mes {\r\n                2 =\u003e {\r\n                    if self.es_bisiesto() {\r\n                        return self.dia \u003c= 29;\r\n                    } else {\r\n                        return self.dia \u003c= 28;\r\n                    }\r\n                }\r\n                9 | 4 | 6 | 11 =\u003e return self.dia \u003c= 30,\r\n                _ =\u003e return self.dia \u003c= 31,\r\n            }\r\n        }\r\n\r\n        return false;\r\n    }\r\n\r\n    pub fn es_bisiesto(\u0026self) -\u003e bool {\r\n        return (self.anio % 4 == 0 \u0026\u0026 self.anio % 100 != 0) || (self.anio % 400 == 0);\r\n    }\r\n\r\n    //Auxiliar para determinar el ultimo dia de un mes\r\n    fn ultimo_dia(\u0026self) -\u003e u8 {\r\n        match self.mes {\r\n            2 =\u003e {\r\n                if self.es_bisiesto() {\r\n                    29\r\n                } else {\r\n                    28\r\n                }\r\n            }\r\n            9 | 4 | 6 | 11 =\u003e 30,\r\n            _ =\u003e 31,\r\n        }\r\n    }\r\n\r\n    //Auxiliar para avanzar de mes y anio\r\n    fn avanzar_mes(\u0026mut self) {\r\n        if self.mes == 12 {\r\n            self.mes = 1;\r\n            self.anio += 1;\r\n        } else {\r\n            self.mes += 1;\r\n        }\r\n        self.dia = 1;\r\n    }\r\n\r\n    //Se considera que la fecha es valida\r\n    pub fn sumar_dias(\u0026mut self, mut dias_sumar: u32) {\r\n        //Bucle principal para el calculo\r\n        while dias_sumar \u003e 0 {\r\n            //Obtiene el ultimo dia del mes (Cantidad total de dias que le corresponde)\r\n            let dias_mes = self.ultimo_dia();\r\n            //Calcula el resto de dias que debera actualizar en \"dias_sumar\" para avanzar en mes y anio hasta llegar al mes con la cantidad minima a sumar de dias correspondiente\r\n            let dias_restantes = dias_mes - self.dia + 1;\r\n\r\n            //Avanza en los meses y anios(si fuera necesario) hasta llegar al mes y sumar la cantidad minima de dias\r\n            if dias_sumar \u003e= dias_restantes as u32 {\r\n                dias_sumar -= dias_restantes as u32;\r\n                self.avanzar_mes();\r\n            } else {\r\n                //Suma la cantidad correspondiente al mes\r\n                self.dia += dias_sumar as u8;\r\n                //Fin de ejecucion\r\n                dias_sumar = 0;\r\n            }\r\n        }\r\n    }\r\n\r\n    //Auxiliar para retroceder de mes y anio\r\n    fn retroceder_mes(\u0026mut self) {\r\n        if self.mes == 1 {\r\n            self.mes = 12;\r\n            self.anio -= 1;\r\n        } else {\r\n            self.mes -= 1;\r\n        }\r\n        self.dia = self.ultimo_dia();\r\n    }\r\n\r\n    //Se considera que la fecha es valida\r\n    //Y que no se llegara a una fecha negativa(anio negativo)\r\n    pub fn restar_dias(\u0026mut self, mut dias_restar: u32) {\r\n        //Bucle principal para el calculo\r\n        while dias_restar \u003e 0 {\r\n            //Retrocede en los meses y anios(si fuera necesario) hasta llegar al mes y restar la cantidad minima de dias\r\n            if dias_restar \u003e= self.dia as u32 {\r\n                dias_restar -= self.dia as u32;\r\n                self.retroceder_mes();\r\n            } else {\r\n                //Resta la cantidad correspondiente al mes\r\n                self.dia -= dias_restar as u8;\r\n                //Fin de ejecucion\r\n                dias_restar = 0;\r\n            }\r\n        }\r\n    }\r\n\r\n    pub fn es_mayor(\u0026self, f: \u0026Fecha) -\u003e bool {\r\n        return if self.anio \u003e f.anio {\r\n            true\r\n        } else if (self.anio == f.anio) \u0026\u0026 (self.mes \u003e f.mes) {\r\n            true\r\n        } else if (self.mes == f.mes) \u0026\u0026 (self.dia \u003e f.dia) {\r\n            true\r\n        } else {\r\n            false\r\n        };\r\n    }\r\n}\r\n\r\n#[cfg(test)]\r\nmod testing_ejercicio3 {\r\n    use super::Fecha;\r\n\r\n    #[test]\r\n    fn creacion_fecha() {\r\n        let f = Fecha::new(1, 1, 2025);\r\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(1, 1, 2025)), true);\r\n    }\r\n\r\n    #[test]\r\n    fn validacion_de_fecha() {\r\n        let mut f = Fecha::new(1, 1, 2025);\r\n        assert_eq!(f.es_fecha_valida(), true);\r\n        f = Fecha::new(31, 2, 2004);\r\n        assert_eq!(f.es_fecha_valida(), false);\r\n        f = Fecha::new(32, 2, 2005);\r\n        assert_eq!(f.es_fecha_valida(), false);\r\n    }\r\n\r\n    #[test]\r\n    fn validar_bisiesto() {\r\n        let mut f = Fecha::new(1, 1, 2028);\r\n        assert_eq!(f.es_bisiesto(), true);\r\n        f = Fecha::new(1, 1, 2025);\r\n        assert_eq!(f.es_bisiesto(), false);\r\n        f = Fecha::new(1, 1, 100);\r\n        assert_eq!(f.es_bisiesto(), false);\r\n        f = Fecha::new(1, 1, 400);\r\n        assert_eq!(f.es_bisiesto(), true);\r\n    }\r\n\r\n    #[test]\r\n    fn adicion_fecha() {\r\n        let mut f = Fecha::new(1, 1, 2028);\r\n        f.sumar_dias(30);\r\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(31, 1, 2028)), true);\r\n        f.sumar_dias(1);\r\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(1, 2, 2028)), true);\r\n        f.sumar_dias(29);\r\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(1, 3, 2028)), true);\r\n    }\r\n\r\n    #[test]\r\n    fn sustraccion_fecha() {\r\n        let mut f = Fecha::new(10, 4, 2028);\r\n        f.restar_dias(9);\r\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(1, 4, 2028)), true);\r\n        f.restar_dias(31);\r\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(1, 3, 2028)), true);\r\n        f.restar_dias(1);\r\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(29, 2, 2028)), true);\r\n    }\r\n\r\n    #[test]\r\n    fn comparacion_fechas() {\r\n        let f1 = Fecha::new(25, 5, 2000);\r\n        let f2 = Fecha::new(25, 2, 2004);\r\n        assert_eq!(f1.es_mayor(\u0026f2), false);\r\n        assert_eq!(f2.es_mayor(\u0026f1), true);\r\n    }\r\n}\r\n/*\r\n    Estructuras\r\n*/\r\n\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\nenum Animales {\r\n    Perro,\r\n    Gato,\r\n    Caballo,\r\n    Otro,\r\n}\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\nstruct Duenio {\r\n    nombre: String,\r\n    direccion: String,\r\n    telefono: u32,\r\n}\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\nstruct Mascota {\r\n    nombre: String,\r\n    edad: u32,\r\n    tipo: Animales,\r\n    duenio: Duenio,\r\n}\r\n#[derive(Debug, Clone, Serialize, Deserialize)]\r\nstruct Atencion {\r\n    mascota: Mascota,\r\n    diagnostico: String,\r\n    tratamiento: String,\r\n    proxima_visita: Option\u003cFecha\u003e,\r\n}\r\n#[derive(Debug, Clone)]\r\nstruct Veterinaria {\r\n    nombre: String,\r\n    direccion: String,\r\n    id: u32,\r\n    cola_atencion: VecDeque\u003cMascota\u003e,\r\n    atenciones_realizadas: Vec\u003cAtencion\u003e,\r\n    path: String,\r\n}\r\n\r\n/*\r\n    Metodos asociados\r\n*/\r\nimpl Animales {\r\n    pub fn es_igual_a(\u0026self, a: \u0026Animales) -\u003e bool {\r\n        match (self, a) {\r\n            (Animales::Perro, Animales::Perro) =\u003e true,\r\n            (Animales::Gato, Animales::Gato) =\u003e true,\r\n            (Animales::Caballo, Animales::Caballo) =\u003e true,\r\n            (Animales::Otro, Animales::Otro) =\u003e true,\r\n            _ =\u003e false,\r\n        }\r\n    }\r\n}\r\nimpl Duenio {\r\n    //Metodos Secundarios\r\n    pub fn get_nombre(\u0026self) -\u003e \u0026String {\r\n        return \u0026self.nombre;\r\n    }\r\n    pub fn get_direccion(\u0026self) -\u003e \u0026String {\r\n        return \u0026self.direccion;\r\n    }\r\n    pub fn get_num_telefono(\u0026self) -\u003e u32 {\r\n        return self.telefono;\r\n    }\r\n    pub fn es_igual_a(\u0026self, d: \u0026Duenio) -\u003e bool {\r\n        return (\u0026self.nombre == d.get_nombre())\r\n            \u0026\u0026 (\u0026self.direccion == d.get_direccion())\r\n            \u0026\u0026 (self.telefono == d.get_num_telefono());\r\n    }\r\n    pub fn datos_iguales_a(\u0026self, nom: \u0026String, tel: u32) -\u003e bool {\r\n        return (\u0026self.nombre == nom) \u0026\u0026 (self.telefono == tel);\r\n    }\r\n    //Metodos Primarios\r\n    pub fn new(nombre_in: \u0026str, direccion_in: \u0026str, telefono_in: u32) -\u003e Duenio {\r\n        return Duenio {\r\n            nombre: nombre_in.to_string(),\r\n            direccion: direccion_in.to_string(),\r\n            telefono: telefono_in,\r\n        };\r\n    }\r\n}\r\n\r\nimpl Mascota {\r\n    //Metodos secundarios\r\n    pub fn get_nombre(\u0026self) -\u003e \u0026String {\r\n        return \u0026self.nombre;\r\n    }\r\n    pub fn get_edad(\u0026self) -\u003e u32 {\r\n        return self.edad;\r\n    }\r\n    pub fn get_tipo(\u0026self) -\u003e \u0026Animales {\r\n        return \u0026self.tipo;\r\n    }\r\n    pub fn get_duenio(\u0026self) -\u003e \u0026Duenio {\r\n        return \u0026self.duenio;\r\n    }\r\n    pub fn es_igual_a(\u0026self, m: \u0026Mascota) -\u003e bool {\r\n        return (\u0026self.nombre == m.get_nombre())\r\n            \u0026\u0026 (self.edad == m.get_edad())\r\n            \u0026\u0026 (self.tipo.es_igual_a(\u0026m.get_tipo()))\r\n            \u0026\u0026 (self.duenio.es_igual_a(\u0026m.get_duenio()));\r\n    }\r\n    pub fn datos_iguales_a(\u0026self, nom: \u0026String, nom_duenio: \u0026String, tel: u32) -\u003e bool {\r\n        return (\u0026self.nombre == nom) \u0026\u0026 (self.duenio.datos_iguales_a(\u0026nom_duenio, tel));\r\n    }\r\n    //Metodos primarios\r\n    pub fn new(nombre_in: \u0026str, edad_in: u32, tipo_in: Animales, duenio_in: Duenio) -\u003e Mascota {\r\n        return Mascota {\r\n            nombre: nombre_in.to_string(),\r\n            edad: edad_in,\r\n            tipo: tipo_in,\r\n            duenio: duenio_in,\r\n        };\r\n    }\r\n}\r\n\r\nimpl Atencion {\r\n    //Metodos secundarios\r\n    pub fn get_mascota(\u0026self) -\u003e \u0026Mascota {\r\n        return \u0026self.mascota;\r\n    }\r\n    pub fn datos_iguales_a(\u0026self, nom_mascota: \u0026String, nom_duenio: \u0026String, tel: u32) -\u003e bool {\r\n        return self.mascota.datos_iguales_a(\u0026nom_mascota, \u0026nom_duenio, tel);\r\n    }\r\n    pub fn es_igual_a(\u0026self, ate: \u0026Atencion) -\u003e bool {\r\n        let mut tiene_fecha = false;\r\n        if let Some(fecha1) = \u0026self.proxima_visita {\r\n            if let Some(fecha2) = \u0026ate.proxima_visita {\r\n                tiene_fecha = fecha1.es_igual_a(\u0026fecha2);\r\n            }\r\n        } else {\r\n            if ate.proxima_visita.is_none() {\r\n                tiene_fecha = true;\r\n            }\r\n        }\r\n        return self.mascota.es_igual_a(\u0026ate.get_mascota())\r\n            \u0026\u0026 (self.diagnostico == ate.diagnostico)\r\n            \u0026\u0026 (self.tratamiento == ate.tratamiento)\r\n            \u0026\u0026 (tiene_fecha);\r\n    }\r\n    pub fn cambiar_diagnostico(\u0026mut self, diag: \u0026str) {\r\n        self.diagnostico = diag.to_string();\r\n    }\r\n    pub fn cambiar_fecha(\u0026mut self, f: Option\u003cFecha\u003e) {\r\n        self.proxima_visita = f;\r\n    }\r\n    //Metodos primarios\r\n    pub fn new(\r\n        mascota_in: Mascota,\r\n        diagnostico_in: \u0026str,\r\n        tratamiento_in: \u0026str,\r\n        proxima_visita_in: Option\u003cFecha\u003e,\r\n    ) -\u003e Atencion {\r\n        Atencion {\r\n            mascota: mascota_in,\r\n            diagnostico: diagnostico_in.to_string(),\r\n            tratamiento: tratamiento_in.to_string(),\r\n            proxima_visita: proxima_visita_in,\r\n        }\r\n    }\r\n}\r\n\r\nimpl Veterinaria {\r\n    //Metodos secundarios\r\n    pub fn get_nombre(\u0026self) -\u003e \u0026String {\r\n        return \u0026self.nombre;\r\n    }\r\n    pub fn get_direccion(\u0026self) -\u003e \u0026String {\r\n        return \u0026self.direccion;\r\n    }\r\n    pub fn get_id(\u0026self) -\u003e u32 {\r\n        return self.id;\r\n    }\r\n    pub fn es_igual_a(\u0026self, v: \u0026Veterinaria) -\u003e bool {\r\n        return (\u0026self.nombre == v.get_nombre())\r\n            \u0026\u0026 (\u0026self.direccion == v.get_direccion())\r\n            \u0026\u0026 (self.id == v.get_id());\r\n    }\r\n    /*\r\n        Nuevos metodos del tp5\r\n    */\r\n    fn recuperar_informacion(path: \u0026str) -\u003e Result\u003cVec\u003cAtencion\u003e, Errores\u003e {\r\n        let file = File::open(path).map_err(Errores::ErrorIO)?;\r\n        let atenciones: Vec\u003cAtencion\u003e =\r\n            serde_json::from_reader(file).map_err(Errores::ErrorSerde)?;\r\n        Ok(atenciones)\r\n    }\r\n    fn guardar_informacion(\u0026self) -\u003e Result\u003c(), Errores\u003e {\r\n        let mut file = File::create(\u0026self.path)?;\r\n        let serialized = serde_json::to_string(\u0026self.atenciones_realizadas)?;\r\n        file.write_all(serialized.as_bytes())?;\r\n        return Ok(());\r\n    }\r\n    //Metodos primarios\r\n    pub fn new(nom_in: \u0026str, dir_in: \u0026str, id_in: u32, path_in: \u0026str) -\u003e Veterinaria {\r\n        let atenciones: Vec\u003cAtencion\u003e = match Veterinaria::recuperar_informacion(path_in) {\r\n            Ok(dato) =\u003e dato,\r\n            Err(_) =\u003e Vec::new(),\r\n        };\r\n        return Veterinaria {\r\n            nombre: nom_in.to_string(),\r\n            direccion: dir_in.to_string(),\r\n            id: id_in,\r\n            cola_atencion: VecDeque::new(),\r\n            atenciones_realizadas: atenciones,\r\n            path: path_in.to_string(),\r\n        };\r\n    }\r\n    pub fn agregar_mascota(\u0026mut self, m: Mascota) {\r\n        self.cola_atencion.push_back(m);\r\n    }\r\n    pub fn priorizar_mascota(\u0026mut self, m: Mascota) {\r\n        self.cola_atencion.push_front(m);\r\n    }\r\n    pub fn atender_mascota(\u0026mut self) -\u003e Option\u003cMascota\u003e {\r\n        if self.cola_atencion.is_empty() {\r\n            return None;\r\n        } else {\r\n            return self.cola_atencion.pop_front();\r\n        }\r\n    }\r\n    pub fn eliminar_mascota(\u0026mut self, m: \u0026Mascota) {\r\n        if !self.cola_atencion.is_empty() {\r\n            for i in 0..self.cola_atencion.len() {\r\n                if self.cola_atencion[i].es_igual_a(\u0026m) {\r\n                    self.cola_atencion.remove(i);\r\n                    break;\r\n                }\r\n            }\r\n        }\r\n    }\r\n    pub fn registrar_atencion(\u0026mut self, a: Atencion) -\u003e Result\u003c(), Errores\u003e {\r\n        self.atenciones_realizadas.push(a);\r\n        self.guardar_informacion()?;\r\n        return Ok(());\r\n    }\r\n    pub fn buscar_atencion(\r\n        \u0026self,\r\n        nom_mascota: \u0026String,\r\n        nom_duenio: \u0026String,\r\n        tel: u32,\r\n    ) -\u003e Option\u003c\u0026Atencion\u003e {\r\n        let mut res: Option\u003c\u0026Atencion\u003e = None;\r\n        if !self.atenciones_realizadas.is_empty() {\r\n            for i in (0..self.atenciones_realizadas.len()).rev() {\r\n                if self.atenciones_realizadas[i].datos_iguales_a(\u0026nom_mascota, \u0026nom_duenio, tel) {\r\n                    res = Some(\u0026self.atenciones_realizadas[i]);\r\n                    break;\r\n                }\r\n            }\r\n        }\r\n        return res;\r\n    }\r\n    pub fn modificar_diagnostico(\u0026mut self, ate: \u0026Atencion, diag: \u0026String) -\u003e Result\u003c(), Errores\u003e {\r\n        if !self.atenciones_realizadas.is_empty() {\r\n            for i in 0..self.atenciones_realizadas.len() {\r\n                if self.atenciones_realizadas[i].es_igual_a(\u0026ate) {\r\n                    self.atenciones_realizadas[i].cambiar_diagnostico(\u0026diag.clone());\r\n                    self.guardar_informacion()?;\r\n                    return Ok(());\r\n                }\r\n            }\r\n            return Err(Errores::ErrorOperatoria(ErroresOperatoria::Inexistente(\r\n                self.get_nombre().clone(),\r\n            )));\r\n        }\r\n        return Err(Errores::ErrorOperatoria(\r\n            ErroresOperatoria::EstructuraVacia(self.get_nombre().clone()),\r\n        ));\r\n    }\r\n    pub fn modificar_fecha(\u0026mut self, ate: \u0026Atencion, fecha: Option\u003cFecha\u003e) -\u003e Result\u003c(), Errores\u003e {\r\n        if !self.atenciones_realizadas.is_empty() {\r\n            for i in 0..self.atenciones_realizadas.len() {\r\n                if self.atenciones_realizadas[i].es_igual_a(\u0026ate) {\r\n                    self.atenciones_realizadas[i].cambiar_fecha(fecha);\r\n                    self.guardar_informacion()?;\r\n                    return Ok(());\r\n                }\r\n            }\r\n            return Err(Errores::ErrorOperatoria(ErroresOperatoria::Inexistente(\r\n                self.get_nombre().clone(),\r\n            )));\r\n        }\r\n        return Err(Errores::ErrorOperatoria(\r\n            ErroresOperatoria::EstructuraVacia(self.get_nombre().clone()),\r\n        ));\r\n    }\r\n    pub fn eliminar_atencion(\u0026mut self, ate: \u0026Atencion) -\u003e Result\u003c(), Errores\u003e {\r\n        if !self.atenciones_realizadas.is_empty() {\r\n            for i in 0..self.atenciones_realizadas.len() {\r\n                if self.atenciones_realizadas[i].es_igual_a(\u0026ate) {\r\n                    self.atenciones_realizadas.remove(i);\r\n                    self.guardar_informacion()?;\r\n                    return Ok(());\r\n                }\r\n            }\r\n            return Err(Errores::ErrorOperatoria(ErroresOperatoria::Inexistente(\r\n                self.get_nombre().clone(),\r\n            )));\r\n        }\r\n        return Err(Errores::ErrorOperatoria(\r\n            ErroresOperatoria::EstructuraVacia(self.get_nombre().clone()),\r\n        ));\r\n    }\r\n}\r\n#[cfg(test)]\r\nmod testing_ejercicio9 {\r\n    use super::*;\r\n\r\n    #[test]\r\n    fn creacion_veterinaria() {\r\n        let v = Veterinaria::new(\u0026\"mordidas\", \u0026\"av1\", 1, \"./lista_atenciones.json\");\r\n        let v2 = Veterinaria::new(\u0026\"mordidas\", \u0026\"av1\", 1, \"./lista_atenciones.json\");\r\n        assert_eq!(v.es_igual_a(\u0026v2), true);\r\n    }\r\n\r\n    #[test]\r\n    fn operatoria_mascotas() {\r\n        let mut v = Veterinaria::new(\u0026\"mordidas\", \u0026\"av1\", 1, \"./lista_atenciones\");\r\n        let d1 = Duenio::new(\u0026\"Marcos\", \u0026\"av2\", 1234);\r\n        let animal1 = Mascota::new(\u0026\"Luchito\", 2, Animales::Perro, d1.clone());\r\n        v.agregar_mascota(animal1);\r\n\r\n        let animal2 = Mascota::new(\u0026\"Piecitos\", 1, Animales::Gato, d1.clone());\r\n        v.priorizar_mascota(animal2);\r\n\r\n        //Atendiende un gato\r\n        assert!(\r\n            v.atender_mascota().is_some_and(|ani| {\r\n                ani.es_igual_a(\u0026Mascota::new(\u0026\"Piecitos\", 1, Animales::Gato, d1.clone()))\r\n            }),\r\n            \"No se encontro al animal\"\r\n        );\r\n\r\n        //Atendiende un perro\r\n        assert!(\r\n            v.atender_mascota().is_some_and(|ani| {\r\n                ani.es_igual_a(\u0026Mascota::new(\u0026\"Luchito\", 2, Animales::Perro, d1.clone()))\r\n            }),\r\n            \"No se encontro al animal\"\r\n        );\r\n\r\n        //Borra una mascota\r\n        let animal3 = Mascota::new(\u0026\"Luchis\", 2, Animales::Perro, d1);\r\n        v.agregar_mascota(animal3.clone());\r\n        v.eliminar_mascota(\u0026animal3);\r\n        assert_eq!(v.atender_mascota().is_none(), true);\r\n    }\r\n\r\n    #[test]\r\n    fn operar_atenciones() {\r\n        let mut v = Veterinaria::new(\u0026\"mordidas\", \u0026\"av1\", 1, \"./lista_atenciones.json\");\r\n        let d1 = Duenio::new(\u0026\"Marcos\", \u0026\"av2\", 1234);\r\n        let animal1 = Mascota::new(\u0026\"Luchito\", 2, Animales::Perro, d1.clone());\r\n        let animal2 = Mascota::new(\u0026\"Luchon\", 2, Animales::Perro, d1.clone());\r\n        v.agregar_mascota(animal1.clone());\r\n        v.agregar_mascota(animal2);\r\n\r\n        //Verificacion de estructura vacia en atenciones\r\n        let ate_aux = Atencion::new(animal1, \u0026\"Pulgas\", \u0026\"Pipeta\", None);\r\n        assert!(\r\n            v.modificar_diagnostico(\u0026ate_aux, \u0026\"algo\".to_string())\r\n                .is_err_and(|e| {\r\n                    assert!(!e.to_string().is_empty());\r\n                    matches!(\r\n                        e,\r\n                        Errores::ErrorOperatoria(ErroresOperatoria::EstructuraVacia(_))\r\n                    )\r\n                })\r\n        );\r\n        assert!(v.modificar_fecha(\u0026ate_aux, None).is_err_and(|e| {\r\n            assert!(!e.to_string().is_empty());\r\n            matches!(\r\n                e,\r\n                Errores::ErrorOperatoria(ErroresOperatoria::EstructuraVacia(_))\r\n            )\r\n        }));\r\n        assert!(v.eliminar_atencion(\u0026ate_aux).is_err_and(|e| {\r\n            assert!(!e.to_string().is_empty());\r\n            matches!(\r\n                e,\r\n                Errores::ErrorOperatoria(ErroresOperatoria::EstructuraVacia(_))\r\n            )\r\n        }));\r\n\r\n        //Primera recepcion\r\n        assert!(\r\n            v.atender_mascota().is_some_and(|ani| {\r\n                let ate1 = Atencion::new(ani, \u0026\"Pulgas\", \u0026\"Pipeta\", None);\r\n                v.registrar_atencion(ate1).is_ok()\r\n            }),\r\n            \"No se atendio ningun animal\"\r\n        );\r\n\r\n        //Segunda recepcion\r\n        assert!(\r\n            v.atender_mascota().is_some_and(|ani| {\r\n                let ate2 = Atencion::new(ani, \u0026\"Garrapatas\", \u0026\"Pipeta\", None);\r\n                v.registrar_atencion(ate2).is_ok()\r\n            }),\r\n            \"No se atendio ningun animal\"\r\n        );\r\n\r\n        //Búsqueda y eliminación de la última atención\r\n        let atencion = v\r\n            .buscar_atencion(\u0026\"Luchon\".to_string(), \u0026\"Marcos\".to_string(), 1234)\r\n            .cloned();\r\n        assert!(\r\n            atencion.is_some_and(|a| {\r\n                assert!(a.mascota.nombre == \"Luchon\");\r\n                assert!(v.eliminar_atencion(\u0026a).is_ok());\r\n\r\n                assert!(\r\n                    v.modificar_diagnostico(\u0026a, \u0026\"algo\".to_string())\r\n                        .is_err_and(|e| {\r\n                            assert!(!e.to_string().is_empty());\r\n                            matches!(\r\n                                e,\r\n                                Errores::ErrorOperatoria(ErroresOperatoria::Inexistente(_))\r\n                            )\r\n                        })\r\n                );\r\n                assert!(v.modificar_fecha(\u0026a, None).is_err_and(|e| {\r\n                    assert!(!e.to_string().is_empty());\r\n                    matches!(\r\n                        e,\r\n                        Errores::ErrorOperatoria(ErroresOperatoria::Inexistente(_))\r\n                    )\r\n                }));\r\n                assert!(v.eliminar_atencion(\u0026a).is_err_and(|e| {\r\n                    assert!(!e.to_string().is_empty());\r\n                    matches!(\r\n                        e,\r\n                        Errores::ErrorOperatoria(ErroresOperatoria::Inexistente(_))\r\n                    )\r\n                }));\r\n\r\n                true\r\n            }),\r\n            \"No se encontro tal recepcion\"\r\n        );\r\n\r\n        //Búsqueda de la primer atención y modificación de diagnóstico\r\n        let atencion = v\r\n            .buscar_atencion(\u0026\"Luchito\".to_string(), \u0026\"Marcos\".to_string(), 1234)\r\n            .cloned();\r\n        assert!(\r\n            atencion.is_some_and(|a| {\r\n                assert!(a.mascota.get_nombre() == \"Luchito\");\r\n                v.modificar_diagnostico(\u0026a, \u0026\"Vomitos\".to_string()).is_ok()\r\n            }),\r\n            \"No se encontro tal recepcion\"\r\n        );\r\n\r\n        //Búsqueda de atención y modificación de fecha\r\n        let atencion = v\r\n            .buscar_atencion(\u0026\"Luchito\".to_string(), \u0026\"Marcos\".to_string(), 1234)\r\n            .cloned();\r\n        assert!(\r\n            atencion.is_some_and(|a| {\r\n                assert!(a.mascota.get_nombre() == \"Luchito\");\r\n                v.modificar_fecha(\u0026a, Some(Fecha::new(5, 5, 2025))).is_ok()\r\n            }),\r\n            \"No se encontro tal recepcion\"\r\n        );\r\n\r\n        //Busqueda de atencion modificada\r\n        assert!(\r\n            v.buscar_atencion(\u0026\"Luchito\".to_string(), \u0026\"Marcos\".to_string(), 1234)\r\n                .is_some_and(|a| {\r\n                    let m = Mascota::new(\u0026\"Luchito\", 2, Animales::Perro, d1.clone());\r\n                    let ate1 =\r\n                        Atencion::new(m, \u0026\"Vomitos\", \u0026\"Pipeta\", Some(Fecha::new(5, 5, 2025)));\r\n                    a.es_igual_a(\u0026ate1)\r\n                }),\r\n            \"No se encontro tal recepcion\"\r\n        );\r\n\r\n        //Búsqueda y eliminación de la última atención modificada\r\n        let atencion = v\r\n            .buscar_atencion(\u0026\"Luchito\".to_string(), \u0026\"Marcos\".to_string(), 1234)\r\n            .cloned();\r\n        assert!(\r\n            atencion.is_some_and(|a| {\r\n                assert!(a.mascota.nombre == \"Luchito\");\r\n                v.eliminar_atencion(\u0026a).is_ok()\r\n            }),\r\n            \"No se encontro tal recepcion\"\r\n        );\r\n    }\r\n\r\n    /*\r\n        Casos especiales para la cobertura de coverage\r\n    */\r\n    #[test]\r\n    fn caso_especial_error_io() {\r\n        // Se buscara forzar un ErrorIO usando una ruta cuyo directorio base NO EXISTE\r\n        let path_err = \"./carpeta_inexistente_123/x.json\";\r\n\r\n        let mut v = Veterinaria::new(\u0026\"mordiscos\", \u0026\"av1\", 1, path_err);\r\n        let d1 = Duenio::new(\u0026\"Marcos\", \u0026\"av2\", 1234);\r\n        let animal1 = Mascota::new(\u0026\"Luchito\", 2, Animales::Perro, d1);\r\n        v.agregar_mascota(animal1);\r\n\r\n        // Al intentar registrar la atencion, llamará internamente a File::create() en la ruta rota, provocando un ErrorIO\r\n        assert!(\r\n            v.atender_mascota().is_some_and(|ani| {\r\n                let ate1 = Atencion::new(ani, \u0026\"Pulgas\", \u0026\"Pipeta\", None);\r\n                v.registrar_atencion(ate1).is_err_and(|e| {\r\n                    assert!(!e.to_string().is_empty());\r\n                    matches!(e, Errores::ErrorIO(_))\r\n                })\r\n            }),\r\n            \"Ocurrio un error imprevisto\"\r\n        );\r\n    }\r\n\r\n    #[test]\r\n    fn caso_especial_error_serde() {\r\n        let path_err = \"./corrupto.json\";\r\n\r\n        // Se fuerza la escritura en el contenido temporal que NO cumple con el formato estructurado de un .JSON válido\r\n        assert!(\r\n            std::fs::write(path_err, \"{ \u0026\u00265435#$#$\u002642365_XXXX1234 : [::: \").is_ok(),\r\n            \"No debio fallar aqui\"\r\n        );\r\n\r\n        // Se invoca directamente el método para leer el archivo del path que buscara\r\n\r\n        assert!(\r\n            Veterinaria::recuperar_informacion(path_err).is_err_and(|e| {\r\n                assert!(!e.to_string().is_empty());\r\n                matches!(e, Errores::ErrorSerde(_))\r\n            }),
