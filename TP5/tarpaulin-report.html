":{"Line":1}},{"line":510,"address":[3480258],"length":1,"stats":{"Line":1}},{"line":512,"address":[3479956],"length":1,"stats":{"Line":1}},{"line":514,"address":[3477040],"length":1,"stats":{"Line":1}},{"line":515,"address":[3477119],"length":1,"stats":{"Line":1}},{"line":516,"address":[3477137,3477382],"length":1,"stats":{"Line":2}},{"line":517,"address":[3477436],"length":1,"stats":{"Line":1}},{"line":518,"address":[3477700],"length":1,"stats":{"Line":1}},{"line":519,"address":[3477776],"length":1,"stats":{"Line":1}},{"line":520,"address":[3477913],"length":1,"stats":{"Line":1}},{"line":523,"address":[3477480],"length":1,"stats":{"Line":1}},{"line":525,"address":[3477179],"length":1,"stats":{"Line":1}},{"line":527,"address":[3478160],"length":1,"stats":{"Line":1}},{"line":528,"address":[3478203],"length":1,"stats":{"Line":1}},{"line":529,"address":[3478221,3478466],"length":1,"stats":{"Line":2}},{"line":530,"address":[3478521],"length":1,"stats":{"Line":1}},{"line":531,"address":[3478786],"length":1,"stats":{"Line":1}},{"line":532,"address":[3478822],"length":1,"stats":{"Line":1}},{"line":533,"address":[3478983],"length":1,"stats":{"Line":1}},{"line":536,"address":[3478565],"length":1,"stats":{"Line":1}},{"line":538,"address":[3478263],"length":1,"stats":{"Line":1}}],"covered":186,"coverable":195},{"path":["/","home","e_248m","Documents","Programas","Programas Rust","Practicas---Seminario-Rust-Recursada","TP5","src","tp5","ej4.rs"],"content":"\n/*\n    Implementacion EJ4-TP5\n*/\nuse std::fmt::Display;\nuse serde::{Serialize, Deserialize};\nuse serde_json;\nuse std::{fs::File, io::{Error, Read, Write}};\nuse std::io;\n\n/*\n    Tipos de errores\n*/\n#[derive(Debug)]\nenum error_operatoria{\n    Inexistente(String),\n    EstructuraVacia(String),\n    PrestamoActivo,\n    LimitePrestamos,\n    SinStock(String)\n}\n\nimpl Display for error_operatoria{\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        match self{\n            error_operatoria::Inexistente(val) =\u003e write!(f, \"No se encontro el elemento en la estructura {} \",val),\n            error_operatoria::EstructuraVacia(val) =\u003e write!(f, \"La estrucutra {} no dispone de elementos \",val),\n            error_operatoria::PrestamoActivo =\u003e write!(f,\"El usuario tiene un prestamo activo para el libro\"),\n            error_operatoria::LimitePrestamos =\u003e write!(f,\"El usuario excedio el limite de prestamos que puede solicitar\"),\n            error_operatoria::SinStock(val) =\u003e write!(f,\"No hay mas copias disponibles para el libro {}\",val)\n        }\n    }\n}\n\n#[derive(Debug)]\nenum Errores{\n    ErrorOperatoria(error_operatoria),\n    ErrorIO(io::Error),\n    ErrorSerde(serde_json::Error)\n}\n\n\nimpl Display for Errores{\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        match self {\n            Errores::ErrorOperatoria(err) =\u003e write!(f,\"{}\",err),\n            Errores::ErrorIO(err) =\u003e write!(f, \"Error de E/S al guardar: {}\", err),\n            Errores::ErrorSerde(err) =\u003e write!(f, \"Error de serialización: {}\", err)\n        }\n    }\n}\n\n//Implementacion para el uso del operador (?)\nimpl std::error::Error for Errores {}\n\n//Implementacion automatica errores subyacentes\nimpl From\u003cio::Error\u003e for Errores {\n    fn from(err: io::Error) -\u003e Self {\n        Errores::ErrorIO(err)\n    }\n}\n\nimpl From\u003cserde_json::Error\u003e for Errores {\n    fn from(err: serde_json::Error) -\u003e Self {\n        Errores::ErrorSerde(err)\n    }\n}\n\n/***\n *      \n *      EXTRACCION DE LA ESTRUCTURA FECHA DEL ejercicio 3 - TP3\n * \n***/\n//Atributos\n#[derive(Debug,Clone,Serialize, Deserialize)]\nstruct Fecha{\n    pub dia : u8,\n    pub mes : u8,\n    pub anio : u16\n}\n\n/*\n    Metodos\n*/\n\nimpl Fecha{\n\n    //Metodos Secundarios\n    pub fn get_dia(\u0026self)-\u003eu8{\n        return self.dia;\n    }\n    pub fn get_mes(\u0026self)-\u003eu8{\n        return self.mes;\n    }\n    pub fn get_anio(\u0026self)-\u003eu16{\n        return self.anio;\n    }\n    pub fn es_igual_a(\u0026self,f:\u0026Fecha)-\u003ebool{\n        return if(self.get_dia() == f.get_dia())\u0026\u0026(self.get_mes() == f.get_mes())\u0026\u0026(self.get_anio() == f.get_anio()){true}else{false}\n    }\n    /*\n        Metodos Primarios    \n     */\n    pub fn new(d:u8,m:u8,a:u16)-\u003eFecha{\n        return Fecha { dia: d , mes: m , anio: a }\n    }\n    pub fn es_fecha_valida(\u0026self)-\u003ebool{\n        \n        if (self.mes \u003e 0) \u0026\u0026 (self.mes \u003c= 12) \u0026\u0026 (self.anio \u003e 0) \u0026\u0026 (self.dia \u003e 0) {\n        \n            match self.mes{\n                2 =\u003e if self.es_bisiesto() { return self.dia \u003c= 29 }else{ return self.dia \u003c= 28},\n                9|4|6|11 =\u003e return self.dia \u003c= 30,\n                _ =\u003e return self.dia \u003c= 31\n            }\n            \n        }\n\n        return false;\n    }\n\n    pub fn es_bisiesto(\u0026self)-\u003ebool{\n        return (self.anio % 4)==0;\n    }\n\n    //Auxiliar para determinar el ultimo dia de un mes\n    fn ultimo_dia(\u0026self)-\u003eu8{\n        match self.mes{\n            2 =\u003e if self.es_bisiesto() {29}else{28},\n            9|4|6|11 =\u003e 30,\n            _ =\u003e 31\n        }\n    \n    }\n\n    //Auxiliar para avanzar de mes y anio\n    fn avanzar_mes(\u0026mut self) {\n        if self.mes == 12 {\n            self.mes = 1;\n            self.anio += 1;\n        } else {\n            self.mes += 1;\n        }\n        self.dia = 1;\n    }\n\n    //Se considera que la fecha es valida\n    pub fn sumar_dias(\u0026mut self,mut dias_sumar:u32){\n        //Bucle principal para el calculo\n        while dias_sumar \u003e 0 {\n            //Obtiene el ultimo dia del mes (Cantidad total de dias que le corresponde)\n            let dias_mes = self.ultimo_dia();\n            //Calcula el resto de dias que debera actualizar en \"dias_sumar\" para avanzar en mes y anio hasta llegar al mes con la cantidad minima a sumar de dias correspondiente\n            let dias_restantes = dias_mes - self.dia + 1;\n            \n            //Avanza en los meses y anios(si fuera necesario) hasta llegar al mes y sumar la cantidad minima de dias\n            if dias_sumar \u003e= dias_restantes as u32 {\n                dias_sumar -= dias_restantes as u32;\n                self.avanzar_mes();\n            } else {\n                //Suma la cantidad correspondiente al mes\n                self.dia += dias_sumar as u8;\n                //Fin de ejecucion\n                dias_sumar = 0;\n            }\n        }\n\n    }\n\n    //Auxiliar para retroceder de mes y anio\n    fn retroceder_mes(\u0026mut self){\n        if self.mes == 1{\n            self.mes = 12;\n            self.anio -= 1;\n        } else {\n            self.mes -= 1;\n        }\n        self.dia = self.ultimo_dia();\n    }\n\n    //Se considera que la fecha es valida\n    //Y que no se llegara a una fecha negativa(anio negativo)\n    pub fn restar_dias(\u0026mut self, mut dias_restar:u32){\n        //Bucle principal para el calculo\n        while dias_restar \u003e 0 {\n            \n            //Retrocede en los meses y anios(si fuera necesario) hasta llegar al mes y restar la cantidad minima de dias\n            if dias_restar \u003e= self.dia as u32 {\n                dias_restar -= self.dia as u32;\n                self.retroceder_mes();\n            } else {\n                //Resta la cantidad correspondiente al mes\n                self.dia -= dias_restar as u8;\n                //Fin de ejecucion\n                dias_restar = 0;\n            }\n        }\n    }\n\n    pub fn es_mayor(\u0026self , f:\u0026Fecha)-\u003ebool{\n        return if self.anio \u003e f.anio {true}else \n        if (self.anio == f.anio) \u0026\u0026 (self.mes \u003e f.mes) {true}else \n        if (self.mes == f.mes) \u0026\u0026 (self.dia \u003e f.dia) {true}else{false};\n    }\n\n}\n\n#[cfg(test)]\nmod testing_ejercicio10_fecha{\n    use super::Fecha;\n\n    #[test]\n    fn creacion_fecha(){\n        let f = Fecha::new(1, 1, 2025);\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(1, 1, 2025)),true);\n    }\n\n    #[test]\n    fn validacion_de_fecha(){\n        //Si las fechas tienen aproximadamente un formato correcto (Respeta el sistema gregoriano)\n        let mut f = Fecha::new(1, 1, 2025);\n        assert_eq!(f.es_fecha_valida(),true);\n        f = Fecha::new(31, 2, 2004);\n        assert_eq!(f.es_fecha_valida(),false);\n        //Si determina cual es la ultima fecha(dia) en el que acaba el mes\n        let mut f = Fecha::new(1, 9, 2025);\n        assert_eq!(f.ultimo_dia(),30);\n        assert!(f.es_fecha_valida());\n\n        let mut f = Fecha::new(1, 4, 2025);\n        assert_eq!(f.ultimo_dia(),30);\n        assert!(f.es_fecha_valida());\n\n        let mut f = Fecha::new(1, 6, 2025);\n        assert_eq!(f.ultimo_dia(),30);\n        assert!(f.es_fecha_valida());\n\n        let mut f = Fecha::new(1, 11, 2025);\n        assert_eq!(f.ultimo_dia(),30);\n        assert!(f.es_fecha_valida());\n    }\n\n    #[test]\n    fn validar_bisiesto(){\n        let mut f = Fecha::new(1, 1, 2028);\n        assert_eq!(f.es_bisiesto(),true);\n        f = Fecha::new(1, 1, 2025);\n        assert_eq!(f.es_bisiesto(),false);\n    }\n\n    #[test]\n    fn adicion_fecha(){\n        //Prueba con una fecha 1°\n        let mut f = Fecha::new(1, 1, 2028);\n        f.sumar_dias(30);\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(31, 1, 2028)),true);\n        f.sumar_dias(1);\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(1, 2, 2028)),true);\n        f.sumar_dias(29);\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(1,3,2028)),true);\n        //Prueba con una fecha 2°\n        let mut f = Fecha::new(31, 12, 2024);\n        f.sumar_dias(1);\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(1, 1, 2025)),true);\n    }\n\n    #[test]\n    fn sustraccion_fecha(){\n        //Prueba con una fecha 1°\n        let mut f = Fecha::new(10, 4, 2028);\n        f.restar_dias(9);\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(1, 4, 2028)),true);\n        f.restar_dias(31);\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(1,3,2028)),true);\n        f.restar_dias(1);\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(29, 2, 2028)),true);\n\n        //Prueba con una fecha 2°\n        let mut f = Fecha::new(1, 1, 2025);\n        f.restar_dias(1);\n        assert_eq!(f.es_igual_a(\u0026Fecha::new(31, 12, 2024)),true);\n    }\n\n    #[test]\n    fn comparacion_fechas(){\n        let f1 = Fecha::new(25, 5, 2000);\n        let f2 = Fecha::new(25, 2, 2004);\n        assert_eq!(f1.es_mayor(\u0026f2),false);\n        assert_eq!(f2.es_mayor(\u0026f1),true);\n    }\n\n}\n\n/***\n *      Extraccion del ejercicio 10 - TP3\n * \n***/\n\n\n#[derive(Debug, Clone,Serialize, Deserialize)]\nenum Genero {\n    Novela,\n    Infantil,\n    Tecnico,\n    Otro,\n}\n\n#[derive(Debug, Clone,Serialize, Deserialize)]\nenum Estado {\n    EnPrestamo,\n    Devuelto\n}\n\n#[derive(Debug, Clone,Serialize, Deserialize)]\nstruct Libro { \n    isbn : u32,\n    titulo: String,\n    autor: String,\n    paginas: u32,\n    genero: Genero\n}\n\n#[derive(Debug, Clone,Serialize, Deserialize)]\nstruct LibrosDispone(Libro,u32);\n#[derive(Debug, Clone,Serialize, Deserialize)]\nstruct Cliente { \n    nombre: String,\n    telefono: u32,\n    correo: String\n}\n#[derive(Debug, Clone,Serialize, Deserialize)]\nstruct Prestamo {\n    libro: Libro,\n    cliente: Cliente,\n    vencimiento: Fecha,\n    estado: Estado,\n    devolucion: Option\u003cFecha\u003e,\n}\n\n#[derive(Debug)]\nstruct Biblioteca {\n    nombre: String,\n    direccion: String,\n    disponibles: Vec\u003cLibrosDispone\u003e,\n    prestamos: Vec\u003cPrestamo\u003e,\n    path_prestamos: String,\n    path_libros: String\n}\nimpl Estado{\n    pub fn es_igual_a(\u0026self,e:\u0026Estado)-\u003ebool{\n        match (self, e) {\n            (Estado::EnPrestamo, Estado::EnPrestamo) =\u003e true,\n            (Estado::Devuelto, Estado::Devuelto) =\u003e true,\n            _ =\u003e false\n        }\n    }\n}\n\nimpl Genero{\n    pub fn es_igual_a(\u0026self,gen_in:\u0026Genero)-\u003ebool{\n        match (self, gen_in) {\n            (Genero::Novela, Genero::Novela) =\u003e true,\n            (Genero::Infantil, Genero::Infantil) =\u003e true,\n            (Genero::Tecnico, Genero::Tecnico) =\u003e true,\n            (Genero::Otro, Genero::Otro) =\u003e true,\n            _ =\u003e false\n        }\n    }\n}\n\nimpl Libro {\n    pub fn get_titulo(\u0026self)-\u003eString{\n        return self.titulo.clone();\n    }\n    pub fn get_autor(\u0026self)-\u003eString{\n        return self.autor.clone();\n    }\n    pub fn es_igual_a(\u0026self,l:\u0026Libro)-\u003ebool{\n        return (self.isbn == l.isbn)\u0026\u0026(self.titulo == l.get_titulo())\u0026\u0026(self.autor == l.get_autor())\u0026\u0026(self.paginas == l.paginas)\u0026\u0026(self.genero.es_igual_a(\u0026l.genero));\n    }\n    pub fn new(num : u32 ,ti: String,au: String,pag: u32,gen_in: Genero) -\u003e Libro {\n        return Libro{\n            isbn : num,\n            titulo : ti,\n            autor : au,\n            paginas : pag,\n            genero : gen_in\n        }\n    }\n}\n\nimpl Cliente {\n    pub fn get_nombre(\u0026self)-\u003eString{\n        return self.nombre.clone();\n    }\n    pub fn get_correo(\u0026self)-\u003eString{\n        return self.correo.clone();\n    }\n    pub fn es_igual_a(\u0026self,c:\u0026Cliente)-\u003ebool{\n        return (self.nombre == c.get_nombre())\u0026\u0026(self.telefono == c.telefono)\u0026\u0026(self.correo == c.get_correo());\n    }\n    pub fn new(nom: String,tel: u32,cor: String) -\u003e Cliente {\n        return Cliente{\n            nombre : nom,\n            telefono : tel,\n            correo : cor,\n        }\n    }\n}\n\nimpl Prestamo {\n    pub fn new(libro: \u0026Libro,cliente: \u0026Cliente,vencimiento: \u0026Fecha) -\u003e Prestamo {\n        return Prestamo{\n            libro: libro.clone(),\n            cliente: cliente.clone(),\n            vencimiento: vencimiento.clone(),\n            estado:Estado::EnPrestamo,\n            devolucion:None\n        }\n    }\n    pub fn es_igual(\u0026self,lib:\u0026Libro,c:\u0026Cliente)-\u003ebool{\n        return self.libro.es_igual_a(\u0026lib)\u0026\u0026self.cliente.es_igual_a(\u0026c);\n    }\n}\n\nimpl Biblioteca {\n    pub fn get_direccion(\u0026self)-\u003eString{\n        return self.direccion.clone();\n    }\n    pub fn get_nombre(\u0026self)-\u003eString{\n        return self.nombre.clone();\n    }\n    pub fn es_igual_a(\u0026self,b:\u0026Biblioteca)-\u003ebool{\n        return (self.nombre == b.get_nombre())\u0026\u0026(self.direccion == b.get_direccion());\n    }\n    pub fn new(nombre: String,direccion: String,ruta_l:\u0026str,ruta_p:\u0026str) -\u003e Biblioteca {\n        let libros : Vec\u003cLibrosDispone\u003e = match Biblioteca::recuperar_info_libros(ruta_l){\n            Ok(dato) =\u003e dato,\n            Err(_) =\u003e Vec::new()\n        };\n        let prestamos_lista : Vec\u003cPrestamo\u003e =  match Biblioteca::recuperar_info_prestamos(ruta_p){\n            Ok(dato) =\u003e dato,\n            Err(_) =\u003e Vec::new()\n        };\n        return Biblioteca{\n            nombre,\n            direccion,\n            disponibles: libros,\n            prestamos : prestamos_lista,\n            path_libros: ruta_l.to_string(),\n            path_prestamos: ruta_p.to_string()\n        }\n    }\n    /*\n\t\tNuevos metodos del tp5\n\t*/\n\tfn recuperar_info_prestamos(path:\u0026str)-\u003e Result\u003cVec\u003cPrestamo\u003e,Errores\u003e{\n\t\tlet file = File::open(path).map_err(Errores::ErrorIO)?;\n\t\tlet prestamos: Vec\u003cPrestamo\u003e = serde_json::from_reader(file).map_err(Errores::ErrorSerde)?;\n\t\tOk(prestamos)\n\t}\n\tfn guardar_info_prestamos(\u0026self) -\u003e Result\u003c(), Errores\u003e {\n\t    let mut file = File::create(\u0026self.path_prestamos)?;\n\t    let serialized = serde_json::to_string(\u0026self.prestamos)?;\n        file.write_all(serialized.as_bytes())?;\n        return Ok(())\n    }\n    fn recuperar_info_libros(path:\u0026str)-\u003e Result\u003cVec\u003cLibrosDispone\u003e,Errores\u003e{\n\t\tlet file = File::open(path).map_err(Errores::ErrorIO)?;\n\t\tlet libros: Vec\u003cLibrosDispone\u003e = serde_json::from_reader(file).map_err(Errores::ErrorSerde)?;\n\t\tOk(libros)\n\t}\n\tfn guardar_info_libros(\u0026self) -\u003e Result\u003c(), Errores\u003e {\n\t    let mut file = File::create(\u0026self.path_libros)?;\n\t    let serialized = serde_json::to_string(\u0026self.disponibles)?;\n        file.write_all(serialized.as_bytes())?;\n        return Ok(())\n    }\n\n    /*\n        Metodos primarios\n    */\n    //Agregar libros en biblioteca\n    pub fn agregar_libro(\u0026mut self,libro:Libro,cantidad:u32) -\u003e Result\u003c(),Errores\u003e{\n        let mut registrado = false;\n\n        for libro_disponible in \u0026mut self.disponibles {\n            if libro_disponible.0.es_igual_a(\u0026libro) {\n                libro_disponible.1 += cantidad;\n                registrado = true;\n                break; \n            }\n        }\n        // Sea si el Vec esta vacío o el libro no se encuentra en el catálogo , se lo agrega como nuevo\n        if !registrado {\n            self.disponibles.push(LibrosDispone(libro, cantidad));\n        }\n\n        self.guardar_info_libros()?;\n        return Ok(())\n    }\n\n    pub fn copias(\u0026self,libro:\u0026Libro) -\u003e u32 {\n        let mut copias = 0;\n        for libro_biblo in \u0026self.disponibles {\n            if libro_biblo.0.es_igual_a(\u0026libro) {\n                copias = libro_biblo.1;\n                break;\n            }\n        }\n        return copias\n    }\n\n    pub fn decrementar(\u0026mut self,libro:\u0026Libro) -\u003e Result\u003c(),Errores\u003e{\n        if !self.disponibles.is_empty(){\n            for libros in \u0026mut self.disponibles{\n                if libros.0.es_igual_a(\u0026libro) \u0026\u0026 (libros.1 \u003e 0){\n                    libros.1 -= 1;\n                    self.guardar_info_libros()?;\n                    return Ok(())\n                }\n            }\n            return Err(Errores::ErrorOperatoria(error_operatoria::Inexistente(self.get_nombre())))\n        }\n        return Err(Errores::ErrorOperatoria(error_operatoria::EstructuraVacia(self.get_nombre())))\n    }\n    pub fn incrementar(\u0026mut self,libro:\u0026Libro) -\u003eResult\u003c(),Errores\u003e{\n        if !self.disponibles.is_empty(){\n            for libros in \u0026mut self.disponibles{\n                if libros.0.es_igual_a(\u0026libro){\n                    libros.1 += 1;\n                    self.guardar_info_libros()?;\n                    return Ok(())\n                }\n            }\n            return Err(Errores::ErrorOperatoria(error_operatoria::Inexistente(self.get_nombre())))\n        }\n        return Err(Errores::ErrorOperatoria(error_operatoria::EstructuraVacia(self.get_nombre())))\n    }\n    pub fn prestamos(\u0026self,cliente:\u0026Cliente) -\u003e u32 {\n        let mut cantidad = 0;\n        for prestamo in \u0026self.prestamos {\n            if (prestamo.cliente.es_igual_a(\u0026cliente)) \u0026\u0026 (prestamo.estado.es_igual_a(\u0026Estado::EnPrestamo)) {\n                cantidad = cantidad + 1;\n            }\n        }\n        return cantidad;\n    }\n    \n    //Auxiliar de existencia de prestamo del mismo libro solicitado , para un cliente \n    fn tiene_prestamo_del_libro(\u0026self,cliente:\u0026Cliente,libro:\u0026Libro)-\u003ebool{\n        let mut existe = false;\n        for prestamo in \u0026self.prestamos{\n            if (prestamo.cliente.es_igual_a(\u0026cliente)) \u0026\u0026 (prestamo.estado.es_igual_a(\u0026Estado::EnPrestamo)) \u0026\u0026 (prestamo.libro.es_igual_a(\u0026libro)){\n                existe = true;\n                break;\n            }\n        }\n        \n        return existe\n    }\n\n    pub fn prestar(\u0026mut self,cliente:Cliente,libro:\u0026Libro,vencimiento:Fecha) -\u003e Result\u003c(),Errores\u003e {\n        /* \n        if (self.copias(\u0026libro)\u003e0) \u0026\u0026 (self.prestamos(\u0026cliente)\u003c5) \u0026\u0026 (!self.tiene_prestamo_del_libro(\u0026cliente, \u0026libro)) {\n            self.prestamos.push(Prestamo::new(\u0026libro.clone(), \u0026cliente, \u0026vencimiento));\n            self.decrementar(\u0026libro.clone());\n            return true\n        } else {\n            return false\n        }\n        */\n        if self.copias(\u0026libro)\u003e0 {\n            if self.prestamos(\u0026cliente)\u003c5 {\n                if !self.tiene_prestamo_del_libro(\u0026cliente, \u0026libro){\n                    self.prestamos.push(Prestamo::new(\u0026libro.clone(), \u0026cliente, \u0026vencimiento));\n                    self.decrementar(\u0026libro.clone())?;\n                    self.guardar_info_prestamos()?;\n                    return Ok(())\n                }\n                return Err(Errores::ErrorOperatoria(error_operatoria::PrestamoActivo))\n            }\n            return Err(Errores::ErrorOperatoria(error_operatoria::LimitePrestamos))\n        }\n        return Err(Errores::ErrorOperatoria(error_operatoria::SinStock(libro.get_titulo())))\n    }\n    \n    //Parametro auxiliar de fecha para el calculo de proximidad\n    //Se filtran solo los que esten dentro del lapso inicial hasta al limite indicado en los dias \n    pub fn vencimientos_proximos(\u0026self,fecha_act:\u0026Fecha,dias:u32) -\u003e Vec\u003c\u0026Prestamo\u003e {\n        let mut fecha_lim = fecha_act.clone();\n        fecha_lim.sumar_dias(dias);\n        let mut prestamos: Vec\u003c\u0026Prestamo\u003e = Vec::new();\n        for prestamo in \u0026self.prestamos {\n            if (prestamo.estado.es_igual_a(\u0026Estado::EnPrestamo))\u0026\u0026\n            (!fecha_act.es_mayor(\u0026prestamo.vencimiento))\u0026\u0026\n            (!prestamo.vencimiento.es_mayor(\u0026fecha_lim)) {\n                prestamos.push(\u0026prestamo);\n            }\n        }\n\n        return prestamos\n    }\n\n    //Solo apunta como vencidos a los prestamos = (vencimiento \u003c actual) equivalente (actual \u003e vencimiento) \n    pub fn prestamos_vencidos(\u0026self,f:\u0026Fecha) -\u003e Vec\u003c\u0026Prestamo\u003e {\n        let mut fecha_actual = f.clone();\n        let mut prestamos: Vec\u003c\u0026Prestamo\u003e = Vec::new();\n        for prestamo in \u0026self.prestamos {\n            if (prestamo.estado.es_igual_a(\u0026Estado::EnPrestamo))\u0026\u0026(fecha_actual.es_mayor(\u0026prestamo.vencimiento)) {\n                prestamos.push(prestamo);\n            }\n        }\n\n        return prestamos\n    }\n\n    //La busqueda debe retornar el prestamo \"mas reciente\" , por ello\n    //se recorre a la inversa nuestro registro de prestamos y solo retornar el ultimo registrado del cliente\n    fn buscar(\u0026self,libro:\u0026Libro,cliente:\u0026Cliente) -\u003e Option\u003c\u0026Prestamo\u003e {\n        let mut res = None;\n        if !self.prestamos.is_empty(){\n            \n            for i in (0..self.prestamos.len()).rev() {\n                if self.prestamos[i].es_igual(\u0026libro, \u0026cliente){\n                    res = Some(\u0026self.prestamos[i]);\n                    break;\n                }\n                \n            }\n        }\n        \n        return res\n    }\n\n    fn devolver(\u0026mut self,fecha_devolucion:Fecha,libro:\u0026Libro,cliente:\u0026Cliente)-\u003eResult\u003c(),Errores\u003e {\n        /* \n        let mut pude = false;\n        for prestamo in \u0026mut self.prestamos {\n            if prestamo.es_igual(\u0026libro, \u0026cliente) \u0026\u0026 prestamo.estado.es_igual_a(\u0026Estado::EnPrestamo) {\n                prestamo.estado = Estado::Devuelto;\n                prestamo.devolucion = Some(fecha_devolucion.clone());\n                pude = true;\n                break;\n            }\n        }\n        if pude {self.incrementar(\u0026libro.clone());}\n        */\n        if !self.prestamos.is_empty(){\n            for prestamo in \u0026mut self.prestamos {\n                if prestamo.es_igual(\u0026libro, \u0026cliente) \u0026\u0026 prestamo.estado.es_igual_a(\u0026Estado::EnPrestamo) {\n                    prestamo.estado = Estado::Devuelto;\n                    prestamo.devolucion = Some(fecha_devolucion);\n                    //Ya se guarda aqui\n                    self.incrementar(\u0026libro.clone())?;\n                    return Ok(())\n                }\n            }\n            return Err(Errores::ErrorOperatoria(error_operatoria::Inexistente(self.get_nombre())))\n        }\n        return Err(Errores::ErrorOperatoria(error_operatoria::EstructuraVacia(self.get_nombre())))\n    }\n}\n\n#[cfg(test)]\nmod testing_ejercicio10 {\n    use super::*;\n\n    #[test]\n    fn stock_basico_biblioteca(){\n        let nombre = String::from(\"Silencio\");\n        let direccion = String::from(\"1 e 2 y 3\");\n       \n        let mut biblioteca = Biblioteca::new(nombre,direccion,\"./lista_libros1.json\",\"./lista_prestamo1.json\");\n        assert_eq!(biblioteca.es_igual_a(\u0026Biblioteca::new(\"Silencio\".to_string(),\"1 e 2 y 3\".to_string(),\"./lista_libros.json1\",\"./lista_prestamo1.json\")),true);\n\n        let libro1 = Libro::new(10, \"Libro1\".to_string(), \"Autor1\".to_string(), 50 , Genero::Infantil);\n        let libro2 = Libro::new(20, \"Libro2\".to_string(), \"Autor2\".to_string(), 50 , Genero::Novela);\n        let libro3 = Libro::new(30, \"Libro3\".to_string(), \"Autor3\".to_string(), 50 , Genero::Tecnico);\n        let libro4 = Libro::new(40, \"Libro4\".to_string(), \"Autor4\".to_string(), 50 , Genero::Otro);\n\n        //Estructura vacia\n        assert!(biblioteca.incrementar(\u0026libro1).is_err_and(|e|{\n            assert!(!e.to_string().is_empty());\n            matches!(e,Errores::ErrorOperatoria(error_operatoria::EstructuraVacia(_)))\n        }));\n        assert!(biblioteca.decrementar(\u0026libro2).is_err_and(|e|{\n            assert!(!e.to_string().is_empty());\n            matches!(e,Errores::ErrorOperatoria(error_operatoria::EstructuraVacia(_)))\n        }));\n        \n        //Agrego libro1\n        assert!(biblioteca.agregar_libro(libro1.clone(),0).is_ok());\n        assert!(biblioteca.incrementar(\u0026libro1).is_ok());\n        \n        //Inexistencia de libro2\n        assert!(biblioteca.decrementar(\u0026libro2).is_err_and(|e|{\n            assert!(!e.to_string().is_empty());\n            matches!(e,Errores::ErrorOperatoria(error_operatoria::Inexistente(_)))\n        }));\n        assert!(biblioteca.incrementar(\u0026libro2).is_err_and(|e|{\n            assert!(!e.to_string().is_empty());\n            matches!(e,Errores::ErrorOperatoria(error_operatoria::Inexistente(_)))\n        }));\n\n        //Fuera de stock del libro1\n        assert!(biblioteca.decrementar(\u0026libro1).is_ok());\n        assert!(biblioteca.decrementar(\u0026libro1).is_err_and(|e|{\n            assert!(!e.to_string().is_empty());\n            matches!(e,Errores::ErrorOperatoria(error_operatoria::Inexistente(_)))\n        }));\n\n        assert!(biblioteca.agregar_libro(libro1.clone(),3).is_ok(),\"No debio fallar porque el libro ya estaba registrado para reponer stock\");\n        assert!(biblioteca.agregar_libro(libro2.clone(),3).is_ok());\n        assert!(biblioteca.decrementar(\u0026libro2).is_ok());\n        assert!(biblioteca.agregar_libro(libro3.clone(),3).is_ok());\n        assert!(biblioteca.agregar_libro(libro4.clone(),4).is_ok());\n\n        assert_eq!(biblioteca.copias(\u0026libro1),3);\n        assert_eq!(biblioteca.copias(\u0026libro2),2);\n        assert_eq!(biblioteca.copias(\u0026libro3),3);\n        assert_eq!(biblioteca.copias(\u0026libro4),4);\n\n        //Limpieza para prevenir acumulacion de archivos\n        assert!(std::fs::remove_file(\"./lista_libros1.json\").is_ok(),\"Error fuera de lo previsto\");\n    }\n\n    \n    #[test]\n    fn nuevos_prestamos(){\n        let mut biblioteca = Biblioteca::new(String::from(\"Sabio\"),String::from(\"Av1\"),\"./lista_libros2.json\",\"./lista_prestamos2.json\");\n\n        //Libros\n        let libro1 = Libro::new(10, \"Libro1\".to_string(), \"Autor1\".to_string(), 50 , Genero::Infantil);\n        let libro2 = Libro::new(20, \"Libro2\".to_string(), \"Autor2\".to_string(), 50 , Genero::Novela);\n\n        assert!(biblioteca.agregar_libro(libro1.clone(),5).is_ok());\n        assert!(biblioteca.agregar_libro(libro2.clone(),5).is_ok());\n\n        let cliente1 = Cliente::new(\"Carlos\".to_string(),1,\"Carlos.com\".to_string());\n        let cliente2 = Cliente::new(\"Mateo\".to_string(),2,\"Mateo.com\".to_string());\n        \n        //Prestamos\n        let mut quince_dias = Fecha::new(15, 5, 2026);\n\n        assert!(biblioteca.prestar(cliente1.clone(), \u0026libro1, quince_dias.clone()).is_ok() , \"No se pudo hacer el prestamo\");\n        assert!(biblioteca.prestar(cliente2.clone(), \u0026libro2, quince_dias.clone()).is_ok() , \"No se pudo hacer el prestamo\");\n\n        assert_eq!(biblioteca.prestamos(\u0026cliente1),1);\n        assert_eq!(biblioteca.prestamos(\u0026cliente2),1);\n\n        //Limpieza para prevenir acumulacion de archivos\n        assert!(std::fs::remove_file(\"./lista_libros2.json\").is_ok(),\"Error fuera de lo previsto\");\n        assert!(std::fs::remove_file(\"./lista_prestamos2.json\").is_ok(),\"Error fuera de lo previsto\");\n    }\n\n     \n    #[test]\n    fn prestamos_restringidos(){\n        let mut biblioteca = Biblioteca::new(String::from(\"Sabioso\"),String::from(\"Av12\"),\"./lista_libros3.json\",\"./lista_prestamos3.json\");\n\n        //Libros\n        let libro1 = Libro::new(10, \"Libro1\".to_string(), \"Autor1\".to_string(), 50 , Genero::Infantil);\n        let libro2 = Libro::new(20, \"Libro2\".to_string(), \"Autor2\".to_string(), 50 , Genero::Novela);\n        let libro3 = Libro::new(30, \"Libro3\".to_string(), \"Autor3\".to_string(), 50 , Genero::Tecnico);\n        let libro4 = Libro::new(40, \"Libro4\".to_string(), \"Autor4\".to_string(), 50 , Genero::Otro);\n        let libro5 = Libro::new(30, \"Libro5\".to_string(), \"Autor3\".to_string(), 50 , Genero::Tecnico);\n        let libro6 = Libro::new(40, \"Libro6\".to_string(), \"Autor4\".to_string(), 50 , Genero::Otro);\n\n        let cliente3 = Cliente::new(\"Juan\".to_string(),3,\"Juan.com\".to_string());\n        let cliente4 = Cliente::new(\"Pedro\".to_string(),4,\"Pedro.com\".to_string());\n\n        //Sin libros para prestar\n        assert!(biblioteca.prestar(cliente3.clone(), \u0026libro1, Fecha::new(10,05,2026)).is_err_and(|e|{\n            assert!(!e.to_string().is_empty());\n            matches!(e,Errores::ErrorOperatoria(error_operatoria::SinStock(_)))\n        }) );\n        \n        assert!(biblioteca.agregar_libro(libro1.clone(),1).is_ok());\n        assert!(biblioteca.agregar_libro(libro2.clone(),5).is_ok());\n        assert!(biblioteca.agregar_libro(libro3.clone(),5).is_ok());\n        assert!(biblioteca.agregar_libro(libro4.clone(),5).is_ok());\n        assert!(biblioteca.agregar_libro(libro5.clone(),5).is_ok());\n        assert!(biblioteca.agregar_libro(libro6.clone(),5).is_ok());\n\n        //Prestamos \n        assert!(biblioteca.prestar(cliente3.clone(), \u0026libro1, Fecha::new(10,05,2026)).is_ok() , \"No se pudo hacer el prestamo\");\n        //Restriccion por stock insuficiente \n        assert!(biblioteca.prestar(cliente4.clone(), \u0026libro1, Fecha::new(10,05,2026)).is_err_and(|e|{\n            assert!(!e.to_string().is_empty());\n            matches!(e,Errores::ErrorOperatoria(error_operatoria::SinStock(_)))\n        }) );\n\n        assert!(biblioteca.incrementar(\u0026libro1).is_ok());\n        //Restriccion del prestamo para el mismo libro pendiente\n        assert!(biblioteca.prestar(cliente3.clone(), \u0026libro1, Fecha::new(10,05,2026)).is_err_and(|e|{\n            assert!(!e.to_string().is_empty());\n            matches!(e,Errores::ErrorOperatoria(error_operatoria::PrestamoActivo))\n        }));\n        \n        //Restriccion por maximo de prestamos otorgados\n        assert!(biblioteca.prestar(cliente3.clone(),\u0026libro2,Fecha::new(10,05,2026)).is_ok());\n        assert!(biblioteca.prestar(cliente3.clone(),\u0026libro3,Fecha::new(10,05,2026)).is_ok());\n        assert!(biblioteca.prestar(cliente3.clone(),\u0026libro4,Fecha::new(10,05,2026)).is_ok());\n        assert!(biblioteca.prestar(cliente3.clone(),\u0026libro5,Fecha::new(10,05,2026)).is_ok());\n        \n        assert!(biblioteca.prestar(cliente3.clone(),\u0026libro6,Fecha::new(10,05,2026)).is_err_and(|e|{\n            assert!(!e.to_string().is_empty());\n            matches!(e,Errores::ErrorOperatoria(error_operatoria::LimitePrestamos))\n        }));\n        \n        assert_eq!(biblioteca.prestamos(\u0026cliente3),5);\n\n        //Limpieza para prevenir acumulacion de archivos\n        assert!(std::fs::remove_file(\"./lista_libros3.json\").is_ok(),\"Error fuera de lo previsto\");\n        assert!(std::fs::remove_file(\"./lista_prestamos3.json\").is_ok(),\"Error fuera de lo previsto\");\n    }\n    \n    \n    #[test]\n    fn prestamos_proximos_a_vencer(){\n        let mut biblioteca = Biblioteca::new(String::from(\"Sabioso\"),String::from(\"Av12\"),\"./lista_libros4.json\",\"./lista_prestamos4.json\");\n\n        //Libros\n        let libro1 = Libro::new(10, \"Libro1\".to_string(), \"Autor1\".to_string(), 50 , Genero::Infantil);\n        let libro2 = Libro::new(20, \"Libro2\".to_string(), \"Autor2\".to_string(), 50 , Genero::Novela);\n        let libro3 = Libro::new(30, \"Libro3\".to_string(), \"Autor3\".to_string(), 50 , Genero::Tecnico);\n        let libro4 = Libro::new(40, \"Libro4\".to_string(), \"Autor4\".to_string(), 50 , Genero::Otro);\n        let libro5 = Libro::new(30, \"Libro5\".to_string(), \"Autor3\".to_string(), 50 , Genero::Tecnico);\n        let libro6 = Libro::new(40, \"Libro6\".to_string(), \"Autor4\".to_string(), 50 , Genero::Otro);\n\n        assert!(biblioteca.agregar_libro(libro1.clone(),5).is_ok());\n        assert!(biblioteca.agregar_libro(libro2.clone(),5).is_ok());\n        assert!(biblioteca.agregar_libro(libro3.clone(),5).is_ok());\n        assert!(biblioteca.agregar_libro(libro4.clone(),5).is_ok());\n        assert!(biblioteca.agregar_libro(libro5.clone(),5).is_ok());\n        assert!(biblioteca.agregar_libro(libro6.clone(),5).is_ok());\n\n        let cliente3 = Cliente::new(\"Juan\".to_string(),3,\"Juan.com\".to_string());\n        let cliente4 = Cliente::new(\"Pedro\".to_string(),4,\"Pedro.com\".to_string());\n\n        //Fechas de referencia actual\n        let mut actual = Fecha::new(1,5,2026);\n\n        //Sin prestamos hechos\n        assert!(biblioteca.vencimientos_proximos(\u0026actual,19).is_empty());\n\n        //Lapso que evalua (1/5/26 \u003c= vencimiento \u003c= 20/05/26)\n        assert!(biblioteca.prestar(cliente3.clone(), \u0026libro1, Fecha::new(12,5,2026)).is_ok());\n        assert!(biblioteca.prestar(cliente4.clone(), \u0026libro1, Fecha::new(1,5,2026)).is_ok());\n        assert!(biblioteca.prestar(cliente3.clone(), \u0026libro2, Fecha::new(25,5,2026)).is_ok());\n        assert!(biblioteca.prestar(cliente4.clone(), \u0026libro6, Fecha::new(2,6,2026)).is_ok());\n        assert!(biblioteca.prestar(cliente3.clone(), \u0026libro3, Fecha::new(20,5,2026)).is_ok());\n\n        assert_eq!(biblioteca.vencimientos_proximos(\u0026actual,19).len(),3);\n\n        assert!(biblioteca.devolver(Fecha::new(1,5,2026),\u0026libro1,\u0026cliente3).is_ok());\n        assert!(biblioteca.devolver(Fecha::new(1,5,2026),\u0026libro2,\u0026cliente3).is_ok());\n        assert!(biblioteca.devolver(Fecha::new(1,5,2026),\u0026libro1,\u0026cliente4).is_ok());\n        assert!(biblioteca.devolver(Fecha::new(1,5,2026),\u0026libro6,\u0026cliente4).is_ok());\n\n        assert_eq!(biblioteca.vencimientos_proximos(\u0026actual,19).len(),1);\n\n        //Limpieza para prevenir acumulacion de archivos\n        assert!(std::fs::remove_file(\"./lista_libros4.json\").is_ok(),\"Error fuera de lo previsto\");\n        assert!(std::fs::remove_file(\"./lista_prestamos4.json\").is_ok(),\"Error fuera de lo previsto\");\n    }\n\n    #[test]\n    fn prestamos_vencidos(){\n        let mut biblioteca = Biblioteca::new(String::from(\"Sabioso\"),String::from(\"Av12\"),\"./lista_libros5.json\",\"./lista_prestamos5.json\");\n\n        //Libros\n        let libro1 = Libro::new(10, \"Libro1\".to_string(), \"Autor1\".to_string(), 50 , Genero::Infantil);\n        let libro2 = Libro::new(20, \"Libro2\".to_string(), \"Autor2\".to_string(), 50 , Genero::Novela);\n        let libro3 = Libro::new(30, \"Libro3\".to_string(), \"Autor3\".to_string(), 50 , Genero::Tecnico);\n        let libro4 = Libro::new(40, \"Libro4\".to_string(), \"Autor4\".to_string(), 50 , Genero::Otro);\n        let libro5 = Libro::new(30, \"Libro5\".to_string(), \"Autor3\".to_string(), 50 , Genero::Tecnico);\n        let libro6 = Libro::new(40, \"Libro6\".to_string(), \"Autor4\".to_string(), 50 , Genero::Otro);\n        \n        assert!(biblioteca.agregar_libro(libro1.clone(),5).is_ok());\n        assert!(biblioteca.agregar_libro(libro2.clone(),5).is_ok());\n        assert!(biblioteca.agregar_libro(libro3.clone(),5).is_ok());\n        assert!(biblioteca.agregar_libro(libro4.clone(),5).is_ok());\n        assert!(biblioteca.agregar_libro(libro5.clone(),5).is_ok());\n        assert!(biblioteca.agregar_libro(libro6.clone(),5).is_ok());\n\n        let cliente3 = Cliente::new(\"Juan\".to_string(),3,\"Juan.com\".to_string());\n        let cliente4 = Cliente::new(\"Pedro\".to_string(),4,\"Pedro.com\".to_string());\n\n        //Fechas de referencia actual\n        let mut actual = Fecha::new(1,5,2026);\n\n        //Sin prestamos hechos\n        assert!(biblioteca.prestamos_vencidos(\u0026actual).is_empty());\n\n        //Lapso que evalua (vencimiento \u003c 1/5/26)\n        assert!(biblioteca.prestar(cliente3.clone(), \u0026libro1, Fecha::new(12,4,2026)).is_ok());\n        assert!(biblioteca.prestar(cliente4.clone(), \u0026libro1, Fecha::new(2,4,2026)).is_ok());\n        assert!(biblioteca.prestar(cliente3.clone(), \u0026libro2, Fecha::new(25,5,2026)).is_ok());\n        assert!(biblioteca.prestar(cliente4.clone(), \u0026libro6, Fecha::new(1,5,2026)).is_ok());\n        assert!(biblioteca.prestar(cliente3.clone(), \u0026libro3, Fecha::new(20,5,2026)).is_ok());\n\n        assert_eq!(biblioteca.prestamos_vencidos(\u0026actual).len(),2);\n\n        assert!(biblioteca.devolver(Fecha::new(1,5,2026), \u0026libro1, \u0026cliente3).is_ok());\n        assert!(biblioteca.devolver(Fecha::new(1,5,2026), \u0026libro6, \u0026cliente4).is_ok());\n\n        assert_eq!(biblioteca.prestamos_vencidos(\u0026actual).len(),1);\n\n        //Limpieza para prevenir acumulacion de archivos\n        assert!(std::fs::remove_file(\"./lista_libros5.json\").is_ok(),\"Error fuera de lo previsto\");\n        assert!(std::fs::remove_file(\"./lista_prestamos5.json\").is_ok(),\"Error fuera de lo previsto\");\n\n    }\n\n    \n    #[test]\n    fn busqueda_de_prestamos(){\n        let mut biblioteca = Biblioteca::new(String::from(\"Sabioso\"),String::from(\"Av12\"),\"./lista_libros6.json\",\"./lista_prestamos6.json\");\n\n        //Libros\n        let libro1 = Libro::new(10, \"Libro1\".to_string(), \"Autor1\".to_string(), 50 , Genero::Infantil);\n        let libro2 = Libro::new(20, \"Libro2\".to_string(), \"Autor2\".to_string(), 50 , Genero::Novela);\n        let libro3 = Libro::new(30, \"Libro3\".to_string(), \"Autor3\".to_string(), 50 , Genero::Tecnico);\n        let libro4 = Libro::new(40, \"Libro4\".to_string(), \"Autor4\".to_string(), 50 , Genero::Otro);\n        let libro5 = Libro::new(30, \"Libro5\".to_string(), \"Autor3\".to_string(), 50 , Genero::Tecnico);\n        let libro6 = Libro::new(40, \"Libro6\".to_string(), \"Autor4\".to_string(), 50 , Genero::Otro);\n\n        let cliente2 = Cliente::new(\"Juanito\".to_string(),2,\"Juanito.com\".to_string());\n        let cliente3 = Cliente::new(\"Juan\".to_string(),3,\"Juan.com\".to_string());\n        let cliente4 = Cliente::new(\"Pedro\".to_string(),4,\"Pedro.com\".to_string());\n\n        assert!(biblioteca.agregar_libro(libro1.clone(),5).is_ok());\n        assert!(biblioteca.agregar_libro(libro2.clone(),5).is_ok());\n        assert!(biblioteca.agregar_libro(libro3.clone(),5).is_ok());\n        assert!(biblioteca.agregar_libro(libro4.clone(),5).is_ok());\n        assert!(biblioteca.agregar_libro(libro5.clone(),5).is_ok());\n        assert!(biblioteca.agregar_libro(libro6.clone(),5).is_ok());\n\n        assert!(biblioteca.devolver(Fecha::new(1,5,2026),\u0026libro1,\u0026cliente3).is_err_and(|e|{\n            assert!(!e.to_string().is_empty());\n            matches!(e,Errores::ErrorOperatoria(error_operatoria::EstructuraVacia(_)))\n        }));\n\n        //Fechas de referencia\n        //let actual = Fecha::new(1,5,2026);\n\n        assert!(biblioteca.prestar(cliente3.clone(), \u0026libro1, Fecha::new(12,5,2026)).is_ok());\n        assert!(biblioteca.prestar(cliente4.clone(), \u0026libro1, Fecha::new(1,5,2026)).is_ok());\n        assert!(biblioteca.prestar(cliente3.clone(), \u0026libro2, Fecha::new(25,5,2026)).is_ok());\n        assert!(biblioteca.prestar(cliente4.clone(), \u0026libro6, Fecha::new(2,6,2026)).is_ok());\n        assert!(biblioteca.prestar(cliente3.clone(), \u0026libro3, Fecha::new(20,5,2026)).is_ok());\n        assert!(biblioteca.prestar(cliente2.clone(), \u0026libro4, Fecha::new(20,5,2026)).is_ok());\n        assert!(biblioteca.prestar(cliente2.clone(), \u0026libro6, Fecha::new(20,5,2026)).is_ok());\n\n        assert!(biblioteca.devolver(Fecha::new(1,5,2026),\u0026libro1,\u0026cliente3).is_ok());\n        assert!(biblioteca.devolver(Fecha::new(1,5,2026),\u0026libro3,\u0026cliente3).is_ok());\n        assert!(biblioteca.devolver(Fecha::new(1,5,2026),\u0026libro1,\u0026cliente4).is_ok());\n        assert!(biblioteca.devolver(Fecha::new(1,5,2026),\u0026libro6,\u0026cliente4).is_ok());\n        assert!(biblioteca.devolver(Fecha::new(1,5,2026),\u0026libro6,\u0026cliente2).is_ok());\n\n        //Un prestamo devuelto\n        assert!(biblioteca.buscar(\u0026libro6, \u0026cliente2).is_some_and(|p|p.estado.es_igual_a(\u0026Estado::Devuelto)),\"El prestamo no se devolvio anteriormente o no existe\");\n\n        //Un prestamo pendiente\n        assert!(biblioteca.buscar(\u0026libro2, \u0026cliente3).is_some_and(|p|p.estado.es_igual_a(\u0026Estado::EnPrestamo)),\"El prestamo tendria que estar pendiente o existir\");\n\n        //Un prestamo inexistente\n        assert!(biblioteca.buscar(\u0026libro1,\u0026cliente2).is_none(),\"No deberia existir el prestamo en el registro\");\n\n        //Limpieza para prevenir acumulacion de archivos\n        assert!(std::fs::remove_file(\"./lista_libros6.json\").is_ok(),\"Error fuera de lo previsto\");\n        assert!(std::fs::remove_file(\"./lista_prestamos6.json\").is_ok(),\"Error fuera de lo previsto\");\n\n    }\n    \n    /*\n\t\tCasos especiales para la cobertura de coverage\n\t*/\n\t#[test]\n\tfn caso_especial_error_io_libros() {\n\t\t// Se buscara forzar un ErrorIO usando una ruta cuyo directorio base NO EXISTE\n\t\tlet path_err = \"./carpeta_inexistente_123/x.json\";\n\n\t\tlet mut biblioteca = Biblioteca::new(String::from(\"Karateca\"),String::from(\"Av12\"),path_err,\"./cosa/equisde.json\");\n        let libro1 = Libro::new(10, \"Libro1\".to_string(), \"Autor1\".to_string(), 50 , Genero::Infantil);\n\n        // Al intentar agregar un libro, llamará internamente a File::create() en la ruta rota, provocando un ErrorIO\n        \n\t\tassert!(biblioteca.agregar_libro(libro1, 1).is_err_and(|e|{\n                assert!(!e.to_string().is_empty());\n\t\t\t    matches!(e, Errores::ErrorIO(_))\n        }),\"Ocurrio un error imprevisto\");\n\t}\n\n    #[test]\n\tfn caso_especial_error_io_prestamos() {\n\t\t// Se buscara forzar un ErrorIO usando una ruta cuyo directorio base NO EXISTE\n\t\tlet path_err = \"./carpeta_inexistente_123/x.json\";\n\n\t\tlet mut biblioteca = Biblioteca::new(String::from(\"Karateca\"),String::from(\"Av12\"),\"./equisde.json\",path_err);\n        let libro1 = Libro::new(10, \"Libro1\".to_string(), \"Autor1\".to_string(), 50 , Genero::Infantil);\n        let cliente2 = Cliente::new(\"Juanito\".to_string(),2,\"Juanito.com\".to_string());\n        // Al intentar hacer un prestamo, llamará internamente a File::create() en la ruta rota, provocando un ErrorIO\n        \n        assert!(biblioteca.agregar_libro(libro1.clone(), 1).is_ok());\n\t\tassert!(biblioteca.prestar(cliente2,\u0026libro1,Fecha::new(4, 4, 2024)).is_err_and(|e|{\n                assert!(!e.to_string().is_empty());\n\t\t\t    matches!(e, Errores::ErrorIO(_))\n        }),\"Ocurrio un error imprevisto\");\n        assert!(std::fs::remove_file(\"./equisde.json\").is_ok(),\"Error fuera de lo previsto\");\n\n\t}\n\n\t#[test]\n\tfn caso_especial_error_serde() {\n\t\tlet path_err = \"./corrupto.json\";\n\t\t\n\t\t// Se fuerza la escritura en el contenido temporal que NO cumple con el formato estructurado de un .JSON válido\n\t\tassert!(std::fs::write(path_err, \"{ \u0026\u00265435#$#$\u002642365_XXXX1234 : [::: \").is_ok(),\"No debio fallar aqui\");\n\n\t\t// Se invoca directamente el método para leer el archivo del path que buscara\n\n\t\tassert!(Biblioteca::recuperar_info_libros(path_err).is_err_and(|e|{\n\t\t\tassert!(!e.to_string().is_empty());\n\t\t\tmatches!(e, Errores::ErrorSerde(_))\n\t\t}),\"Aquí debió fallar\");\n\n        asse num error_operatoria{\n    Inexistente(String),\n    EstructuraVacia(String),\n\tContratoActivo(String),\n\tRechazado(String)\n}\n\nimpl Display for error_operatoria{\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        match self{\n            error_operatoria::Inexistente(val) =\u003e write!(f, \"No se encontro el elemento en la estructura {} \",val),\n            error_operatoria::EstructuraVacia(val) =\u003e write!(f, \"La estrucutra {} no dispone de elementos \",val),\n\t\t\terror_operatoria::ContratoActivo(val) =\u003e write!(f,\"El usuario {} ya tiene un contrato activo y no puede emplear otro nuevo\",val),\n\t\t\terror_operatoria::Rechazado(val) =\u003e write!(f,\"La operacion a sido rechazada por {}\",val)\n\t\t}\n    }\n}\n\n#[derive(Debug)]\nenum Errores{\n    ErrorOperatoria(error_operatoria),\n    ErrorIO(io::Error),\n    ErrorSerde(serde_json::Error)\n}\n\nimpl Display for Errores{\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        match self {\n            Errores::ErrorOperatoria(err) =\u003e write!(f,\"{}\",err),\n            Errores::ErrorIO(err) =\u003e write!(f, \"Error de E/S al guardar: {}\", err),\n            Errores::ErrorSerde(err) =\u003e write!(f, \"Error de serialización: {}\", err)\n        }\n    }\n}\n\n//Implementacion para el uso del operador (?)\nimpl std::error::Error for Errores {}\n\n//Implementacion automatica errores subyacentes\nimpl From\u003cio::Error\u003e for Errores {\n    fn from(err: io::Error) -\u003e Self {\n        Errores::ErrorIO(err)\n    }\n}\n\nimpl From\u003cserde_json::Error\u003e for Errores {\n    fn from(err: serde_json::Error) -\u003e Self {\n        Errores::ErrorSerde(err)\n    }\n}\n\n/*\n\tExtraccion Ejercicio 3 - TP4\n\tEstructuras secundarias \n*/\n\nuse core::hash;\nuse std::collections::HashMap;\n\n#[derive(PartialEq,Eq,Debug,Clone,Hash,Serialize,Deserialize)]\nenum TipoSuscripcion{\n\tBasic,\n\tClasic,\n\tSuper\n}\n\n#[derive(PartialEq,Eq,Debug,Clone,Hash,Serialize,Deserialize)]\nstruct InfoMercadoPago {\n    alias: String,\n    cuil: u128,\n}\n\n#[derive(PartialEq,Eq,Debug,Clone,Hash,Serialize,Deserialize)]\nstruct InfoTransferencia {\n    cbu: u128,\n    banco: String,\n}\n\n#[derive(PartialEq,Eq,Debug,Clone,Hash,Serialize,Deserialize)]\nstruct InfoTarjeta {\n    numero_tarjeta: u128,\n    franquicia: String, \n}\n\n#[derive(PartialEq,Eq,Debug,Clone,Hash,Serialize,Deserialize)]\nstruct InfoCripto {\n    wallet_address: String,\n    red: String,\n}\n\n#[derive(PartialEq,Eq,Debug,Clone,Hash,Serialize,Deserialize)]\nenum MediosDePago{\n\tEfectivo,\n\tMercadoPago(InfoMercadoPago),\n\tTransferenciaBancaria(InfoTransferencia),\n\tTarjetaDeCredito(InfoTarjeta),\n\tCriptomoneda(InfoCripto)\n}\n\n/*\n\tEstructuras primarias : Usuario y suscripcion\n*/\n\n#[derive(PartialEq,Debug,Clone,Serialize,Deserialize)]\nstruct ContratoSuscripcion{\n\t//Referencia al usuario\n\tdni_usuario : u64,\n\t//Datos de contrato para la misma\n\ttipo_suscripcion : TipoSuscripcion,\n\tactivo : bool,\n\tcosto_mensual : f64,\n\tduracion_mes : u8,\n\tfecha_inicio : u64,\n\ttipo_pago : MediosDePago\n}\n\n#[derive(PartialEq,Debug,Clone)]\nstruct Usuario{\n\tnombre : String,\n\tdni : u64\n}\n\n/*\n\tEstructura plataforma\n*/\n\nstruct Plataforma{\n\tusuarios : Vec\u003cUsuario\u003e,\n\tregistro_suscripciones : Vec\u003cContratoSuscripcion\u003e,\n\tpath: String\n}\n\nimpl Usuario{\n\tpub fn new(nom:\u0026str,dni_in:u64)-\u003eUsuario{\n\t\treturn Usuario { nombre: nom.to_string() , dni: dni_in }\n\t}\n\tpub fn get_dni(\u0026self)-\u003eu64{\n\t\treturn self.dni\n\t}\n}\n\nimpl ContratoSuscripcion{\n\tpub fn new(dni:u64,tipo:\u0026TipoSuscripcion,costo:f64,cant:u8,fecha:u64,medio:\u0026MediosDePago)-\u003eContratoSuscripcion{\n\t\treturn ContratoSuscripcion { \n\t\t\tdni_usuario: dni,\n\t\t\ttipo_suscripcion: tipo.clone(), \n\t\t\tactivo: true, \n\t\t\tcosto_mensual: costo, \n\t\t\tduracion_mes: cant, \n\t\t\tfecha_inicio: fecha, \n\t\t\ttipo_pago: medio.clone() \n\t\t}\n\t}\n\tpub fn cancelar_suscripcion(\u0026mut self){\n\t\tself.activo = false;\n\t}\n\tpub fn upgrade_tipo(\u0026mut self)-\u003ebool{\n\t\tlet mut exito = true;\n\t\tmatch self.tipo_suscripcion{\n\t\t\tTipoSuscripcion::Basic =\u003e self.tipo_suscripcion = TipoSuscripcion::Clasic,\n\t\t\tTipoSuscripcion::Clasic =\u003e self.tipo_suscripcion = TipoSuscripcion::Super,\n\t\t\tTipoSuscripcion::Super =\u003e exito = false,\n\t\t\t_ =\u003e exito = false,\n\t\t}\n\t\t\n\t\treturn exito\n\t}\n\tpub fn downgrade_tipo(\u0026mut self)-\u003ebool{\n\t\tlet mut exito = true;\n\t\t\n\t\tmatch self.tipo_suscripcion{\n\t\t\tTipoSuscripcion::Super =\u003e self.tipo_suscripcion = TipoSuscripcion::Clasic,\n\t\t\tTipoSuscripcion::Clasic =\u003e self.tipo_suscripcion = TipoSuscripcion::Basic,\n\t\t\tTipoSuscripcion::Basic =\u003e exito = false,\n\t\t\t_ =\u003e exito = false,\n\t\t}\n\t\t\n\t\treturn exito\n\t}\n\tpub fn dni_igual(\u0026self,dni:u64)-\u003ebool{\n\t\treturn self.dni_usuario == dni\n\t}\n}\n\nimpl Plataforma{\n\tpub fn new(path_in:\u0026str)-\u003ePlataforma{\n\t\tlet suscripciones : Vec\u003cContratoSuscripcion\u003e = match Plataforma::recuperar_informacion(path_in){\n\t\t\tOk(datos) =\u003e datos,\n\t\t\tErr(_) =\u003e Vec::new()\n\t\t};\n\t\treturn Plataforma { \n\t\t\tusuarios: Vec::new(), \n\t\t\tregistro_suscripciones: suscripciones ,\n\t\t\tpath: path_in.to_string()\n\t\t}\n\t}\n\t/*\n\t\tNueva implementacion - TP5\n\t*/\n\tfn recuperar_informacion(path:\u0026str)-\u003e Result\u003cVec\u003cContratoSuscripcion\u003e,Errores\u003e{\n\t\tlet file = File::open(path).map_err(Errores::ErrorIO)?;\n\t\tlet suscripciones: Vec\u003cContratoSuscripcion\u003e = serde_json::from_reader(file).map_err(Errores::ErrorSerde)?;\n\t\tOk(suscripciones)\n\t}\n\tfn guardar_informacion(\u0026self) -\u003e Result\u003c(), Errores\u003e {\n\t    let mut file = File::create(\u0026self.path)?;\n\t    let serialized = serde_json::to_string(\u0026self.registro_suscripciones)?;\n        file.write_all(serialized.as_bytes())?;\n\t\treturn Ok(())\n    }\n\t/* \n\t\tMetodos primarios\n\t*/\n\t//Los dni son unicos\n\tfn usuario_en_sistema(\u0026self,user_dni:u64)-\u003ebool{\n\t\treturn self.usuarios.iter().any(|user| user.get_dni() == user_dni)\n\t}\n\tpub fn registrar_usuario(\u0026mut self,u:\u0026Usuario)-\u003ebool{\n\t\tif !self.usuario_en_sistema(u.get_dni()){\n\t\t\tself.usuarios.push(u.clone());\n\t\t}else{\n\t\t\treturn false\n\t\t}\n\t\treturn true\n\t}\n\tpub fn registrar_contrato(\u0026mut self,c:\u0026ContratoSuscripcion)-\u003eResult\u003c(),Errores\u003e{\n\t\t\n\t\tif self.usuario_en_sistema(c.dni_usuario){\n\t\t\tif !self.registro_suscripciones.iter().any(|s| s.dni_igual(c.dni_usuario) \u0026\u0026 s.activo){\n\t\t\t\tself.registro_suscripciones.push(c.clone());\n\t\t\t\tself.guardar_informacion()?;\n\t\t\t\treturn Ok(())\n\t\t\t}\n\t\t\treturn Err(Errores::ErrorOperatoria(error_operatoria::ContratoActivo(c.dni_usuario.to_string())))\n\t\t}\n\t\treturn Err(Errores::ErrorOperatoria(error_operatoria::Inexistente(String::from(\"Registro de usuarios\"))))\n\t}\n\tpub fn upgrade(\u0026mut self,u:\u0026Usuario)-\u003eResult\u003c(),Errores\u003e{\n\n\t\tif self.usuario_en_sistema(u.get_dni()){\n\n\t\t\tif let Some(sus) = self.registro_suscripciones.iter_mut().rev().find(|s| s.dni_igual(u.get_dni()) \u0026\u0026 s.activo){\n\t\t\t\tlet mut sus_nuevo = sus.clone();\n\t\t\t\tif sus_nuevo.upgrade_tipo(){\n\t\t\t\t\tsus.cancelar_suscripcion();\n\t\t\t\t\tself.registro_suscripciones.push(sus_nuevo);\n\t\t\t\t\tself.guardar_informacion()?;\n\t\t\t\t\treturn Ok(())\n\t\t\t\t}\n\t\t\t\treturn Err(Errores::ErrorOperatoria(error_operatoria::Rechazado(String::from(\"limite alcanzado para hacer upgrade\"))))\n\t\t\t}\n\t\t\treturn Err(Errores::ErrorOperatoria(error_operatoria::Rechazado(String::from(\"sin suscripciones activas\"))))\n\t\t}\n\t\treturn Err(Errores::ErrorOperatoria(error_operatoria::Inexistente(String::from(\"Registro de usuarios\"))))\n\t}\n\tpub fn downgrade(\u0026mut self,u:\u0026Usuario)-\u003eResult\u003c(),Errores\u003e{\n\t\t\n\t\tif self.usuario_en_sistema(u.get_dni()){\n\n\t\t\tif let Some(sus) = self.registro_suscripciones.iter_mut().rev().find(|s| s.dni_igual(u.get_dni()) \u0026\u0026 s.activo){\n\t\t\t\tlet mut sus_nuevo = sus.clone();\n\t\t\t\tsus.cancelar_suscripcion();\n\t\t\t\tif sus_nuevo.downgrade_tipo(){\n\t\t\t\t\tself.registro_suscripciones.push(sus_nuevo);\n\t\t\t\t}\n\t\t\t\t\n\t\t\t\tself.guardar_informacion()?;\n\t\t\t\treturn Ok(())\n\t\t\t}\n\t\t\treturn Err(Errores::ErrorOperatoria(error_operatoria::Rechazado(String::from(\"sin suscripciones activas para hacer downgrade\"))))\n\t\t}\n\t\treturn Err(Errores::ErrorOperatoria(error_operatoria::Inexistente(String::from(\"Registro de usuarios\"))))\n\t}\n\tpub fn cancelar_suscripcion(\u0026mut self,u:\u0026Usuario)-\u003eResult\u003c(),Errores\u003e{\n\t\tif self.usuario_en_sistema(u.get_dni()){\n\t\t\tif let Some(sus) = self.registro_suscripciones.iter_mut().rev().find(|s| s.dni_igual(u.get_dni()) \u0026\u0026 s.activo){\n\t\t\t\tsus.cancelar_suscripcion();\n\t\t\t\tself.guardar_informacion()?;\n\t\t\t\treturn Ok(())\n\t\t\t}\n\t\t\treturn Err(Errores::ErrorOperatoria(error_operatoria::Rechazado(String::from(\"sin suscripciones activas para cancelar\"))))\n\t\t}\n\t\treturn Err(Errores::ErrorOperatoria(error_operatoria::Inexistente(String::from(\"Registro de usuarios\"))))\n\t}\n\tfn listado_suscripciones(\u0026self,activos:bool)-\u003eVec\u003cContratoSuscripcion\u003e{\n\t\treturn self.registro_suscripciones.iter().filter(|s| s.activo == activos).cloned().collect()\n\t}\n\tpub fn metodopago_max_suscripciones_activas(\u0026self)-\u003eOption\u003cMediosDePago\u003e{\n\t\tlet mut res = None;\n\t\tlet mut listado = self.listado_suscripciones(true);\n\n\t\tif !listado.is_empty(){\n\t\t\tlet mut contador_tipos : HashMap\u003cMediosDePago,u32\u003e = HashMap::new();\n\t\t\tlistado.iter().for_each(|s|\n\t\t\t{\n\t\t\t\t*contador_tipos.entry(s.tipo_pago.clone()).or_insert(0) += 1;\n\t\t\t}\n\t\t\t);\n\n\t\t\tres = contador_tipos.into_iter().max_by_key(|\u0026(_,cant)| cant).map(|(tipo,_)|tipo);\n\t\t}\n\n\t\treturn res\n\t}\n\tpub fn metodopago_max_suscripciones_inactivas(\u0026self)-\u003eOption\u003cMediosDePago\u003e{\n\t\tlet mut res = None;\n\t\tlet mut listado = self.listado_suscripciones(false);\n\n\t\tif !listado.is_empty(){\n\t\t\tlet mut contador_tipos : HashMap\u003cMediosDePago,u32\u003e = HashMap::new();\n\t\t\tlistado.iter().for_each(|s|\n\t\t\t{\n\t\t\t\t*contador_tipos.entry(s.tipo_pago.clone()).or_insert(0) += 1;\n\t\t\t}\n\t\t\t);\n\n\t\t\tres = contador_tipos.into_iter().max_by_key(|\u0026(_,cant)| cant).map(|(tipo,_)|tipo);\n\t\t}\n\n\t\treturn res\n\t}\n\tpub fn tipo_suscripcion_max_activas(\u0026self)-\u003eOption\u003cTipoSuscripcion\u003e{\n\t\tlet mut res = None;\n\t\tlet mut listado = self.listado_suscripciones(true);\n\n\t\tif !listado.is_empty(){\n\t\t\tlet mut contador_tipos : HashMap\u003cTipoSuscripcion,u32\u003e = HashMap::new();\n\t\t\tlistado.iter().for_each(|s|\n\t\t\t{\n\t\t\t\t*contador_tipos.entry(s.tipo_suscripcion.clone()).or_insert(0) += 1;\n\t\t\t}\n\t\t\t);\n\n\t\t\tres = contador_tipos.into_iter().max_by_key(|\u0026(_,cant)| cant).map(|(tipo,_)|tipo);\n\t\t}\n\n\t\treturn res\n\t}\n\tpub fn tipo_suscripcion_max_inactivas(\u0026self)-\u003eOption\u003cTipoSuscripcion\u003e{\n\t\tlet mut res = None;\n\t\tlet mut listado = self.listado_suscripciones(false);\n\n\t\tif !listado.is_empty(){\n\t\t\tlet mut contador_tipos : HashMap\u003cTipoSuscripcion,u32\u003e = HashMap::new();\n\t\t\tlistado.iter().for_each(|s|\n\t\t\t{\n\t\t\t\t*contador_tipos.entry(s.tipo_suscripcion.clone()).or_insert(0) += 1;\n\t\t\t}\n\t\t\t);\n\n\t\t\tres = contador_tipos.into_iter().max_by_key(|\u0026(_,cant)| cant).map(|(tipo,_)|tipo);\n\t\t}\n\n\t\treturn res\n\t}\n}\n\n#[cfg(test)]\nmod test_ejercicio3{    \n    use super::*;\n\n\t#[test]\n\tfn cambio_suscripcion(){\n\t\tlet mut s1 = ContratoSuscripcion::new(1234,\u0026TipoSuscripcion::Basic, 100.0, 2, 120526, \u0026MediosDePago::Efectivo);\n\t\tlet mut s2 = ContratoSuscripcion::new(1234,\u0026TipoSuscripcion::Super, 100.0, 2, 120526, \u0026MediosDePago::Efectivo);\n\t\t\n\t\t//Cambio nulo\n\t\tassert!(!s1.downgrade_tipo());\n\t\tassert_eq!(s1.tipo_suscripcion,TipoSuscripcion::Basic);\n\n\t\tassert!(!s2.upgrade_tipo());\n\t\tassert_eq!(s2.tipo_suscripcion,TipoSuscripcion::Super);\n\n\t\t//Cambio hecho\n\t\tassert!(s1.upgrade_tipo());\n\t\tassert_eq!(s1.tipo_suscripcion,TipoSuscripcion::Clasic);\n\n\t\tassert!(s2.downgrade_tipo());\n\t\tassert_eq!(s2.tipo_suscripcion,TipoSuscripcion::Clasic);\n\n\t}\n\n\t#[test]\n\tfn registro_inicial(){\n\t\tlet mut sistema = Plataforma::new(\"./lista_suscripciones.json\");\n\t\tlet mut user1 = Usuario::new(\u0026\"Marco\", 12345);\n\t\tlet mut user2 = Usuario::new(\u0026\"Marco\",1234);\n\t\t\n\t\tassert!(sistema.registrar_usuario(\u0026user1));\n\t\tassert!(sistema.registrar_usuario(\u0026user2));\n\t\tassert_eq!(sistema.usuarios.len(),2);\n\t\tassert!(!sistema.registrar_usuario(\u0026user1));\n\t\tassert!(!sistema.registrar_usuario(\u0026user2));\n\t\tassert_eq!(sistema.usuarios.len(),2);\n\n\t\tlet mut s1 = ContratoSuscripcion::new(1234, \u0026TipoSuscripcion::Basic, 1000.0, 5, 200125, \u0026MediosDePago::Efectivo);\n\t\tlet mut s2 = ContratoSuscripcion::new(12345, \u0026TipoSuscripcion::Super, 5000.0, 5, 200125, \u0026MediosDePago::Efectivo);\n\t\tlet mut s3 = ContratoSuscripcion::new(2345, \u0026TipoSuscripcion::Super, 5000.0, 5, 200125, \u0026MediosDePago::Efectivo);\n\n\t\tassert!(sistema.registrar_contrato(\u0026s1).is_ok());\n\t\tassert!(sistema.registrar_contrato(\u0026s2).is_ok());\n\t\tassert!(sistema.registrar_contrato(\u0026s3).is_err_and(|e|{\n\t\t\tassert!(!e.to_string().is_empty());\n\t\t\tmatches!(e,Errores::ErrorOperatoria(error_operatoria::Inexistente(_)))\n\t\t}));\n\t\tassert!(sistema.registrar_contrato(\u0026s1).is_err_and(|e|{\n\t\t\tassert!(!e.to_string().is_empty());\n\t\t\tmatches!(e,Errores::ErrorOperatoria(error_operatoria::ContratoActivo(_)))\n\t\t}));\n\t\tlet mut s2 = ContratoSuscripcion::new(12345, \u0026TipoSuscripcion::Clasic, 5000.0, 5, 200125, \u0026MediosDePago::Efectivo);\n\t\tassert!(sistema.registrar_contrato(\u0026s2).is_err_and(|e|{\n\t\t\tassert!(!e.to_string().is_empty());\n\t\t\tmatches!(e,Errores::ErrorOperatoria(error_operatoria::ContratoActivo(_)))\n\t\t}));\n\t\tassert_eq!(sistema.listado_suscripciones(true).len(),2);\n\n\t\t//Limpieza para prevenir acumulacion de archivos\n        assert!(std::fs::remove_file(\"./lista_suscripciones.json\").is_ok(),\"Error fuera de lo previsto\");\n\t}\n\n\t\n\t#[test]\n\tfn registro_operatoria(){\n\t\tlet mut sistema = Plataforma::new(\"./lista_suscripciones2.json\");\n\t\tlet mut user1 = Usuario::new(\u0026\"Patricio\", 12345);\n\t\tlet mut user2 = Usuario::new(\u0026\"Patricio\",1234);\n\t\t\n\t\tsistema.registrar_usuario(\u0026user1);\n\t\tsistema.registrar_usuario(\u0026user2);\n\n\t\t//Suscripcion para user2\n\t\tlet mut s1 = ContratoSuscripcion::new(1234, \u0026TipoSuscripcion::Basic, 1000.0, 5, 200125, \u0026MediosDePago::Efectivo);\n\t\t//Suscripcion para user1\n\t\tlet mut s2 = ContratoSuscripcion::new(12345, \u0026TipoSuscripcion::Super, 5000.0, 5, 200125, \u0026MediosDePago::Efectivo);\n\t\n\t\tassert!(sistema.registrar_contrato(\u0026s1).is_ok());\n\t\tassert!(sistema.registrar_contrato(\u0026s2).is_ok());\n\n\t\tassert!(sistema.downgrade(\u0026user2).is_ok());\n\t\tassert!(sistema.upgrade(\u0026user1).is_err_and(|e|{\n\t\t\tassert!(!e.to_string().is_empty());\n\t\t\tmatches!(e,Errores::ErrorOperatoria(error_operatoria::Rechazado(_)))\n\t\t}));\n\n\t\tassert_eq!(sistema.registro_suscripciones.len(),2);\n\n\t\tassert!(sistema.upgrade(\u0026user2).is_err_and(|e|{\n\t\t\tassert!(!e.to_string().is_empty());\n\t\t\tmatches!(e,Errores::ErrorOperatoria(error_operatoria::Rechazado(_)))\n\t\t}));\n\t\tassert!(sistema.downgrade(\u0026user1).is_ok());\n\t\tassert!(sistema.downgrade(\u0026user1).is_ok());\n\n\t\ts1 = ContratoSuscripcion::new(1234, \u0026TipoSuscripcion::Clasic, 2500.0, 5, 200125, \u0026MediosDePago::Efectivo);\n\t\tassert!(sistema.registrar_contrato(\u0026s1).is_ok());\n\t\tassert!(sistema.cancelar_suscripcion(\u0026user1).is_ok());\n\n\t\tassert_eq!(sistema.registro_suscripciones.len(),5);\n\t\tassert_eq!(sistema.listado_suscripciones(true).len(),1);\n\t\tassert_eq!(sistema.listado_suscripciones(false).len(),4);\n\n\t\t//Limpieza para prevenir acumulacion de archivos\n        assert!(std::fs::remove_file(\"./lista_suscripciones2.json\").is_ok(),\"Error fuera de lo previsto\");\n\t\n\t} \n\t\n\tfn construir_sistema()-\u003eResult\u003cPlataforma,Errores\u003e{\n\t\tlet mut sistema = Plataforma::new(\"./lista_suscripciones3.json\");\n\t\tlet user1 = Usuario::new(\u0026\"Patricio\", 12345);\n\t\tlet user2 = Usuario::new(\u0026\"Patricio\",1234);\n\t\tlet user3 = Usuario::new(\u0026\"Matias\", 4554);\n\t\tlet user4 = Usuario::new(\u0026\"David\",3487);\n\n\t\tsistema.registrar_usuario(\u0026user1);\n\t\tsistema.registrar_usuario(\u0026user2);\n\t\tsistema.registrar_usuario(\u0026user3);\n\t\tsistema.registrar_usuario(\u0026user4);\n\n\t\tlet s1 = ContratoSuscripcion::new(12345, \u0026TipoSuscripcion::Basic, 1000.0, 5, 200125, \u0026MediosDePago::Efectivo);\n\t\tlet s2 = ContratoSuscripcion::new(1234, \u0026TipoSuscripcion::Basic, 1000.0, 5, 200125, \u0026MediosDePago::MercadoPago(InfoMercadoPago { alias: \"zapato\".to_string(), cuil: 123456 }));\n\t\tlet s3 = ContratoSuscripcion::new(4554, \u0026TipoSuscripcion::Basic, 1000.0, 5, 200125, \u0026MediosDePago::Criptomoneda(InfoCripto { wallet_address : \"asd2354tg42t\".to_string(), red: \"%#1234\".to_string() }));\n\t\tlet s4 = ContratoSuscripcion::new(3487, \u0026TipoSuscripcion::Basic, 1000.0, 5, 200125, \u0026MediosDePago::Efectivo);\n\n\t\tsistema.registrar_contrato(\u0026s1)?;\n\t\tsistema.registrar_contrato(\u0026s2)?;\n\t\tsistema.registrar_contrato(\u0026s3)?;\n\t\tsistema.registrar_contrato(\u0026s4)?;\n\n\t\treturn Ok(sistema)\n\t}\n\n\t#[test]\n\tfn validacion_maximos(){\n\t\tlet mut sis = Plataforma::new(\"./lista_suscripciones_vacio.json\");\n\n\t\t//Plataforma vacia\n\t\tassert!(sis.metodopago_max_suscripciones_activas().is_none());\n\t\tassert!(sis.tipo_suscripcion_max_activas().is_none());\n\t\tassert!(sis.metodopago_max_suscripciones_inactivas().is_none());\n\t\tassert!(sis.tipo_suscripcion_max_inactivas().is_none());\n\n\t\tassert!(construir_sistema().is_ok_and(|s|{\n\t\t\tsis = s;\n\t\t\ttrue\n\t\t}),\"Aqui no debio fallar\");\n\n\t\t//Suscripciones activas\n\t\tassert!(sis.metodopago_max_suscripciones_activas().is_some_and(|res|{\n\t\t\tmatches!(res,MediosDePago::Efectivo)\n\t\t}),\"Debio retornar un maximo\");\n\n\t\tassert!(sis.tipo_suscripcion_max_activas().is_some_and(|res|{\n\t\t\tmatches!(res,TipoSuscripcion::Basic)\n\t\t}),\"Debio retornar un maximo\");\n\n\t\tassert!(sis.metodopago_max_suscripciones_inactivas().is_none());\n\t\tassert!(sis.tipo_suscripcion_max_inactivas().is_none());\n\t\t\n\t\t//Con registro de operaciones con suscripciones\n\t\tassert!(sis.downgrade(\u0026Usuario::new(\u0026\"Patricio\", 12345)).is_ok());\n\t\tassert!(sis.downgrade(\u0026Usuario::new(\u0026\"Patricio\", 1234)).is_ok());\n\t\tassert!(sis.upgrade(\u0026Usuario::new(\u0026\"Matias\", 4554)).is_ok());\n\t\tassert!(sis.upgrade(\u0026Usuario::new(\u0026\"David\",3487)).is_ok());\n\t\tassert!(sis.upgrade(\u0026Usuario::new(\u0026\"David\",3487)).is_ok());\n\t\tassert!(sis.cancelar_suscripcion(\u0026Usuario::new(\u0026\"David\",3487)).is_ok());\n\n\t\t//Activas\n\t\tassert!(sis.metodopago_max_suscripciones_activas().is_some_and(|res|{\n\t\t\tmatches!(res,MediosDePago::Criptomoneda(_))\n\t\t}),\"Debio retornar un maximo\");\n\n\t\tassert!(sis.tipo_suscripcion_max_activas().is_some_and(|res|{\n\t\t\tmatches!(res,TipoSuscripcion::Clasic)\n\t\t}),\"Debio retornar un maximo\");\n\n\t\t//Inactivas\n\t\tassert!(sis.metodopago_max_suscripciones_inactivas().is_some_and(|res|{\n\t\t\tmatches!(res,MediosDePago::Efectivo)\n\t\t}),\"Debio retornar un maximo\");\n\n\t\tassert!(sis.tipo_suscripcion_max_inactivas().is_some_and(|res|{\n\t\t\tmatches!(res,TipoSuscripcion::Basic)\n\t\t}),\"Debio retornar un maximo\");\n\t\t\n\t\t//Limpieza para prevenir exceso de archivos\n\t\tassert!(std::fs::remove_file(\"./lista_suscripciones3.json\").is_ok(),\"Error fuera de lo previsto\");\n\t}\n\n\t/*\n\t\tCasos especiales para la cobertura de coverage\n\t*/\n\t#[test]\n\tfn caso_especial_error_io_() {\n\t\t// Se buscara forzar un ErrorIO usando una ruta cuyo directorio base no existe\n\t\tlet path_err = \"./carpeta_inexistente_123/x.json\";\n\n\t\tlet mut sis = Plataforma::new(path_err);\n        let user1 = Usuario::new(\u0026\"Patricio\", 12345);\n\n\t\tsis.registrar_usuario(\u0026user1);\n\t\t\n\t\tlet s1 = ContratoSuscripcion::new(12345, \u0026TipoSuscripcion::Basic, 1000.0, 5, 200125, \u0026MediosDePago::Efectivo);\n\t\n        // Al intentar registrar una suscripcion, llamará internamente a File::create() en la ruta rota, provocando un ErrorIO\n        \n\t\tassert!(sis.registrar_contrato(\u0026s1).is_err_and(|e|{\n                assert!(!e.to_string().is_empty());\n\t\t\t    matches!(e, Errores::ErrorIO(_))\n        }),\"Ocurrio un error imprevisto\");\n\t}\n\n\n\t#[test]\n\tfn caso_especial_error_serde() {\n\t\tlet path_err = \"./corrupto.json\";\n\t\t\n\t\t// Se fuerza la escritura en el contenido temporal que NO cumple con el formato estructurado de un .JSON válido\n\t\tassert!(std::fs::write(path_err, \"{ \u0026\u00265435#$#$\u002642365_XXXX1234 : [::: \").is_ok(),\"No debio fallar aqui\");\n\n\t\t// Se invoca directamente el método para leer el archivo del path que buscara\n\n\t\tassert!(Plataforma::recuperar_informacion(path_err).is_err_and(|e|{\n\t\t\tassert!(!e.to_string().is_empty());\n\t\t\tmatches!(e, Errores::ErrorSerde(_))\n\t\t}),\"Aquí debió fallar\");\n\n\t\tassert!(std::fs::remove_file(path_err).is_ok(),\"Error fuera de lo previsto\");\n\t\t\n\t}\n\t\n}","traces":[{"line":23,"address":[3156944],"length":1,"stats":{"Line":1}},{"line":24,"address":[3156977],"length":1,"stats":{"Line":1}},{"line":25,"address":[3157013],"length":1,"stats":{"Line":1}},{"line":26,"address":[3157124],"length":1,"stats":{"Line":0}},{"line":27,"address":[3157268],"length":1,"stats":{"Line":1}},{"line":28,"address":[3157412],"length":1,"stats":{"Line":1}},{"line":41,"address":[3153408],"length":1,"stats":{"Line":1}},{"line":42,"address":[3153441],"length":1,"stats":{"Line":1}},{"line":43,"address":[3153498],"length":1,"stats":{"Line":1}},{"line":44,"address":[3153605],"length":1,"stats":{"Line":1}},{"line":45,"address":[3153749],"length":1,"stats":{"Line":1}},{"line":55,"address":[3158656],"length":1,"stats":{"Line":1}},{"line":56,"address":[3158664],"length":1,"stats":{"Line":1}},{"line":61,"address":[3158688],"length":1,"stats":{"Line":0}},{"line":62,"address":[3158696],"length":1,"stats":{"Line":0}},{"line":148,"address":[3152864],"length":1,"stats":{"Line":1}},{"line":149,"address":[3152897],"length":1,"stats":{"Line":1}},{"line":151,"address":[3152960],"length":1,"stats":{"Line":1}},{"line":152,"address":[3152965],"length":1,"stats":{"Line":1}},{"line":157,"address":[3152544],"length":1,"stats":{"Line":1}},{"line":158,"address":[3152702],"length":1,"stats":{"Line":1}},{"line":160,"address":[3152649],"length":1,"stats":{"Line":1}},{"line":165,"address":[3152663],"length":1,"stats":{"Line":1}},{"line":168,"address":[3152528],"length":1,"stats":{"Line":1}},{"line":169,"address":[3152533],"length":1,"stats":{"Line":1}},{"line":171,"address":[3152336,3152382],"length":1,"stats":{"Line":1}},{"line":172,"address":[3152346],"length":1,"stats":{"Line":1}},{"line":173,"address":[3152351],"length":1,"stats":{"Line":1}},{"line":174,"address":[3152389],"length
